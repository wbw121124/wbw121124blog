	<script type="application/json" id="post-data">{"id":"状压DP（二）","metadata":{"id":"状压DP（二）","title":"状压 DP（二）","date":"2025-05-03","tags":["动态规划","状态压缩"],"summary":"P3092 USACO13NOV No Change G https://www.luogu.com.cn/problem/P3092 \n这道题，我们一般定义 $dp {i,j}$ 为硬币使用了二进制下的 $i$，付到第 $j$ 个人的最多剩下多少钱..."},"markdown":"# 状压DP（二）\r\n\r\n## 洛谷P3092\r\n\r\n[P3092 [USACO13NOV] No Change G](https://www.luogu.com.cn/problem/P3092)\r\n\r\n这道题，我们一般定义 $dp_{i,j}$ 为硬币使用了二进制下的 $i$，付到第 $j$ 个人的最多剩下多少钱。\r\n\r\n不过 $2^{16}\\times 10^5=6,553,600,000$，会超过空间限制。\r\n\r\n我们发现“最多剩下多少钱”没有用，因为可以通过使用情况算出。\r\n\r\n定义新的状态 $dp_{i}$ 表示硬币使用了二进制下的 $i$ 的最多能付到的人，可以通过前缀和加二分优化计算。\r\n\r\n\u003c!-- more -->\r\n\r\n答案需要枚举。\r\n\r\n```cpp\r\n#include\u003cbits/stdc++.h>\r\ntypedef int int32;\r\n#define int long long\r\nusing namespace std;\r\nconst int N = 1e5 + 5;\r\nint n, m, dp[1 \u003c\u003c 16], a[N], b[N], sum[N], sum1, ans = -1;\r\nsigned main()\r\n{\r\n\tios::sync_with_stdio(0);\r\n\tcin.tie(0), cout.tie(0);\r\n\tcin >> n >> m;\r\n\tfor (int i = 0; i \u003c n; i++)\r\n\t\tcin >> a[i], sum1 += a[i];\r\n\tfor (int i = 1; i \u003c= m; i++)\r\n\t\tcin >> b[i], sum[i] = sum[i - 1] + b[i];\r\n\tfor (int i = 1; i \u003c (1 \u003c\u003c n); i++)\r\n\t{\r\n\t\tint sum2 = 0;\r\n\t\tfor (int j = 0; j \u003c n; j++)\r\n\t\t\tif ((i >> j) & 1)\r\n\t\t\t{\r\n\t\t\t\tint& tmp = dp[i ^ (1 \u003c\u003c j)];\r\n\t\t\t\tint l = tmp - 1, r = m + 1;\r\n\t\t\t\twhile (l + 1 \u003c r)\r\n\t\t\t\t{\r\n\t\t\t\t\tint mid = (l + r) >> 1;\r\n\t\t\t\t\tif (sum[mid] - sum[tmp] \u003c= a[j])\r\n\t\t\t\t\t\tl = mid;\r\n\t\t\t\t\telse\r\n\t\t\t\t\t\tr = mid;\r\n\t\t\t\t}\r\n\t\t\t\tdp[i] = max(dp[i], l);\r\n\t\t\t\tsum2 += a[j];\r\n\t\t\t}\r\n\t\tif (dp[i] == m)\r\n\t\t\tans = max(ans, sum1 - sum2);\r\n\t}\r\n\tcout \u003c\u003c ans;\r\n\treturn 0;\r\n}\r\n```\r\n\r\n## 洛谷P5911\r\n\r\n[P5911 [POI 2004] PRZ - 洛谷](https://www.luogu.com.cn/problem/P5911)\r\n\r\n定义 $dp_i$ 表示已经过桥的队员为二进制下的 $i$ 的最小过桥时间。\r\n\r\n状态转移：\r\n\r\n```cpp\r\nfor (int i = 1; i \u003c (1 \u003c\u003c n); i++)\r\n    for (int j = 1; j \u003c (1 \u003c\u003c n); j++)\r\n        if ((i & j) == j && sum[j] \u003c= m)\r\n            dp[i] = min(dp[i], dp[i ^ j] + maxi[j]);\r\n```\r\n\r\n答案为 $dp_{2^n-1}$。\r\n\r\n时间复杂度为 $O(4^n)$。\r\n\r\n等一等，$4^{16}=4,294,967,296\\gt \\text{一秒内可以跑的循环次数}$。\r\n\r\n考虑优化，如何不枚举无效状态（也就是只枚举子集）？\r\n\r\n```cpp\r\nfor (int i = 1; i \u003c (1 \u003c\u003c n); i++)\r\n    for (int j = i; j; j = (j - 1) & i)\r\n```\r\n\r\n为什么正确？\r\n\r\n可以通过模拟验证：\r\n\r\n> 设 $i={(114)}_{10}={(01110010)}_2$。\r\n>\r\n> 第二次枚举时， $j=\\left({(01110010)}_2-1\\right)\\operatorname{and}{(01110010)}_2={(01110000)}_2$。\r\n>\r\n> 第三次枚举时， $j=\\left({(01110000)}_2-1\\right)\\operatorname{and}{(01110010)}_2={(01101111)}_2\\operatorname{and}{(01110010)}_2={(01100010)}_2$。\r\n>\r\n> $\\cdots$\r\n>\r\n> 以此类推。\r\n>\r\n> 我们发现下枚举总是小于这一次的最大的有效状态。\r\n\r\n```cpp\r\n#include\u003cbits/stdc++.h>\r\ntypedef int int32;\r\n#define int long long\r\nusing namespace std;\r\nconst int N = 16 + 5;\r\nint n, m, dp[1 \u003c\u003c 16], a[N], b[N], sum[1 \u003c\u003c 16], maxi[1 \u003c\u003c 16];\r\nsigned main()\r\n{\r\n\tios::sync_with_stdio(0);\r\n\tcin.tie(0), cout.tie(0);\r\n\tcin >> m >> n;\r\n\tmemset(dp, 0x3f, sizeof dp);\r\n\tdp[0] = 0;\r\n\tfor (int i = 0; i \u003c n; i++)\r\n\t{\r\n\t\tcin >> a[i] >> b[i];\r\n\t\tfor (int j = 1; j \u003c (1 \u003c\u003c n); j++)\r\n\t\t\tif ((j >> i) & 1)\r\n\t\t\t\tsum[j] += b[i], maxi[j] = max(maxi[j], a[i]);\r\n\t}\r\n\tfor (int i = 1; i \u003c (1 \u003c\u003c n); i++)\r\n\t\tfor (int j = i; j; j = (j - 1) & i)\r\n\t\t\tif (sum[j] \u003c= m)\r\n\t\t\t\tdp[i] = min(dp[i], dp[i ^ j] + maxi[j]);\r\n\tcout \u003c\u003c dp[(1 \u003c\u003c n) - 1];\r\n\treturn 0;\r\n}\r\n```\r\n\r\n时间复杂度 $O(3^n)$。\r\n\r\n为什么？\r\n\r\n证明方法一：\r\n\r\n> 每个队员有以下可以枚举的状态：\r\n>\r\n> 1. 没有；\r\n> 2. $i$ 中有；\r\n> 3. $i,j$ 中都有。\r\n>\r\n> 因此是 $O(3^n)$\r\n\r\n证明方法二：\r\n\r\n> 前置知识：\r\n>\r\n> > [二项式定理](https://oi-wiki.org/math/combinatorics/combination/#%E4%BA%8C%E9%A1%B9%E5%BC%8F%E5%AE%9A%E7%90%86)：\r\n> >\r\n> > $$\\displaystyle(x+y)^n=\\sum^n_{i=0}\\operatorname{C}^i_nx^iy^{n-i}$$\r\n>\r\n> 总枚举次数为 $\\displaystyle\\sum_{i=0}^{2^n}2^{\\operatorname{popcount}i}$，其中 $\\operatorname{popcount}i$ 为二进制下的 $i$ 的 $1$ 的个数。\r\n>\r\n> $$\\begin{aligned}\\sum_{i=0}^{2^n}2^{\\operatorname{popcount}i}&=\\sum_{i=0}^n\\operatorname{C}^i_n 2^n\\\\&=\\sum_{i=0}^n\\operatorname{C}^i_n 2^n\\times1\\\\&=(2+1)^n\\\\&=3^n\\end{aligned}$$\r\n\r\n## 洛谷P3694\r\n\r\n[P3694 邦邦的大合唱站队](https://www.luogu.com.cn/problem/P3694)\r\n\r\n考虑状态 $dp_i$ 为已经排好的乐队为二进制下的 $i$ 的出列人数，用前缀和辅助动态规划。\r\n\r\n答案为 $dp_{2^m-1}$。\r\n\r\n```cpp\r\n#include\u003cbits/stdc++.h>\r\ntypedef int int32;\r\n#define int long long\r\nusing namespace std;\r\nconst int N = 1e5 + 5;\r\nint n, m, dp[1 \u003c\u003c 20], a[N], sum[N][20], sum1[1 \u003c\u003c 20];\r\nsigned main()\r\n{\r\n\tios::sync_with_stdio(0);\r\n\tcin.tie(0), cout.tie(0);\r\n\tcin >> n >> m;\r\n\tmemset(dp, 0x3f, sizeof dp);\r\n\tdp[0] = 0;\r\n\tfor (int i = 1; i \u003c= n; i++)\r\n\t{\r\n\t\tcin >> a[i];\r\n\t\tfor (int j = 0; j \u003c m; j++)\r\n\t\t\tsum[i][j] = sum[i - 1][j];\r\n\t\tsum[i][--a[i]]++;\r\n\t}\r\n\tfor (int i = 1; i \u003c (1 \u003c\u003c m); i++)\r\n\t\tfor (int j = 0; j \u003c m; j++)\r\n\t\t\tif ((i >> j) & 1)\r\n\t\t\t{\r\n\t\t\t\tsum1[i] = sum1[i ^ (1 \u003c\u003c j)] + sum[n][j];\r\n\t\t\t\tint l = sum1[i ^ (1 \u003c\u003c j)] + 1, r = l + sum[n][j] - 1;\r\n\t\t\t\tdp[i] = min(dp[i], dp[i ^ (1 \u003c\u003c j)] + sum[n][j] -\r\n\t\t\t\t\tsum[r][j] + sum[l - 1][j]);\r\n\t\t\t}\r\n\tcout \u003c\u003c dp[(1 \u003c\u003c m) - 1];\r\n\treturn 0;\r\n}\r\n```\r\n\r\n## 洛谷P10449\r\n\r\n[P10449 费解的开关](https://www.luogu.com.cn/problem/P10449)\r\n\r\n对于每一组数据，我们暴力还原，时间复杂度 $O(26^6n)=O(n)$，常数十分大。\r\n\r\n为什么不预处理呢？\r\n\r\n为了方便存储，我们状态压缩数组，使用 dfs/bfs 搜索。\r\n\r\n```cpp\r\n#include\u003cbits/stdc++.h>\r\ntypedef int int32;\r\n#define int long long\r\nusing namespace std;\r\nconst int N = 1e5 + 5;\r\nint t, dx[] = { 0,0,0,1,-1 }, dy[] = { 0,1,-1,0,0 };\r\nmap\u003cint, int>mp;\r\nint work(int z, int x, int y)\r\n{\r\n\tfor (int i = 0; i \u003c 5; i++)\r\n\t{\r\n\t\tint nx = x + dx[i], ny = y + dy[i];\r\n\t\tif (nx \u003c 6 && nx && ny \u003c 6 && ny)\r\n\t\t\tz ^= 1 \u003c\u003c ((nx - 1) * 5 + ny - 1);\r\n\t}\r\n\treturn z;\r\n}\r\nvoid dfs(int x, int y, int z = (1 \u003c\u003c 25) - 1, int sum = 0)\r\n{\r\n\tif (sum > 6)\r\n\t\treturn;\r\n\tmp[z] = sum;\r\n\tif (x == 6)\r\n\t\treturn;\r\n\tdfs(x + !(y % 5), y % 5 + 1, z, sum);\r\n\tdfs(x + !(y % 5), y % 5 + 1, work(z, x, y), sum + 1);\r\n\treturn;\r\n}\r\nsigned main()\r\n{\r\n\tios::sync_with_stdio(0);\r\n\tcin.tie(0), cout.tie(0);\r\n\tdfs(1, 1);\r\n\tcin >> t;\r\n\twhile (t--)\r\n\t{\r\n\t\tint sum = 0;\r\n\t\tfor (int i = 1; i \u003c= 25; i++)\r\n\t\t{\r\n\t\t\tchar c;\r\n\t\t\tcin >> c;\r\n\t\t\tsum |= (c - '0') \u003c\u003c (25 - i);\r\n\t\t}\r\n\t\tif (!mp.count(sum))\r\n\t\t\tcout \u003c\u003c \"-1\\n\";\r\n\t\telse\r\n\t\t\tcout \u003c\u003c mp[sum] \u003c\u003c '\\n';\r\n\t}\r\n\treturn 0;\r\n}\r\n```","html":"\u003ch1 id=\"%E7%8A%B6%E5%8E%8Bdp%EF%BC%88%E4%BA%8C%EF%BC%89\" tabindex=\"-1\">状压 DP（二） \u003ca href=\"#%E7%8A%B6%E5%8E%8Bdp%EF%BC%88%E4%BA%8C%EF%BC%89\" class=\"header-anchor\">¶\u003c/a>\u003c/h1>\n\u003ch2 id=\"%E6%B4%9B%E8%B0%B7p3092\" tabindex=\"-1\">洛谷 P3092 \u003ca href=\"#%E6%B4%9B%E8%B0%B7p3092\" class=\"header-anchor\">¶\u003c/a>\u003c/h2>\n\u003cp>\u003ca href=\"https://www.luogu.com.cn/problem/P3092\">P3092 [USACO13NOV] No Change G\u003c/a>\u003c/p>\n\u003cp>这道题，我们一般定义 \u003cspan tabindex=\"0\" role=\"text\" aria-label=\"d, p, start subscript, i, comma, j, end subscript\">\u003cspan class=\"katex\">\u003cspan class=\"katex-mathml\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\">\u003csemantics>\u003cmrow>\u003cmi>d\u003c/mi>\u003cmsub>\u003cmi>p\u003c/mi>\u003cmrow>\u003cmi>i\u003c/mi>\u003cmo separator=\"true\">,\u003c/mo>\u003cmi>j\u003c/mi>\u003c/mrow>\u003c/msub>\u003c/mrow>\u003cannotation encoding=\
