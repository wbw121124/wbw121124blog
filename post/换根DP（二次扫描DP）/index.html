	<script type="application/json" id="post-data">{"id":"换根DP（二次扫描DP）","metadata":{"id":"换根DP（二次扫描DP）","title":"换根 DP（二次扫描 DP）","date":"2025-09-27","tags":["动态规划","树形结构"],"summary":"对于树形 DP，若给定无根树，而问题的最优解与根节点相关，那么考虑换根 DP。 \n通常可以将枚举根节点跑 DP 的时间复杂度由 $O N^2 $ 降为 $O N $..."},"markdown":"# 换根DP（二次扫描DP）\r\n## 介绍\r\n对于树形DP，若给定无根树，而问题的最优解与根节点相关，那么考虑换根DP。\r\n\r\n通常可以将枚举根节点跑DP的时间复杂度由 $O(N^2)$ 降为 $O(N)$。\r\n\r\n\u003c!--more-->\r\n\r\n## 换根DP的实现步骤\r\n1. 定义 $dp_i$ 表示以 $i$ 为根节点的子树，XXX的最值或方案数；跑一遍从下到上转移的树形DP（$dfs(root)$）；\r\n2. 定义 $f_i$ 表示点 $i$ 为全局根节点的XXX的最值或方案数，并令 $f_1=dp_1$；\r\n3. 再跑一遍从上到下转移的树形DP（$dfs1(root)$）。\r\n\r\n## 例题\r\n\r\n### 洛谷P3478\r\n[P3478 [POI 2008] STA-Station](https://www.luogu.com.cn/problem/P3478)\r\n\r\n定义 $dp_i$ 表示以 $i$ 为根节点的子树深度之和最大值。\r\n\r\n$$dp_x=dep_x+\\sum^{nxt}_{nxt\\in children_x}dp_{nxt}$$\r\n\r\n定义 $f_i$ 表示点 $i$ 为全局根节点的深度之和最大值。\r\n\r\n设 $f_{nxt}=ff$，则：\r\n\r\n$$\\begin{aligned}ff & = (f_x-ff)+(n-size_{nxt})+(ff-size_{nxt})\\\\&=f_x-2size_{nxt}+n\\end{aligned}$$\r\n\r\n当然，这道题因为求的是选择的结点编号，所以可以不设 $dp_i$（不推荐）。\r\n\r\n```cpp\r\n#include\u003cbits/stdc++.h>\r\ntypedef int int32;\r\n#define int long long\r\nusing namespace std;\r\nconst int N = 1e6 + 5;\r\nint n, dp[N], f[N], size[N];\r\nvector\u003cint>nbr[N];\r\nvoid dfs(int x, int fa, int sum)\r\n{\r\n\tdp[x] = sum;\r\n\t::size[x] = 1;\r\n\tfor (auto& nxt : nbr[x])\r\n\t\tif (nxt != fa)\r\n\t\t{\r\n\t\t\tdfs(nxt, x, sum + 1);\r\n\t\t\t::size[x] += ::size[nxt];\r\n\t\t\tdp[x] += dp[nxt];\r\n\t\t}\r\n\treturn;\r\n}\r\nvoid dfs1(int x, int fa)\r\n{\r\n\tfor (auto& nxt : nbr[x])\r\n\t\tif (nxt != fa)\r\n\t\t{\r\n\t\t\tf[nxt] = f[x] - 2 * ::size[nxt] + n;\r\n\t\t\tdfs1(nxt, x);\r\n\t\t}\r\n\treturn;\r\n}\r\nsigned main()\r\n{\r\n\tios::sync_with_stdio(0);\r\n\tcin.tie(0), cout.tie(0);\r\n\tcin >> n;\r\n\tfor (int i = 1; i \u003c n; i++)\r\n\t{\r\n\t\tint x, y;\r\n\t\tcin >> x >> y;\r\n\t\tnbr[x].push_back(y);\r\n\t\tnbr[y].push_back(x);\r\n\t}\r\n\tdfs(1, 0, 0);\r\n\tf[1] = dp[1];\r\n\tdfs1(1, 0);\r\n\tint id = 1;\r\n\tfor (int i = 2; i \u003c= n; i++)\r\n\t\tif (f[i] > f[id])\r\n\t\t\tid = i;\r\n\tcout \u003c\u003c id;\r\n\treturn 0;\r\n}\r\n```\r\n\r\n### 洛谷P2986\r\n[P2986 [USACO10MAR] Great Cow Gathering G](https://www.luogu.com.cn/problem/P2986)\r\n\r\n定义 $dp_i$ 表示以 $i$ 为根节点的子树每只奶牛去参加集会所走的路程之和。\r\n\r\n$$dp_x=\\sum^{nxt}_{nxt\\in children_x}dp_{nxt}+w_{x,nxt}size_{nxt}$$\r\n\r\n定义 $f_i$ 表示点 $i$ 为全局根节点每只奶牛去参加集会所走的路程之和。\r\n\r\n$$f_{nxt}=f_x+w_{x,nxt}(size_1-2size_{nxt})$$\r\n\r\n```cpp\r\n#include\u003cbits/stdc++.h>\r\ntypedef int int32;\r\n#define int long long\r\nusing namespace std;\r\nconst int N = 1e5 + 5;\r\nint n, dp[N], a[N], f[N], size[N];\r\nvector\u003cpair\u003cint, int>>nbr[N];\r\nvoid dfs(int x, int fa, int sum)\r\n{\r\n\tdp[x] = 0;\r\n\t::size[x] = a[x];\r\n\tfor (auto& y : nbr[x])\r\n\t{\r\n\t\tauto& nxt = y.first, & w = y.second;\r\n\t\tif (nxt != fa)\r\n\t\t{\r\n\t\t\tdfs(nxt, x, sum + 1);\r\n\t\t\t::size[x] += ::size[nxt];\r\n\t\t\tdp[x] += w * ::size[nxt] + dp[nxt];\r\n\t\t}\r\n\t}\r\n\treturn;\r\n}\r\nvoid dfs1(int x, int fa)\r\n{\r\n\tfor (auto& y : nbr[x])\r\n\t{\r\n\t\tauto& nxt = y.first, & w = y.second;\r\n\t\tif (nxt != fa)\r\n\t\t{\r\n\t\t\tf[nxt] = f[x] + (::size[1] - 2 * ::size[nxt]) * w;\r\n\t\t\tdfs1(nxt, x);\r\n\t\t}\r\n\t}\r\n\treturn;\r\n}\r\nsigned main()\r\n{\r\n\tios::sync_with_stdio(0);\r\n\tcin.tie(0), cout.tie(0);\r\n\tcin >> n;\r\n\tfor (int i = 1; i \u003c= n; i++)\r\n\t\tcin >> a[i];\r\n\tfor (int i = 1; i \u003c n; i++)\r\n\t{\r\n\t\tint x, y, z;\r\n\t\tcin >> x >> y >> z;\r\n\t\tnbr[x].push_back({ y,z });\r\n\t\tnbr[y].push_back({ x,z });\r\n\t}\r\n\tdfs(1, 0, 0);\r\n\tf[1] = dp[1];\r\n\tdfs1(1, 0);\r\n\tint id = 1;\r\n\tfor (int i = 2; i \u003c= n; i++)\r\n\t\tif (f[i] \u003c f[id])\r\n\t\t\tid = i;\r\n\tcout \u003c\u003c f[id];\r\n\treturn 0;\r\n}\r\n```\r\n\r\n### CF1187E\r\n[Tree Painting](https://codeforces.com/problemset/problem/1187/E)|[中文翻译](https://vjudge.net/problem/CodeForces-1187E#author=DeepSeek_zh)\r\n\r\n定义 $dp_i$ 表示以 $i$ 为根节点的子树获得的总分数。\r\n\r\n$$dp_x=dep_x\\sum^{nxt}_{nxt\\in children_x}dp_{nxt}$$\r\n\r\n定义 $f_i$ 表示点 $i$ 为全局根节点获得的总分数。\r\n\r\n$$f_{nxt}=f_x+n-2size_{nxt}$$\r\n\r\n```cpp\r\n#include\u003cbits/stdc++.h>\r\ntypedef int int32;\r\n#define int long long\r\nusing namespace std;\r\nconst int N = 1e6 + 5;\r\nint n, dp[N], f[N], size[N];\r\nvector\u003cint>nbr[N];\r\nvoid dfs(int x, int fa, int sum)\r\n{\r\n\tdp[x] = sum;\r\n\t::size[x] = 1;\r\n\tfor (auto& nxt : nbr[x])\r\n\t\tif (nxt != fa)\r\n\t\t{\r\n\t\t\tdfs(nxt, x, sum + 1);\r\n\t\t\t::size[x] += ::size[nxt];\r\n\t\t\tdp[x] += dp[nxt];\r\n\t\t}\r\n\treturn;\r\n}\r\nvoid dfs1(int x, int fa)\r\n{\r\n\tfor (auto& nxt : nbr[x])\r\n\t\tif (nxt != fa)\r\n\t\t{\r\n\t\t\tf[nxt] = f[x] - 2 * ::size[nxt] + n;\r\n\t\t\tdfs1(nxt, x);\r\n\t\t}\r\n\treturn;\r\n}\r\nsigned main()\r\n{\r\n\tios::sync_with_stdio(0);\r\n\tcin.tie(0), cout.tie(0);\r\n\tcin >> n;\r\n\tfor (int i = 1; i \u003c n; i++)\r\n\t{\r\n\t\tint x, y;\r\n\t\tcin >> x >> y;\r\n\t\tnbr[x].push_back(y);\r\n\t\tnbr[y].push_back(x);\r\n\t}\r\n\tdfs(1, 0, 1);\r\n\tf[1] = dp[1];\r\n\tdfs1(1, 0);\r\n\tint id = 1;\r\n\tfor (int i = 2; i \u003c= n; i++)\r\n\t\tif (f[i] > f[id])\r\n\t\t\tid = i;\r\n\tcout \u003c\u003c f[id];\r\n\treturn 0;\r\n}\r\n```\r\n\r\n### CF1324F\r\n[Maximum White Subtree](https://codeforces.com/problemset/problem/1324/F)|[中文翻译](https://vjudge.net/problem/CodeForces-1324F#author=DeepSeek_zh)\r\n\r\n当确定第一个染色节点 $x$ 后, 之后都只能染黑色节点的邻接点；\r\n\r\n若 $x$ 作为根，则染色顺序一定是从上到下，且代价确定；\r\n\r\n因此，一棵树的代价只和根节点有关，考虑换根DP。\r\n\r\n定义 $dp_i$ 表示以 $i$ 为根节点的子树白顶点数与黑顶点数的最大差值。\r\n\r\n$$dp_x=\\sum^{nxt}_{nxt\\in children_x}\\max(0,dp_{nxt})$$\r\n\r\n定义 $f_i$ 表示点 $i$ 为全局根节点白顶点数与黑顶点数的最大差值。\r\n\r\n$$f_{nxt}=dp_{nxt}+\\max(0,f_x-\\max(0,dp_{nxt}))$$\r\n\r\n```cpp\r\n#include\u003cbits/stdc++.h>\r\ntypedef int int32;\r\n#define int long long\r\nusing namespace std;\r\nconst int N = 2e5 + 5;\r\nint n, dp[N], a[N], f[N], size[N];\r\nvector\u003cpair\u003cint, int>>nbr[N];\r\nvoid dfs(int x, int fa, int sum)\r\n{\r\n\tdp[x] = ::size[x] = a[x];\r\n\tfor (auto& y : nbr[x])\r\n\t{\r\n\t\tauto& nxt = y.first, & w = y.second;\r\n\t\tif (nxt != fa)\r\n\t\t{\r\n\t\t\tdfs(nxt, x, sum + 1);\r\n\t\t\t::size[x] += ::size[nxt];\r\n\t\t\tdp[x] += max(0ll, dp[nxt]);\r\n\t\t}\r\n\t}\r\n\treturn;\r\n}\r\nvoid dfs1(int x, int fa)\r\n{\r\n\tfor (auto& y : nbr[x])\r\n\t{\r\n\t\tauto& nxt = y.first, & w = y.second;\r\n\t\tif (nxt != fa)\r\n\t\t{\r\n\t\t\tf[nxt] = dp[nxt] + max(0ll, f[x] - max(0ll, dp[nxt]));\r\n\t\t\tdfs1(nxt, x);\r\n\t\t}\r\n\t}\r\n\treturn;\r\n}\r\nsigned main()\r\n{\r\n\tios::sync_with_stdio(0);\r\n\tcin.tie(0), cout.tie(0);\r\n\tcin >> n;\r\n\tfor (int i = 1; i \u003c= n; i++)\r\n\t\tcin >> a[i], a[i] = a[i] ? 1 : -1;\r\n\tfor (int i = 1; i \u003c n; i++)\r\n\t{\r\n\t\tint x, y, z = 1;\r\n\t\tcin >> x >> y;\r\n\t\tnbr[x].push_back({ y,z });\r\n\t\tnbr[y].push_back({ x,z });\r\n\t}\r\n\tdfs(1, 0, 0);\r\n\tf[1] = dp[1];\r\n\tdfs1(1, 0);\r\n\tfor (int i = 1; i \u003c= n; i++)\r\n\t\tcout \u003c\u003c f[i] \u003c\u003c ' ';\r\n\treturn 0;\r\n}\r\n```\r\n\r\n### 洛谷U224225\r\n[U224225 Accumulation Degree](https://www.luogu.com.cn/problem/U224225)\r\n\r\n定义 $dp_i$ 表示以 $i$ 为根节点的子树水系的流量最大值。\r\n\r\n定义 $f_i$ 表示点 $i$ 为全局根节点水系的流量最大值。\r\n\r\n状态转移见代码。\r\n\r\n```cpp\r\n#include\u003cbits/stdc++.h>\r\ntypedef int int32;\r\n#define int long long\r\nusing namespace std;\r\nconst int N = 2e5 + 5;\r\nint t, n, dp[N], f[N];\r\nvector\u003cpair\u003cint, int>>nbr[N];\r\nvoid dfs(int x, int fa, int sum)\r\n{\r\n\tdp[x] = 0;\r\n\tfor (auto& y : nbr[x])\r\n\t{\r\n\t\tauto& nxt = y.first, & w = y.second;\r\n\t\tif (nxt != fa)\r\n\t\t{\r\n\t\t\tdfs(nxt, x, sum + 1);\r\n\t\t\tif (nbr[nxt].size() == 1)\r\n\t\t\t\tdp[x] += w;\r\n\t\t\telse\r\n\t\t\t\tdp[x] += min(w, dp[nxt]);\r\n\t\t}\r\n\t}\r\n\treturn;\r\n}\r\nvoid dfs1(int x, int fa)\r\n{\r\n\tfor (auto& y : nbr[x])\r\n\t{\r\n\t\tauto& nxt = y.first, & w = y.second;\r\n\t\tif (nxt != fa)\r\n\t\t{\r\n\t\t\tf[nxt] = dp[nxt] + min(w, f[x] - min(w, dp[nxt]));\r\n\t\t\tdfs1(nxt, x);\r\n\t\t}\r\n\t}\r\n\treturn;\r\n}\r\nsigned main()\r\n{\r\n\tios::sync_with_stdio(0);\r\n\tcin.tie(0), cout.tie(0);\r\n\tcin >> t;\r\n\twhile (t--)\r\n\t{\r\n\t\tcin >> n;\r\n\t\tfor (int i = 1; i \u003c= n; i++)\r\n\t\t\tnbr[i].clear();\r\n\t\tfor (int i = 1; i \u003c n; i++)\r\n\t\t{\r\n\t\t\tint x, y, z;\r\n\t\t\tcin >> x >> y >> z;\r\n\t\t\tnbr[x].push_back({ y,z });\r\n\t\t\tnbr[y].push_back({ x,z });\r\n\t\t}\r\n\t\tdfs(1, 0, 0);\r\n\t\tf[1] = dp[1];\r\n\t\tdfs1(1, 0);\r\n\t\tint id = 1;\r\n\t\tfor (int i = 2; i \u003c= n; i++)\r\n\t\t\tif (f[i] > f[id])\r\n\t\t\t\tid = i;\r\n\t\tcout \u003c\u003c f[id] \u003c\u003c '\\n';\r\n\t}\r\n\treturn 0;\r\n}\r\n```\r\n\r\n### 洛谷P3761\r\n[P3761 [TJOI2017] 城市](https://www.luogu.com.cn/problem/P3761)\r\n\r\n利用[树的直径](https://www.luogu.com.cn/article/8v2c463v)的树形DP，求树的中心，就是换根DP。\r\n\r\n```cpp\r\n#include\u003cbits/stdc++.h>\r\ntypedef int int32;\r\n#define int long long\r\nusing namespace std;\r\nconst int N = 2e5 + 5;\r\nint n, dis1[N], dis2[N], up[N], maxi, mini, ans = INT_MAX;\r\nvector\u003cpair\u003cint, int>>nbr[N];\r\nvoid dfs(int x, int fa)\r\n{\r\n\tfor (auto& y : nbr[x])\r\n\t{\r\n\t\tauto& nxt = y.first, & w = y.second;\r\n\t\tif (nxt != fa)\r\n\t\t{\r\n\t\t\tdfs(nxt, x);\r\n\t\t\tint tmp = dis1[nxt] + w;\r\n\t\t\tif (dis1[x] \u003c tmp)\r\n\t\t\t{\r\n\t\t\t\tdis2[x] = dis1[x];\r\n\t\t\t\tdis1[x] = tmp;\r\n\t\t\t}\r\n\t\t\telse if (dis2[x] \u003c tmp)\r\n\t\t\t\tdis2[x] = tmp;\r\n\t\t}\r\n\t}\r\n\tint sum = dis1[x] + dis2[x];\r\n\tif (sum > maxi)\r\n\t\tmaxi = sum;\r\n\treturn;\r\n}\r\nvoid dfs1(int x, int fa)\r\n{\r\n\tfor (auto& y : nbr[x])\r\n\t{\r\n\t\tauto& nxt = y.first, & w = y.second;\r\n\t\tif (nxt != fa)\r\n\t\t{\r\n\t\t\tup[nxt] = up[x] + w;\r\n\t\t\tif (dis1[nxt] + w == dis1[x])\r\n\t\t\t\tup[nxt] = max(up[nxt], dis2[x] + w);\r\n\t\t\telse\r\n\t\t\t\tup[nxt] = max(up[nxt], dis1[x] + w);\r\n\t\t\tdfs1(nxt, x);\r\n\t\t}\r\n\t}\r\n\tint tmp = max(up[x], dis1[x]);\r\n\tif (tmp \u003c mini)\r\n\t\tmini = tmp;\r\n\treturn;\r\n}\r\npair\u003cint, int>work(int x, int fa)\r\n{\r\n\tmaxi = 0;\r\n\tmini = INT_MAX;\r\n\tfor (int i = 1; i \u003c= n; i++)\r\n\t\tdis1[i] = dis2[i] = up[i] = 0;\r\n\tdfs(x, fa);\r\n\tdfs1(x, fa);\r\n\treturn { maxi,mini };\r\n}\r\nsigned main()\r\n{\r\n\tios::sync_with_stdio(0);\r\n\tcin.tie(0), cout.tie(0);\r\n\tcin >> n;\r\n\tfor (int i = 1; i \u003c n; i++)\r\n\t{\r\n\t\tint x, y, z;\r\n\t\tcin >> x >> y >> z;\r\n\t\tnbr[x].push_back({ y,z });\r\n\t\tnbr[y].push_back({ x,z });\r\n\t}\r\n\tfor (int i = 1; i \u003c= n; i++)\r\n\t\tfor (auto& y : nbr[i])\r\n\t\t{\r\n\t\t\tauto& nxt = y.first, & w = y.second;\r\n\t\t\tif (i \u003c nxt)\r\n\t\t\t{\r\n\t\t\t\tpair\u003cint, int>a = work(i, nxt), b = work(nxt, i);\r\n\t\t\t\tans = min(ans, max({ a.first,b.first,a.second + b.second + w }));\r\n\t\t\t}\r\n\t\t}\r\n\tcout \u003c\u003c ans;\r\n\treturn 0;\r\n}\r\n```","html":"\u003ch1 id=\"%E6%8D%A2%E6%A0%B9dp%EF%BC%88%E4%BA%8C%E6%AC%A1%E6%89%AB%E6%8F%8Fdp%EF%BC%89\" tabindex=\"-1\">换根 DP（二次扫描 DP） \u003ca href=\"#%E6%8D%A2%E6%A0%B9dp%EF%BC%88%E4%BA%8C%E6%AC%A1%E6%89%AB%E6%8F%8Fdp%EF%BC%89\" class=\"header-anchor\">¶\u003c/a>\u003c/h1>\n\u003ch2 id=\"%E4%BB%8B%E7%BB%8D\" tabindex=\"-1\">介绍 \u003ca href=\"#%E4%BB%8B%E7%BB%8D\" class=\"header-anchor\">¶\u003c/a>\u003c/h2>\n\u003cp>对于树形 DP，若给定无根树，而问题的最优解与根节点相关，那么考虑换根 DP。\u003c/p>\n\u003cp>通常可以将枚举根节点跑 DP 的时间复杂度由 \u003cspan tabindex=\"0\" role=\"text\" aria-label=\"O, left parenthesis, N, squared, right parenthesis\">\u003cspan class=\"katex\">\u003cspan class=\"katex-mathml\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\">\u003csemantics>\u003cmrow>\u003cmi>O\u003c/mi>\u003cmo stretchy=\"false\">(\u003c/mo>\u003cmsup>\u003cmi>N\u003c/mi>\u003cmn>2\u003c/mn>\u003c/msup>\u003cmo stretchy=\"false\">)\u003c/mo>\u003c/mrow>\u003cannotation encoding=\"application/x-tex\">O(N^2)\u003c/annotation>\u003c/semantics>\u003c/math>\u003c/span>\u003cspan class=\"katex-html\" aria-hidden=\"true\">\u003cspan class=\"base\">\u003cspan class=\"strut\" style=\"height:1.0641em;vertical-align:-0.25em;\">\u003c/span>\u003cspan class=\"mord mathnormal\" style=\"margin-right:0.02778em;\">O\u003c/span>\u003cspan class=\"mopen\">(\u003c/span>\u003cspan class=\"mord\">\u003cspan class=\"mord mathnormal\" style=\"margin-right:0.10903em;\">N\u003c/span>\u003cspan class=\"msupsub\">\u003cspan class=\"vlist-t\">\u003cspan class=\"vlist-r\">\u003cspan class=\"vlist\" style=\"height:0.8141em;\">\u003cspan style=\"top:-3.063em;margin-right:0.05em;\">\u003cspan class=\"pstrut\" style=\"height:2.7em;\">\u003c/span>\u003cspan class=\"sizing reset-size6 size3 mtight\">\u003cspan class=\"mord mtight\">2\u003c/span>\u003c/span>\u003c/span>\u003c/span>\u003c/span>\u003c/span>\u003c/span>\u003c/span>\u003cspan class=\"mclose\">)\u003c/span>\u003c/span>\u003c/span>\u003c/span>\u003c/span> 降为 \u003cspan tabindex=\"0\" role=\"text\" aria-label=\"O, left parenthesis, N, right parenthesis\">\u003cspan class=\"katex\">\u003cspan class=\"katex-mathml\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\">\u003csemantics>\u003cmrow>\u003cmi>O\u003c/mi>\u003cmo stretchy=\"false\">(\u003c/mo>\u003cmi>N\u003c/mi>\u003cmo stretchy=\"false\">)\u003c/mo>\u003c/mrow>\u003cannotation encoding=\"application/x-tex\">O(N)\u003c/annotation>\u003c/semantics>\u003c/math>\u003c/span>\u003cspan class=\"katex-html\" aria-hidden=\"true\">\u003cspan class=\"base\">\u003cspan class=\"strut\" style=\"height:1em;vertical-align:-0.25em;\">\u003c/span>\u003cspan class=\"mord mathnormal\" style=\"margin-right:0.02778em;\">O\u003c/span>\u003cspan class=\"mopen\">(\u003c/span>\u003cspan class=\"mord mathnormal\" style=\"margin-right:0.10903em;\">N\u003c/span>\u003cspan class=\"mclose\">)\u003c/span>\u003c/span>\u003c/span>\u003c/span>\u003c/span>。\u003c/p>\n\u003c!--more-->\n\u003ch2 id=\"%E6%8D%A2%E6%A0%B9dp%E7%9A%84%E5%AE%9E%E7%8E%B0%E6%AD%A5%E9%AA%A4\" tabindex=\"-1\">换根 DP 的实现步骤 \u003ca href=\"#%E6%8D%A2%E6%A0%B9dp%E7%9A%84%E5%AE%9E%E7%8E%B0%E6%AD%A5%E9%AA%A4\" class=\"header-anchor\">¶\u003c/a>\u003c/h2>\n\u003col>\n\u003cli>定义 \u003cspan tabindex=\"0\" role=\"text\" aria-label=\"d, p, start subscript, i, end subscript\">\u003cspan class=\"katex\">\u003cspan class=\"katex-mathml\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\">\u003csemantics>\u003cmrow>\u003cmi>d\u003c/mi>\u003cmsub>\u003cmi>p\u003c/mi>\u003cmi>i\u003c/mi>\u003c/msub>\u003c/mrow>\u003cannotation encoding=\"application/x-tex\">dp_i\u003c/annotation>\u003c/semantics>\u003c/math>\u003c/span>\u003cspan class=\"katex-html\" aria-hidden=\"true\">\u003cspan class=\"base\">\u003cspan class=\"strut\" style=\"height:0.8889em;vertical-align:-0.1944em;\">\u003c/span>\u003cspan class=\"mord mathnormal\">d\u003c/span>\u003cspan class=\"mord\">\u003cspan class=\"mord mathnormal\">p\u003c/span>\u003cspan class=\"msupsub\">\u003cspan class=\"vlist-t vlist-t2\">\u003cspan class=\"vlist-r\">\u003cspan class=\"vlist\" style=\"height:0.3117em;\">\u003cspan style=\"top:-2.55em;margin-left:0em;margin-right:0.05em;\">\u003cspan class=\"pstrut\" style=\"height:2.7em;\">\u003c/span>\u003cspan class=\"sizing reset-size6 size3 mtight\">\u003cspan class=\"mord mathnormal mtight\">i\u003c/span>\u003c/span>\u003c/span>\u003c/span>\u003cspan class=\"vlist-s\">​\u003c/span>\u003c/span>\u003cspan class=\"vlist-r\">\u003cspan class=\"vlist\" style=\"height:0.15em;\">\u003cspan>\u003c/span>\u003c/span>\u003c/span>\u003c/span>\u003c/span>\u003c/span>\u003c/span>\u003c/span>\u003c/span>\u003c/span> 表示以 \u003cspan tabindex=\"0\" role=\"text\" aria-label=\"i\">\u003cspan class=\"katex\">\u003cspan class=\"katex-mathml\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\">\u003csemantics>\u003cmrow>\u003cmi>i\u003c/mi>\u003c/mrow>\u003cannotation encoding=\"application/x-tex\">i\u003c/annotation>\u003c/semantics>\u003c/math>\u003c/span>\u003cspan class=\"katex-html\" aria-hidden=\"true\">\u003cspan class=\"base\">\u003cspan class=\"strut\" style=\"height:0.6595em;\">\u003c/span>\u003cspan class=\"mord mathnormal\">i\u003c/span>\u003c/span>\u003c/span>\u003c/span>\u003c/span> 为根节点的子树，XXX 的最值或方案数；跑一遍从下到上转移的树形 DP（\u003cspan tabindex=\"0\" role=\"text\" aria-label=\"d, f, s, left parenthesis, r, o, o, t, right parenthesis\">\u003cspan class=\"katex\">\u003cspan class=\"katex-mathml\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\">\u003csemantics>\u003cmrow>\u003cmi>d\u003c/mi>\u003cmi>f\u003c/mi>\u003cmi>s\u003c/mi>\u003cmo stretchy=\"false\">(\u003c/mo>\u003cmi>r\u003c/mi>\u003cmi>o\u003c/mi>\u003cmi>o\u003c/mi>\u003cmi>t\u003c/mi>\u003cmo stretchy=\"false\">)\u003c/mo>\u003c/mrow>\u003cannotation encoding=\"application/x-tex\">dfs(root)\u003c/annotation>\u003c/semantics>\u003c/math>\u003c/span>\u003cspan class=\"katex-html\" aria-hidden=\"true\">\u003cspan class=\"base\">\u003cspan class=\"strut\" style=\"height:1em;vertical-align:-0.25em;\">\u003c/span>\u003cspan class=\"mord mathnormal\" style=\"margin-right:0.10764em;\">df\u003c/span>\u003cspan class=\"mord mathnormal\">s\u003c/span>\u003cspan class=\"mopen\">(\u003c/span>\u003cspan class=\"mord mathnormal\" style=\"margin-right:0.02778em;\">r\u003c/span>\u003cspan class=\"mord mathnormal\">oo\u003c/span>\u003cspan class=\"mord mathnormal\">t\u003c/span>\u003cspan class=\"mclose\">)\u003c/span>\u003c/span>\u003c/span>\u003c/span>\u003c/span>）；\u003c/li>\n\u003cli>定义 \u003cspan tabindex=\"0\" role=\"text\" aria-label=\"f, start subscript, i, end subscript\">\u003cspan class=\"katex\">\u003cspan class=\"katex-mathml\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\">\u003csemantics>\u003cmrow>\u003cmsub>\u003cmi>f\u003c/mi>\u003cmi>i\u003c/mi>\u003c/msub>\u003c/mrow>\u003cannotation encoding=\"application/x-tex\">f_i\u003c/annotation>\u003c/semantics>\u003c/math>\u003c/span>\u003cspan class=\"katex-html\" aria-hidden=\"true\">\u003cspan class=\"base\">\u003cspan class=\"strut\" style=\"h
