	<script type="application/json" id="post-data">{"id":"平衡树","metadata":{"id":"平衡树","title":"平衡树","date":"2025-11-30","tags":["平衡树"],"summary":"平衡树全称是二叉搜索平衡树……"},"markdown":"# 平衡树\r\n\r\n全称是二叉搜索平衡树\r\n\r\n二叉搜索树：对于一棵二叉树，每个节点有权值 $val$，任意节点 $x$ 的左子树的权值小于等于 $val_x$，右子树反之。\r\n\r\n二叉搜索树的优点：\r\n\r\n1. 具有单调性，可以 $log_2$ 的时间查找。\r\n2. 二叉搜索树的中序遍历是单调不减的，可以将下标当做权值，这样一个序列可以映射到一棵二叉搜索树。\r\n\r\n为什么需要平衡树？\r\n\r\n- 一个序列对应的二叉搜索树不唯一。我们希望找到高度最小的那颗应用。\r\n\r\n若一棵二叉树的任意一个结点 $x$，其左右子树高度差不超过 $1$，称为二叉平衡树。\r\n\r\n\u003c!-- more -->\r\n\r\n算法竞赛领域常用的平衡树：\r\n\r\n1. treap\r\n2. splay\r\n3. fhq_treap\r\n\r\n其中，treap 和 fhq_treap 利用的是随机平衡，不追求绝对平衡。splay 是贪心策略平衡。treap 和 splay 都是通过旋转改变形态，fhq_treap 通过分裂和合并来改变形态。\r\n\r\n## Fhq_treap 实现\r\n\r\n1. 分裂操作\r\n\r\n\t将一棵平衡树分裂成 $a$ 和 $b$ 两棵子树，且 $val_a\\le val,val_b>val$。$val$ 是选取的某个数。\r\n\r\n\t```cpp\r\n\tstruct node {\r\n\t\tint val, l, r, size, rnk;\r\n\t}tree[N];\r\n\tvoid update(int cur)\r\n\t{\r\n\t\ttree[cur].size = tree[tree[cur].l].size + tree[tree[cur].r].size + 1;\r\n\t\treturn;\r\n\t}\r\n\tvoid split(int cur, int& a, int& b, int val)\r\n\t{\r\n\t\tif (!cur)\r\n\t\t{\r\n\t\t\ta = b = 0;\r\n\t\t\treturn;\r\n\t\t}\r\n\t\tif (tree[cur].val \u003c= val)\r\n\t\t{\r\n\t\t\ta = cur;\r\n\t\t\tsplit(tree[cur].r, tree[cur].r, b, val);\r\n\t\t}\r\n\t\telse\r\n\t\t{\r\n\t\t\tb = cur;\r\n\t\t\tsplit(tree[cur].l, a, tree[cur].l, val);\r\n\t\t}\r\n\t\tupdate(cur);\r\n\t\treturn;\r\n\t}\r\n\t```\r\n\r\n2. 合并操作\r\n\r\n\t将 $a,b$ 两棵平衡树合并，且 $a$ 平衡树的任意权值一定小于等于 $b$ 平衡树的任意权值。\r\n\r\n模板完整代码：\r\n\r\n```cpp\r\n#include\u003cbits/stdc++.h>\r\ntypedef int int32;\r\n#define int long long\r\nusing namespace std;\r\nconst int N = 1e5 + 5;\r\nint n, root, cnt;\r\nstruct node {\r\n\tint val, l, r, size, rnk;\r\n}tree[N];\r\nvoid update(int cur)\r\n{\r\n\ttree[cur].size = tree[tree[cur].l].size + tree[tree[cur].r].size + 1;\r\n\treturn;\r\n}\r\nint add_node(int val)\r\n{\r\n\ttree[++cnt] = { val,0,0,1,rand() };\r\n\treturn cnt;\r\n}\r\nvoid split(int cur, int& a, int& b, int val)\r\n{\r\n\tif (!cur)\r\n\t{\r\n\t\ta = b = 0;\r\n\t\treturn;\r\n\t}\r\n\tif (tree[cur].val \u003c= val)\r\n\t{\r\n\t\ta = cur;\r\n\t\tsplit(tree[cur].r, tree[cur].r, b, val);\r\n\t}\r\n\telse\r\n\t{\r\n\t\tb = cur;\r\n\t\tsplit(tree[cur].l, a, tree[cur].l, val);\r\n\t}\r\n\tupdate(cur);\r\n\treturn;\r\n}\r\nvoid merge(int& cur, int a, int b)//合并\r\n{\r\n\tif (!a || !b)\r\n\t{\r\n\t\tcur = a + b;\r\n\t\treturn;\r\n\t}\r\n\tif (tree[a].rnk \u003c= tree[b].rnk)\r\n\t{\r\n\t\tcur = a;\r\n\t\tmerge(tree[a].r, tree[a].r, b);\r\n\t}\r\n\telse\r\n\t{\r\n\t\tcur = b;\r\n\t\tmerge(tree[b].l, a, tree[b].l);\r\n\t}\r\n\tupdate(cur);\r\n\treturn;\r\n}\r\nvoid insert(int& cur, int val)//插入\r\n{\r\n\tint a = 0, b = 0, c = add_node(val);\r\n\tsplit(cur, a, b, val);\r\n\tmerge(a, a, c);\r\n\tmerge(cur, a, b);\r\n\treturn;\r\n}\r\nvoid del(int& cur, int val)//输出\r\n{\r\n\tint a = 0, b = 0, c = 0;\r\n\tsplit(cur, a, b, val);\r\n\tsplit(a, a, c, val - 1);\r\n\tmerge(c, tree[c].l, tree[c].r);\r\n\tmerge(a, a, c);\r\n\tmerge(cur, a, b);\r\n\treturn;\r\n}\r\nint find_num(int cur, int x)//寻找第 $x$ 个元素\r\n{\r\n\twhile (tree[tree[cur].l].size + 1 != x)\r\n\t\tif (tree[tree[cur].l].size >= x)\r\n\t\t\tcur = tree[cur].l;\r\n\t\telse\r\n\t\t{\r\n\t\t\tx -= tree[tree[cur].l].size + 1;\r\n\t\t\tcur = tree[cur].r;\r\n\t\t}\r\n\treturn tree[cur].val;\r\n}\r\nint find_rank(int& cur, int val)//寻找 $val$ 的第一个位置\r\n{\r\n\tint a = 0, b = 0;\r\n\tsplit(cur, a, b, val - 1);\r\n\tint tmp = tree[a].size + 1;\r\n\tmerge(cur, a, b);\r\n\treturn tmp;\r\n}\r\nint prev(int& cur, int val)//寻找前驱\r\n{\r\n\tint a = 0, b = 0;\r\n\tsplit(cur, a, b, val - 1);\r\n\tint tmp = find_num(a, tree[a].size);\r\n\tmerge(cur, a, b);\r\n\treturn tmp;\r\n}\r\nint suf(int& cur, int val)//寻找后继\r\n{\r\n\tint a = 0, b = 0;\r\n\tsplit(cur, a, b, val);\r\n\tint tmp = find_num(b, 1);\r\n\tmerge(cur, a, b);\r\n\treturn tmp;\r\n}\r\nsigned main()\r\n{\r\n\tios::sync_with_stdio(0);\r\n\tcin.tie(0), cout.tie(0);\r\n\tsrand(time(0));\r\n\tcin >> n;\r\n\tfor (int i = 1; i \u003c= n; i++)\r\n\t{\r\n\t\tint opt, val;\r\n\t\tcin >> opt >> val;\r\n\t\tif (opt == 1)\r\n\t\t\tinsert(root, val);\r\n\t\telse if (opt == 2)\r\n\t\t\tdel(root, val);\r\n\t\telse if (opt == 3)\r\n\t\t\tcout \u003c\u003c find_rank(root, val) \u003c\u003c '\\n';\r\n\t\telse if (opt == 4)\r\n\t\t\tcout \u003c\u003c find_num(root, val) \u003c\u003c '\\n';\r\n\t\telse if (opt == 5)\r\n\t\t\tcout \u003c\u003c prev(root, val) \u003c\u003c '\\n';\r\n\t\telse\r\n\t\t\tcout \u003c\u003c suf(root, val) \u003c\u003c '\\n';\r\n\t}\r\n\treturn 0;\r\n}\r\n```\r\n\r\n### 例题\r\n\r\n#### 洛谷P1486\r\n\r\n[P1486 郁闷的出纳员](https://www.luogu.com.cn/problem/P1486)\r\n\r\nNOI2004 的题。\r\n\r\n> 第一行有两个整数 $n$ 和 $\\min$。$n$ 表示下面有多少条命令，$\\min$ 表示工资下界。\r\n>\r\n> 接下来的 $n$ 行，每行一个字符 $x$ 和一个整数 $k$，表示一条命令。命令可以是以下四种之一：\r\n>\r\n> - `I k`  新建一个工资档案，初始工资为 $k$。如果某员工的初始工资低于工资下界，他将立刻离开公司。\r\n> - `A k`   把每位员工的工资加上 $k$。\r\n> - `S k`   把每位员工的工资扣除 $k$。\r\n> - `F k`    查询第 $k$ 多的工资。\r\n>\r\n> 在初始时，可以认为公司里一个员工也没有。\r\n\r\n维护一个全局懒标记，懒标记减的时候删除离开的人。\r\n\r\n```cpp\r\nsigned main()\r\n{\r\n\tios::sync_with_stdio(0);\r\n\tcin.tie(0), cout.tie(0);\r\n\tsrand(time(0));\r\n\tcin >> n >> m;\r\n\tfor (int i = 1; i \u003c= n; i++)\r\n\t{\r\n\t\tchar c;\r\n\t\tint x;\r\n\t\tcin >> c >> x;\r\n\t\tif (c == 'I')\r\n\t\t\tif (x >= m)\r\n\t\t\t\tinsert(root, x - tag);\r\n\t\t\telse\r\n\t\t\t\t;\r\n\t\telse if (c == 'A')\r\n\t\t\ttag += x;\r\n\t\telse if (c == 'S')\r\n\t\t{\r\n\t\t\ttag -= x;\r\n\t\t\twhile (root && find_num(root, 1) + tag \u003c m)\r\n\t\t\t\tdel(root, find_num(root, 1)), sum++;\r\n\t\t}\r\n\t\telse\r\n\t\t\tif (!root || tree[root].size \u003c x)\r\n\t\t\t\tcout \u003c\u003c \"-1\\n\";\r\n\t\t\telse\r\n\t\t\t\tcout \u003c\u003c find_num(root, tree[root].size - x + 1) + tag \u003c\u003c '\\n';\r\n\t}\r\n\tcout \u003c\u003c sum;\r\n\treturn 0;\r\n}\r\n```\r\n\r\n#### 洛谷P2234\r\n\r\n[P2234 营业额统计](https://www.luogu.com.cn/problem/P2234)\r\n\r\n> 而分析整个公司的从成立到现在营业情况是否稳定，只需要把每一天的最小波动值加起来就可以了。你的任务就是编写一个程序帮助 Tiger 来计算这一个值。\r\n>\r\n> 我们定义，一天的最小波动值 = $\\min\\{|\\text{该天以前某一天的营业额}-\\text{该天营业额}|\\}$。\r\n>\r\n> 特别地，第一天的最小波动值为第一天的营业额。\r\n\r\n和前驱后继减，即可保证最小。\r\n\r\n```cpp\r\nsigned main()\r\n{\r\n\tios::sync_with_stdio(0);\r\n\tcin.tie(0), cout.tie(0);\r\n\tsrand(time(0));\r\n\tcin >> n;\r\n\tfor (int i = 1; i \u003c= n; i++)\r\n\t{\r\n\t\tint x;\r\n\t\tcin >> x;\r\n\t\tinsert(root, x);\r\n\t\tif (i == 1)\r\n\t\t\tsum += x;\r\n\t\telse if (tree[root].size == find_rank(root, x))\r\n\t\t\tsum += abs(prev(root, x) - x);\r\n\t\telse if (find_rank(root, x) == 1)\r\n\t\t\tsum += abs(suf(root, x) - x);\r\n\t\telse\r\n\t\t\tsum += min(abs(prev(root, x) - x), abs(suf(root, x) - x));\r\n\t}\r\n\tcout \u003c\u003c sum;\r\n\treturn 0;\r\n}\r\n```\r\n\r\n类似题：[P2286 宠物收养场](https://www.luogu.com.cn/problem/P2286)\r\n\r\n#### 洛谷P3224\r\n\r\n[P3224 永无乡](https://www.luogu.com.cn/problem/P3224)\r\n\r\n> 永无乡包含 $n$ 座岛，编号从 $1$ 到 $n$ ，每座岛都有自己的独一无二的重要度，按照重要度可以将这 $n$ 座岛排名，名次用 $1$  到 $n$ 来表示。某些岛之间由巨大的桥连接，通过桥可以从一个岛到达另一个岛。如果从岛 $a$ 出发经过若干座（含 $0$ 座）桥可以 到达岛 $b$ ，则称岛 $a$ 和岛 $b$ 是连通的。\r\n>\r\n> 现在有两种操作：\r\n>\r\n> `B x y` 表示在岛 $x$ 与岛 $y$ 之间修建一座新桥。\r\n>\r\n> `Q x k` 表示询问当前与岛 $x$ 连通的所有岛中第 $k$ 重要的是哪座岛，即所有与岛 $x$ 连通的岛中重要度排名第 $k$ 小的岛是哪座，请你输出那个岛的编号。\r\n\r\n使用并查集+平衡树，合并使用启发式合并，即拆小的往大的上 merge。\r\n\r\n```cpp\r\nint find(int x)\r\n{\r\n\tif (x == fa[x])\r\n\t\treturn x;\r\n\treturn fa[x] = find(fa[x]);\r\n}\r\nvoid dfs(int x, int& y)\r\n{\r\n\tif (!x)\r\n\t\treturn;\r\n\tint a = 0, b = 0, c = x, val = tree[x].val;\r\n\tint l = tree[x].l, r = tree[x].r;\r\n\ttree[x].l = tree[x].r = 0;\r\n\tsplit(y, a, b, val);\r\n\tmerge(a, a, c);\r\n\tmerge(y, a, b);\r\n\tdfs(l, y);\r\n\tdfs(r, y);\r\n\treturn;\r\n}\r\nvoid unionn(int x, int y)\r\n{\r\n\tx = find(x);\r\n\ty = find(y);\r\n\tif (x != y)\r\n\t\tif (tree[root[x]].size \u003c= tree[root[y]].size)\r\n\t\t{\r\n\t\t\tfa[x] = y;\r\n\t\t\tdfs(root[x], root[y]);\r\n\t\t}\r\n\t\telse\r\n\t\t{\r\n\t\t\tswap(x, y);\r\n\t\t\tfa[x] = y;\r\n\t\t\tdfs(root[x], root[y]);\r\n\t\t}\r\n\treturn;\r\n}\r\nsigned main()\r\n{\r\n\tios::sync_with_stdio(0);\r\n\tcin.tie(0), cout.tie(0);\r\n\tsrand(time(0));\r\n\tcin >> n >> m;\r\n\tfor (int i = 1; i \u003c= n; i++)\r\n\t\tcin >> a[i], b[a[i]] = i, fa[i] = i, root[i] = i,\r\n\t\ttree[i] = { a[i],0,0,1,rand() };\r\n\tcnt = n;\r\n\tfor (int i = 1; i \u003c= m; i++)\r\n\t{\r\n\t\tint x, y;\r\n\t\tcin >> x >> y;\r\n\t\tunionn(x, y);\r\n\t}\r\n\tcin >> q;\r\n\twhile (q--)\r\n\t{\r\n\t\tchar c;\r\n\t\tint x, y;\r\n\t\tcin >> c >> x >> y;\r\n\t\tif (c == 'B')\r\n\t\t\tunionn(x, y);\r\n\t\telse\r\n\t\t\tif (tree[root[find(x)]].size \u003c y)\r\n\t\t\t\tcout \u003c\u003c \"-1\\n\";\r\n\t\t\telse\r\n\t\t\t\tcout \u003c\u003c b[find_num(root[find(x)], y)] \u003c\u003c '\\n';\r\n\t}\r\n\treturn 0;\r\n}\r\n```\r\n\r\n#### 洛谷P6136\r\n\r\n[P6136 【模板】普通平衡树（数据加强版）](https://www.luogu.com.cn/problem/P6136)\r\n\r\n```cpp\r\nsigned main()\r\n{\r\n\tios::sync_with_stdio(0);\r\n\tcin.tie(0), cout.tie(0);\r\n\tsrand(time(0));\r\n\tcin >> n >> m;\r\n\tfor(int i = 1; i \u003c= n; i++)\r\n\t{\r\n\t\tint x;\r\n\t\tcin >> x;\r\n\t\tinsert(root, x);\r\n\t}\r\n\tfor(int i = 1; i \u003c= m; i++)\r\n\t{\r\n\t\tint opt, val;\r\n\t\tcin >> opt >> val;\r\n\t\tval ^= last;\r\n\t\tif(opt == 1)\r\n\t\t\tinsert(root, val);\r\n\t\telse if(opt == 2)\r\n\t\t\tdel(root, val);\r\n\t\telse if(opt == 3)\r\n\t\t\tans ^= (last = find_rank(root, val));\r\n\t\telse if(opt == 4)\r\n\t\t\tans ^= (last = find_num(root, val));\r\n\t\telse if(opt == 5)\r\n\t\t\tans ^= (last = prev(root, val));\r\n\t\telse\r\n\t\t\tans ^= (last = suf(root, val));\r\n\t}\r\n\tcout \u003c\u003c ans;\r\n\treturn 0;\r\n}\r\n```\r\n\r\n\r\n\r\n## 文艺平衡树（fhq_treap 版）\r\n\r\n需要区间反转时，为了实现区间翻转，我们使用懒标记（lazy tag），像线段树一样。\r\n\r\n- pushdown 函数\r\n\r\n\t```cpp\r\n\tvoid pushdown(int cur)\r\n\t{\r\n\t\tif (!tree[cur].tag)\r\n\t\t\treturn;\r\n\t\tswap(tree[cur].l, tree[cur].r);\r\n\t\ttree[tree[cur].l].tag ^= 1;\r\n\t\ttree[tree[cur].r].tag ^= 1;\r\n\t\ttree[cur].tag = 0;\r\n\t\treturn;\r\n\t}\r\n\t```\r\n\r\n- split 函数\r\n\r\n\t```cpp\r\n\tvoid split(int cur, int& a, int& b, int val)\r\n\t{\r\n\t\tif (!cur)\r\n\t\t{\r\n\t\t\ta = b = 0;\r\n\t\t\treturn;\r\n\t\t}\r\n\t\tpushdown(cur);\r\n\t\tif (tree[tree[cur].l].size + 1 \u003c= val)//文艺平衡树是按size分的\r\n\t\t{\r\n\t\t\ta = cur;\r\n\t\t\tsplit(tree[cur].r, tree[cur].r, b, val - tree[tree[cur].l].size - 1);\r\n\t\t}\r\n\t\telse\r\n\t\t{\r\n\t\t\tb = cur;\r\n\t\t\tsplit(tree[cur].l, a, tree[cur].l, val);\r\n\t\t}\r\n\t\tupdate(cur);\r\n\t\treturn;\r\n\t}\r\n\t```\r\n\r\n- merge 函数\r\n\r\n\t```cpp\r\n\tvoid merge(int& cur, int a, int b)\r\n\t{\r\n\t\tif (!a || !b)\r\n\t\t{\r\n\t\t\tcur = a + b;\r\n\t\t\treturn;\r\n\t\t}\r\n\t\tif (tree[a].rnk \u003c= tree[b].rnk)\r\n\t\t{\r\n\t\t\tpushdown(a);\r\n\t\t\tcur = a;\r\n\t\t\tmerge(tree[a].r, tree[a].r, b);\r\n\t\t}\r\n\t\telse\r\n\t\t{\r\n\t\t\tpushdown(b);\r\n\t\t\tcur = b;\r\n\t\t\tmerge(tree[b].l, a, tree[b].l);\r\n\t\t}\r\n\t\tupdate(cur);//记得update，forget to update 3 times\r\n\t\treturn;\r\n\t}\r\n\t```\r\n\r\n- reverse 函数\r\n\r\n\t```cpp\r\n\tvoid reverse(int& cur, int x, int y)\r\n\t{\r\n\t\tint a = 0, b = 0, c = 0;\r\n\t\tsplit(cur, a, b, y);\r\n\t\tsplit(a, a, c, x - 1);\r\n\t\ttree[c].tag ^= 1;\r\n\t\tmerge(a, a, c);\r\n\t\tmerge(cur, a, b);\r\n\t\treturn;\r\n\t}\r\n\t```\r\n- print 函数\r\n\r\n\t```cpp\r\n\tvoid print(int x)\r\n\t{\r\n\t\tif (!x)\r\n\t\t\treturn;\r\n\t\tpushdown(x);\r\n\t\tprint(tree[x].l);\r\n\t\tcout \u003c\u003c tree[x].val \u003c\u003c ' ';\r\n\t\tprint(tree[x].r);\r\n\t\treturn;\r\n\t}\r\n\t```\r\n\r\n### 例题\r\n\r\n#### 洛谷P3391\r\n\r\n[P3391 【模板】文艺平衡树 - 洛谷](https://www.luogu.com.cn/problem/P3391)\r\n\r\n#### 洛谷P3850\r\n\r\n[P3850 书架](https://www.luogu.com.cn/problem/P3850)\r\n\r\n> Knuth 先生家里有个精致的书架，书架上有 *N* 本书，如今他想学到更多的知识，于是又买来了 *M* 本不同的新书。现在他要把新买的书依次插入到书架中，他已经把每本书要插入的位置标记好了，并且相应的将它们放好。由于 Knuth 年龄已大，过几天他已经记不清某些位置上放的到底是什么书了，请问你能帮助他吗？\r\n\r\n文艺平衡树加一个 `string` 就可以了\r\n\r\n```cpp\r\nstruct node {\r\n\tint val, l, r, size, rnk, tag;\r\n\tstring s;\r\n}tree[N];\r\nsigned main()\r\n{\r\n\tios::sync_with_stdio(0);\r\n\tcin.tie(0), cout.tie(0);\r\n\tsrand(time(0));\r\n\tcin >> n;\r\n\tfor (int i = 1; i \u003c= n; i++)\r\n\t{\r\n\t\tcin >> s;\r\n\t\tint a = add_node(i);\r\n\t\ttree[a].s = s;\r\n\t\tmerge(root, root, a);\r\n\t}\r\n\tcin >> m;\r\n\tfor (int i = 1; i \u003c= m; i++)\r\n\t{\r\n\t\tint x;\r\n\t\tcin >> s >> x;\r\n\t\tint a = 0, b = 0, c = add_node(x);\r\n\t\ttree[c].s = s;\r\n\t\tsplit(root, a, b, x);\r\n\t\tmerge(a, a, c);\r\n\t\tmerge(root, a, b);\r\n\t}\r\n\tcin >> m;\r\n\tfor (int i = 1; i \u003c= m; i++)\r\n\t{\r\n\t\tint x;\r\n\t\tcin >> x;\r\n\t\tint a = 0, b = 0, c = 0;\r\n\t\tsplit(root, a, b, x + 1);\r\n\t\tsplit(a, a, c, x);\r\n\t\tcout \u003c\u003c tree[c].s \u003c\u003c '\\n';\r\n\t\tmerge(a, a, c);\r\n\t\tmerge(root, a, b);\r\n\t}\r\n\treturn 0;\r\n}\r\n```","html":"\u003ch1 id=\"%E5%B9%B3%E8%A1%A1%E6%A0%91\" tabindex=\"-1\">平衡树 \u003ca href=\"#%E5%B9%B3%E8%A1%A1%E6%A0%91\" class=\"header-anchor\">¶\u003c/a>\u003c/h1>\n\u003cp>全称是二叉搜索平衡树\u003c/p>\n\u003cp>二叉搜索树：对于一棵二叉树，每个节点有权值 \u003cspan tabindex=\"0\" role=\"text\" aria-label=\"v, a, l\">\u003cspan class=\"katex\">\u003cspan class=\"katex-mathml\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\">\u003csemantics>\u003cmrow>\u003cmi>v\u003c/mi>\u003cmi>a\u003c/mi>\u003cmi>l\u003c/mi>\u003c/mrow>\u003cannotation encoding=\"application/x-tex\">val\u003c/annotation>\u003c/semantics>\u003c/math>\u003c/span>\u003cspan class=\"katex-html\" aria-hidden=\"true\">\u003cspan class=\"base\">\u003cspan class=\"strut\" style=\"height:0.6944em;\">\u003c/span>\u003cspan class=\"mord mathnormal\" style=\"margin-right:0.03588em;\">v\u003c/span>\u003cspan class=\"mord mathnormal\">a\u003c/span>\u003cspan class=\"mord mathnormal\" style=\"margin-right:0.01968em;\">l\u003c/span>\u003c/span>\u003c/span>\u003c/span>\u003c/span>，任意节点 \u003cspan tabindex=\"0\" role=\"text\" aria-label=\"x\">\u003cspan class=\"katex\">\u003cspan class=\"katex-mathml\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\">\u003csemantics>\u003cmrow>\u003cmi>x\u003c/mi>\u003c/mrow>\u003cannotation encoding=\"application/x-tex\">x\u003c/annotation>\u003c/semantics>\u003c/math>\u003c/span>\u003cspan class=\"katex-html\" aria-hidden=\"true\">\u003cspan class=\"base\">\u003cspan class=\"strut\" style=\"height:0.4306em;\">\u003c/span>\u003cspan class=\"mord mathnormal\">x\u003c/span>\u003c/span>\u003c/span>\u003c/span>\u003c/span> 的左子树的权值小于等于 \u003cspan tabindex=\"0\" role=\"text\" aria-label=\"v, a, l, start subscript, x, end subscript\">\u003cspan class=\"katex\">\u003cspan class=\"katex-mathml\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\">\u003csemantics>\u003cmrow>\u003cmi>v\u003c/mi>\u003cmi>a\u003c/mi>\u003cmsub>\u003cmi>l\u003c/mi>\u003cmi>x\u003c/mi>\u003c/msub>\u003c/mrow>\u003cannotation encoding=\"application/x-tex\">val_x\u003c/annotation>\u003c/semantics>\u003c/math>\u003c/span>\u003cspan class=\"katex-html\" aria-hidden=\"true\">\u003cspan class=\"base\">\u003cspan class=\"strut\" style=\"height:0.8444em;vertical-align:-0.15em;\">\u003c/span>\u003cspan class=\"mord mathnormal\" style=\"margin-right:0.03588em;\">v\u003c/span>\u003cspan class=\"mord mathnormal\">a\u003c/span>\u003cspan class=\"mord\">\u003cspan class=\"mord mathnormal\" style=\"margin-right:0.01968em;\">l\u003c/span>\u003cspan class=\"msupsub\">\u003cspan class=\"vlist-t vlist-t2\">\u003cspan class=\"vlist-r\">\u003cspan class=\"vlist\" style=\"height:0.1514em;\">\u003cspan style=\"top:-2.55em;margin-left:-0.0197em;margin-right:0.05em;\">\u003cspan class=\"pstrut\" style=\"height:2.7em;\">\u003c/span>\u003cspan class=\"sizing reset-size6 size3 mtight\">\u003cspan class=\"mord mathnormal mtight\">x\u003c/span>\u003c/span>\u003c/span>\u003c/span>\u003cspan class=\"vlist-s\">​\u003c/span>\u003c/span>\u003cspan class=\"vlist-r\">\u003cspan class=\"vlist\" style=\"height:0.15em;\">\u003cspan>\u003c/span>\u003c/span>\u003c/span>\u003c/span>\u003c/span>\u003c/span>\u003c/span>\u003c/span>\u003c/span>\u003c/span>，右子树反之。\u003c/p>\n\u003cp>二叉搜索树的优点：\u003c/p>\n\u003col>\n\u003cli>具有单调性，可以 \u003cspan tabindex=\"0\" role=\"text\" aria-label=\"l, o, g, start subscript, 2, end subscript\">\u003cspan class=\"katex\">\u003cspan class=\"katex-mathml\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\">\u003csemantics>\u003cmrow>\u003cmi>l\u003c/mi>\u003cmi>o\u003c/mi>\u003cmsub>\u003cmi>g\u003c/mi>\u003cmn>2\u003c/mn>\u003c/msub>\u003c/mrow>\u003cannotation encoding=\"application/x-tex\">log_2\u003c/annotation>\u003c/semantics>\u003c/math>\u003c/span>\u003cspan class=\"katex-html\" aria-hidden=\"true\">\u003cspan class=\"base\">\u003cspan class=\"strut\" style=\"height:0.8889em;vertical-align:-0.1944em;\">\u003c/span>\u003cspan class=\"mord mathnormal\" style=\"margin-right:0.01968em;\">l\u003c/span>\u003cspan class=\"mord mathnormal\">o\u003c/span>\u003cspan class=\"mord\">\u003cspan class=\"mord mathnormal\" style=\"margin-right:0.03588em;\">g\u003c/span>\u003cspan class=\"msupsub\">\u003cspan class=\"vlist-t vlist-t2\">\u003cspan class=\"vlist-r\">\u003cspan class=\"vlist\" style=\"height:0.3011em;\">\u003cspan style=\"top:-2.55em;margin-left:-0.0359em;margin-right:0.05em;\">\u003cspan class=\"pstrut\" style=\"height:2.7em;\">\u003c/span>\u003cspan class=\"sizing reset-size6 size3 mtight\">\u003cspan class=\"mord mtight\">2\u003c/span>\u003c/span>\u003c/span>\u003c/span>\u003cspan class=\"vlist-s\">​\u003c/span>\u003c/span>\u003cspan class=\"vlist-r\">\u003cspan class=\"vlist\" style=\"height:0.15em;\">\u003cspan>\u003c/span>\u003c/span>\u003c/span>\u003c/span>\u003c/span>\u003c/span>\u003c/span>\u003c/span>\u003c/span>\u003c/span> 的时间查找。\u003c/li>\n\u003cli>二叉搜索树的中序遍历是单调不减的，可以将下标当做权值，这样一个序列可以映射到一棵二叉搜索树。\u003c/li>\n\u003c/ol>\n\u003cp>为什么需要平衡树？\u003c/p>\n\u003cul>\n\u003cli>一个序列对应的二叉搜索树不唯一。我们希望找到高度最小的那颗应用。\u003c/li>\n\u003c/ul>\n\u003cp>若一棵二叉树的任意一个结点 \u003cspan tabindex=\"0\" role=\"text\" aria-label=\"x\">\u003cspan class=\"katex\">\u003cspan class=\"katex-mathml\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\">\u003csemantics>\u003cmrow>\u003cmi>x\u003c/mi>\u003c/mrow>\u003cannotation encoding=\"application/x-tex\">x\u003c/annotation>\u003c/semantics>\u003c/math>\u003c/span>\u003cspan class=\"katex-html\" aria-hidden=\"true\">\u003cspan class=\"base\">\u003cspan class=\"strut\" style=\"height:0.4306em;\">\u003c/span>\u003cspan class=\"mord mathnormal\">x\u003c/span>\u003c/span>\u003c/span>\u003c/span>\u003c/span>，其左右子树高度差不超过 \u003cspan tabindex=\"0\" role=\"text\" aria-label=\"1\">\u003cspan class=\"katex\">\u003cspan class=\"katex-mathml\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\">\u003csemantics>\u003cmrow>\u003cmn>1\u003c/mn>\u003c/mrow>\u003cannotation encoding=\"application/x-tex\">1\u003c/annotation>\u003c/semantics>\u003c/math>\u003c/span>\u003cspan class=\"katex-html\" aria-hidden=\"true\">\u003cspan class=\"base\">\u003cspan class=\"strut\" style=\"height:0.6444em;\">\u003c/span>\u003cspan class=\"mord\">1\u003c/span>\u003c/span>\u003c/span>\u003c/span>\u003c/span>，称为二叉平衡树。\u003c/p>\n\u003c!-- more -->\n\u003cp>算法竞赛领域常用的平衡树：\u003c/p>\n\u003col>\n\u003cli>treap\u003c/li>\n\u003cli>splay\u003c/li>\n\u003cli>fhq_treap\u003c/li>\n\u003c/ol>\n\u003cp>其中，treap 和 fhq_treap 利用的是随机平衡，不追求绝对平衡。splay 是贪心策略平衡。treap 和 splay 都是通过旋转改变形态，fhq_treap 通过分裂和合并来改变形态。\u003c/p>\n\u003ch2 id=\"fhq_treap-%E5%AE%9E%E7%8E%B0\" tabindex=\"-1\">Fhq_treap 实现 \u003ca href=\"#fhq_treap-%E5%AE%9E%E7%8E%B0\" class=\"header-anchor\">¶\u003c/a>\u003c/h2>\n\u003col>\n\u003cli>\n\u003cp>分裂操作\u003c/p>\n\u003cp>将一棵平衡树分裂成 \u003cspan tabindex=\"0\" role=\"text\" aria-label=\"a\">\u003cspan class=\"katex\">\u003cspan class=\"katex-mathml\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\">\u003csemantics>\u003cmrow>\u003cmi>a\u003c/mi>\u003c/mrow>\u003cannotation encoding=\"application/x-tex\">a\u003c/annotation>\u003c/semantics>\u003c/math>\u003c/span>\u003cspan class=\"katex-htm
