	<script type="application/json" id="post-data">{"id":"区间dp","metadata":{"id":"区间dp","title":"区间 dp","date":"2025-01-01","tags":["动态规划","区间dp"],"summary":"是一类子问题从短到长，而不是从左到右的动态规划问题。 一般是：$dp {i,j}$ 表示将区间 $ i,j $ 的元素合并、拆分的最值、方案数。\ncp..."},"markdown":"# 区间DP\r\n- 是一类子问题从短到长，而不是从左到右的动态规划问题。\r\n## 状态\r\n一般是：$dp_{i,j}$ 表示将区间 $[i,j]$ 的元素合并、拆分的最值、方案数。\r\n## 转移\r\n```cpp\r\nfor (int len = 2; len \u003c= n; len++)//这问题\r\n\tfor (int i = 1; i + len - 1 \u003c= n; i++)//状态\r\n\t{\r\n\t\tint j = i + len - 1;\r\n\t\tfor (int k = i; k \u003c j; k++)//决策点\r\n\t\tdp[i][j] = 运算(dp[i][j], 状态转移方程);\r\n\t}\r\n```\r\n\r\n\u003c!-- more -->\r\n\r\n## 例题\r\n### 洛谷P1775\r\n[P1775 石子合并（弱化版）](https://www.luogu.com.cn/problem/P1775)\r\n> 设有 $N(N \\le 300)$ 堆石子排成一排，其编号为 $1,2,3,\\cdots,N$。每堆石子有一定的质量 $m_i\\ (m_i \\le 1000)$。现在要将这 $N$ 堆石子合并成为一堆。每次只能合并相邻的两堆，合并的代价为这两堆石子的质量之和，合并后与这两堆石子相邻的石子将和新堆相邻。合并时由于选择的顺序不同，合并的总代价也不相同。试找出一种合理的方法，使总的代价最小，并输出最小代价。\r\n#### 状态\r\n$dp_{i,j}$ 表示将区间 $[i,j]$ 的元素合并的最小代价。\r\n#### 转移\r\n```cpp\r\nfor (int k = i; k \u003c j; k++)\r\n\tdp[i][j] = min(dp[i][j], dp[i][k] + dp[k + 1][j]);\r\ndp[i][j] += sum[j] - sum[i - 1];\r\n```\r\n#### 答案\r\n$dp_{1,n}$\r\n### 洛谷P3146\r\n[P3146 [USACO16OPEN] 248 G](https://www.luogu.com.cn/problem/P3146)\r\n> 贝西喜欢在手机上下载游戏来玩，尽管她确实觉得对于自己巨大的蹄子来说，小小的触摸屏用起来相当笨拙。\r\n> \r\n> 她对当前正在玩的这个游戏特别感兴趣。游戏开始时给定一个包含 $N$ 个正整数的序列（$2 \\leq N \\leq 248$），每个数的范围在 $1 \\ldots 40$ 之间。在一次操作中，贝西可以选择两个相邻且相等的数，将它们替换为一个比原数大 1 的数（例如，她可以将两个相邻的 7 替换为一个 8）。游戏的目标是最大化最终序列中的最大数值。请帮助贝西获得尽可能高的分数！\r\n#### 状态\r\n$dp_{i,j}$ 表示将区间 $[i,j]$ 的元素合并的最大能得到的数。\r\n#### 转移\r\n```cpp\r\nfor (int k = i; k \u003c j; k++)\r\n\tif (dp[i][k] == dp[k + 1][j])\r\n\t\tdp[i][j] = max(dp[i][j], dp[i][k] + 1);\r\n```\r\n#### 答案\r\n$max(dp_{i,j})$\r\n### 洛谷P1622\r\n[P1622 释放囚犯](https://www.luogu.com.cn/problem/P1622)\r\n> Caima 王国中有一个奇怪的监狱，这个监狱一共有 $P$ 个牢房，这些牢房一字排开，第 $i$ 个紧挨着第 $i+1$ 个（最后一个除外）。现在正好牢房是满的。\r\n> \r\n> 上级下发了一个释放名单，要求每天释放名单上的一个人。这可把看守们吓得不轻，因为看守们知道，现在牢房中的 $P$ 个人，可以相互之间传话。如果某个人离开了，那么原来和这个人能说上话的人，都会很气愤，导致他们那天会一直大吼大叫，搞得看守很头疼。如果给这些要发火的人吃上肉，他们就会安静点。\r\n#### 状态\r\n$dp_{i,j}$ 表示将区间 $[a_i,a_j]$ 的人放在一起需要给的肉的数量。\r\n#### 转移\r\n```cpp\r\nfor (int k = i; k \u003c j; k++)\r\n\tdp[i][j] = min(dp[i][j], dp[i][k] + dp[k + 1][j]);\r\ndp[i][j] += sum[j] - sum[i - 1] + j - i - 1;\r\n```\r\n#### 答案\r\n$dp_{1,n}$\r\n### 洛谷P2890\r\n[P2890 [USACO07OPEN] Cheapest Palindrome G](https://www.luogu.com.cn/problem/P2890)\r\n> 给定一个由 $n$ 个不同的小写字母构成的长 $m$ 的字符串 $s$。可以通过**在 $s$ 的任意位置**增减字母将 $s$ 改为回文串。增减字母的花费不同，求最小花费。\r\n#### 状态\r\n$dp_{i,j}$ 表示将区间 $[i,j]$ 变成回文串的最小花费。\r\n#### 转移\r\n```cpp\r\nif (s[i] == s[j])\r\n\tdp[i][j] = (len > 2 ? dp[i + 1][j - 1] : 0);\r\ndp[i][j] = min({ dp[i][j],dp[i][j - 1] + a[s[j]],dp[i + 1][j] + a[s[i]] });\r\n```\r\n#### 答案\r\n$dp_{1,n}$\r\n#### 类似题\r\n- [P1435 [IOI 2000] 回文字串](https://www.luogu.com.cn/problem/P1435)，只不过代价为 $1$。\r\n### 洛谷P2858\r\n[P2858 [USACO06FEB] Treats for the Cows G/S](https://www.luogu.com.cn/problem/P2858)\r\n> 约翰经常给产奶量高的奶牛发特殊津贴，于是很快奶牛们拥有了大笔不知该怎么花的钱。为此，约翰购置了 $N$（$1 \\leq N \\leq 2000$） 份美味的零食来卖给奶牛们。每天约翰售出一份零食。当然约翰希望这些零食全部售出后能得到最大的收益，这些零食有以下这些有趣的特性：\r\n> + 零食按照 $1, \\ldots, N$ 编号，它们被排成一列放在一个很长的盒子里。盒子的两端都有开口，约翰每天可以从盒子的任一端取出最外面的一个。\r\n> + 与美酒与好吃的奶酪相似，这些零食储存得越久就越好吃。当然，这样约翰就可以把它们卖出更高的价钱。\r\n> + 每份零食的初始价值不一定相同。约翰进货时，第i份零食的初始价值为 $V_i$（$1 \\leq V \\leq 1000$）。\r\n> + 第i份零食如果在被买进后的第 $a$ 天出售，则它的售价是 $V_i \\times a$。\r\n> \r\n> $V_i$ 的是从盒子顶端往下的第i份零食的初始价值。约翰告诉了你所有零食的初始价值，并希望你能帮他计算一下，在这些零食全被卖出后，他最多能得到多少钱。\r\n#### 状态\r\n$dp_{i,j}$ 表示只将区间 $[a_i,a_j]$ 买完的最大价值。\r\n#### 转移\r\n```cpp\r\ndp[i][j] = max(dp[i][j - 1], dp[i + 1][j]) + sum[j] - sum[i - 1];\r\n```\r\n#### 答案\r\n$dp_{1,n}$\r\n### 洛谷P4170\r\n[P4170 [CQOI2007] 涂色](https://www.luogu.com.cn/problem/P4170)\r\n#### 状态\r\n$dp_{i,j}$ 表示将区间 $[i,j]$ 达到目标的最少涂色次数。\r\n#### 转移\r\n```cpp\r\nif (s[i] == s[j])\r\n\tdp[i][j] = min(dp[i][j - 1], dp[i + 1][j]);\r\nelse\r\n\tfor (int k = i; k \u003c j; k++)\r\n\t\tdp[i][j] = min(dp[i][j], dp[i][k] + dp[k + 1][j]);\r\n```\r\n#### 答案\r\n$dp_{1,n}$\r\n### 洛谷P3205\r\n[P3205 [HNOI2010] 合唱队](https://www.luogu.com.cn/problem/P3205)\r\n> ...\r\n> 小 A 心中有一个理想队形，他想知道多少种初始队形可以获得理想的队形。\r\n> 请求出答案对 $19650827$ 取模的值。\r\n#### 状态\r\n$dp_{i,j,0/1}$ 表示这一次是添加到开头/结尾，将区间 $[i,j]$ 达到理想的队形的方案数。\r\n#### 转移\r\n```cpp\r\nif (a[i] \u003c a[i + 1])\r\n\tdp[i][j][0] = (dp[i][j][0] + dp[i + 1][j][0]) % mod;\r\nif (a[i] \u003c a[j])\r\n\tdp[i][j][0] = (dp[i][j][0] + dp[i + 1][j][1]) % mod;\r\nif (a[j] > a[j - 1])\r\n\tdp[i][j][1] = (dp[i][j][1] + dp[i][j - 1][1]) % mod;\r\nif (a[j] > a[i])\r\n\tdp[i][j][1] = (dp[i][j][1] + dp[i][j - 1][0]) % mod;\r\n```\r\n#### 答案\r\n$(dp_{1,n,0}+dp_{1,n,1})\\mod 19650827$\r\n## 总结\r\n1. 题目特征上有合并类、拆分类、两端处理类；\r\n2. 求最值类区间DP，需要注意无效状态初始化；\r\n3. 输出答案前，判断是否需要枚举；\r\n4. 决策点一般是在中间枚举或是两个端点；\r\n5. 若转移时可以从 $dp_{i+1,j-1}$ 递推，需要注意 $len=2$ 的情况；\r\n6. 初始状态要分析清楚。","html":"\u003ch1 id=\"%E5%8C%BA%E9%97%B4dp\" tabindex=\"-1\">区间 DP \u003ca href=\"#%E5%8C%BA%E9%97%B4dp\" class=\"header-anchor\">¶\u003c/a>\u003c/h1>\n\u003cul>\n\u003cli>是一类子问题从短到长，而不是从左到右的动态规划问题。\u003c/li>\n\u003c/ul>\n\u003ch2 id=\"%E7%8A%B6%E6%80%81\" tabindex=\"-1\">状态 \u003ca href=\"#%E7%8A%B6%E6%80%81\" class=\"header-anchor\">¶\u003c/a>\u003c/h2>\n\u003cp>一般是：\u003cspan tabindex=\"0\" role=\"text\" aria-label=\"d, p, start subscript, i, comma, j, end subscript\">\u003cspan class=\"katex\">\u003cspan class=\"katex-mathml\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\">\u003csemantics>\u003cmrow>\u003cmi>d\u003c/mi>\u003cmsub>\u003cmi>p\u003c/mi>\u003cmrow>\u003cmi>i\u003c/mi>\u003cmo separator=\"true\">,\u003c/mo>\u003cmi>j\u003c/mi>\u003c/mrow>\u003c/msub>\u003c/mrow>\u003cannotation encoding=\"application/x-tex\">dp_{i,j}\u003c/annotation>\u003c/semantics>\u003c/math>\u003c/span>\u003cspan class=\"katex-html\" aria-hidden=\"true\">\u003cspan class=\"base\">\u003cspan class=\"strut\" style=\"height:0.9805em;vertical-align:-0.2861em;\">\u003c/span>\u003cspan class=\"mord mathnormal\">d\u003c/span>\u003cspan class=\"mord\">\u003cspan class=\"mord mathnormal\">p\u003c/span>\u003cspan class=\"msupsub\">\u003cspan class=\"vlist-t vlist-t2\">\u003cspan class=\"vlist-r\">\u003cspan class=\"vlist\" style=\"height:0.3117em;\">\u003cspan style=\"top:-2.55em;margin-left:0em;margin-right:0.05em;\">\u003cspan class=\"pstrut\" style=\"height:2.7em;\">\u003c/span>\u003cspan class=\"sizing reset-size6 size3 mtight\">\u003cspan class=\"mord mtight\">\u003cspan class=\"mord mathnormal mtight\">i\u003c/span>\u003cspan class=\"mpunct mtight\">,\u003c/span>\u003cspan class=\"mord mathnormal mtight\" style=\"margin-right:0.05724em;\">j\u003c/span>\u003c/span>\u003c/span>\u003c/span>\u003c/span>\u003cspan class=\"vlist-s\">​\u003c/span>\u003c/span>\u003cspan class=\"vlist-r\">\u003cspan class=\"vlist\" style=\"height:0.2861em;\">\u003cspan>\u003c/span>\u003c/span>\u003c/span>\u003c/span>\u003c/span>\u003c/span>\u003c/span>\u003c/span>\u003c/span>\u003c/span> 表示将区间 \u003cspan tabindex=\"0\" role=\"text\" aria-label=\"open bracket, i, comma, j, close bracket\">\u003cspan class=\"katex\">\u003cspan class=\"katex-mathml\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\">\u003csemantics>\u003cmrow>\u003cmo stretchy=\"false\">[\u003c/mo>\u003cmi>i\u003c/mi>\u003cmo separator=\"true\">,\u003c/mo>\u003cmi>j\u003c/mi>\u003cmo stretchy=\"false\">]\u003c/mo>\u003c/mrow>\u003cannotation encoding=\"application/x-tex\">[i,j]\u003c/annotation>\u003c/semantics>\u003c/math>\u003c/span>\u003cspan class=\"katex-html\" aria-hidden=\"true\">\u003cspan class=\"base\">\u003cspan class=\"strut\" style=\"height:1em;vertical-align:-0.25em;\">\u003c/span>\u003cspan class=\"mopen\">[\u003c/span>\u003cspan class=\"mord mathnormal\">i\u003c/span>\u003cspan class=\"mpunct\">,\u003c/span>\u003cspan class=\"mspace\" style=\"margin-right:0.1667em;\">\u003c/span>\u003cspan class=\"mord mathnormal\" style=\"margin-right:0.05724em;\">j\u003c/span>\u003cspan class=\"mclose\">]\u003c/span>\u003c/span>\u003c/span>\u003c/span>\u003c/span> 的元素合并、拆分的最值、方案数。\u003c/p>\n\u003ch2 id=\"%E8%BD%AC% t\" aria-label=\"i\">\u003cspan class=\"katex\">\u003cspan class=\"katex-mathml\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\">\u003csemantics>\u003cmrow>\u003cmi>i\u003c/mi>\u003c/mrow>\u003cannotation encoding=\"application/x-tex\">i\u003c/annotation>\u003c/semantics>\u003c/math>\u003c/span>\u003cspan class=\"katex-html\" aria-hidden=\"true\">\u003cspan class=\"base\">\u003cspan class=\"strut\" style=\"height:0.6595em;\">\u003c/span>\u003cspan class=\"mord mathnormal\">i\u003c/span>\u003c/span>\u003c/span>\u003c/span>\u003c/span> 个紧挨着第 \u003cspan tabindex=\"0\" role=\"text\" aria-label=\"i, plus, 1\">\u003cspan class=\"katex\">\u003cspan class=\"katex-mathml\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\">\u003csemantics>\u003cmrow>\u003cmi>i\u003c/mi>\u003cmo>+\u003c/mo>\u003cmn>1\u003c/mn>\u003c/mrow>\u003cannotation encoding=\"application/x-tex\">i+1\u003c/annotation>\u003c/semantics>\u003c/math>\u003c/span>\u003cspan class=\"katex-html\" aria-hidden=\"true\">\u003cspan class=\"base\">\u003cspan class=\"strut\" style=\"height:0.7429em;vertical-align:-0.0833em;\">\u003c/span>\u003cspan class=\"mord mathnormal\">i\u003c/span>\u003cspan class=\"mspace\" style=\"margin-right:0.2222em;\">\u003c/span>\u003cspan class=\"mbin\">+\u003c/span>\u003cspan class=\"mspace\" style=\"margin-right:0.2222em;\">\u003c/span>\u003c/span>\u003cspan class=\"base\">\u003cspan class=\"strut\" style=\"height:0.6444em;\">\u003c/span>\u003cspan class=\"mord\">1\u003c/span>\u003c/span>\u003c/span>\u003c/span>\u003c/span> 个（最后一个除外）。现在正好牢房是满的。\u003c/p>\n\u003cp>上级下发了一个释放名单，要求每天释放名单上的一个人。这可把看守们吓得不轻，因为看守们知道，现在牢房中的 \u003cspan tabindex=\"0\" role=\"text\" aria-label=\"P\">\u003cspan class=\"katex\">\u003cspan class=\"katex-mathml\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\">\u003csemantics>\u003cmrow>\u003cmi>P\u003c/mi>\u003c/mrow>\u003cannotation encoding=\"application/x-tex\">P\u003c/annotation>\u003c/semantics>\u003c/math>\u003c/span>\u003cspan class=\"katex ex-html\" aria-hidden=\"true\">\u003cspan class=\"base\">\u003cspan class=\"strut\" style=\"height:0.9805em;vertical-align:-0.2861em;\">\u003c/span>\u003cspan class=\"mord mathnormal\">d\u003c/span>\u003cspan class=\"mord\">\u003cspan class=\"mord mathnormal\">p\u003c/span>\u003cspan class=\"msupsub\">\u003cspan class=\"vlist-t vlist-t2\">\u003cspan class=\"vlist-r\">\u003cspan class=\"vlist\" style=\"height:0.3011em;\">\u003cspan style=\"top:-2.55em;margin-left:0em;margin-right:0.05em;\">\u003cspan class=\"pstrut\" style=\"height:2.7em;\">\u003c/span>\u003cspan class=\"sizing reset-size6 size3 mtight\">\u003cspan class=\"mord mtight\">\u003cspan class=\"mord mtight\">1\u003c/span>\u003cspan class=\"mpunct mtight\">,\u003c/span>\u003cspan class=\"mord mathnormal mtight\">n\u003c/span>\u003c/span>\u003c/span>\u003c/span>\u003c/span>\u003cspan class=\"vlist-s\">​\u003c/span>\u003c/span>\u003cspan class=\"vlist-r\">\u003cspan class=\"vlist\" style=\"height:0.2861em;\">\u003cspan>\u003c/span>\u003c/span>\u003c/span>\u003c/span>\u003c/span>\u003c/span>\u003c/span>\u003c/span>\u003c/span>\u003c/span>\u003c/p>\n\u003ch4 id=\"%E7%B1%BB%E4%BC%BC%E9%A2%98\" tabindex=\"-1\">类似题 \u003ca href=\"#%E7%B1%BB%E4%BC%BC%E9%A2%98\" class=\"header-anchor\">¶\u003c/a>\u003c/h4>\n\u003cul>\n\u003cli>\u003ca href=\"https://www.luogu.com.cn/problem/P1435\">P1435 [IOI 2000] 回文字串\u003c/a>，只不过代价为 \u003cspan tabindex=\"0\" role=\"text\" aria-label=\"1\">\u003cspan class=\"katex\">\u003cspan class=\"katex-mathml\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\">\u003csemantics>\u003cmrow>\u003cmn>1\u003c/mn>\u003c/mrow>\u003cannotation encoding=\"application/x-tex\">1\u003c/annotation>\u003c/semantics>\u003c/math>\u003c/span>\u003cspan class=\"katex-html\" aria-hidden=\"true\">\u003cspan class=\"base\">\u003cspan class=\"strut\" style=\"height:0.6444em;\">\u003c/span>\u003cspan class=\"mord\">1\u003c/span>\u003c/span>\u003c/span>\u003c/span>\u003c/span>。\u003c/li>\n\u003c/ul>\n\u003ch3 id=\"%E6%B4%9B%E8%B0%B7p2858\" tabindex=\"-1\">洛谷 P2858 \u003ca href=\"#%E6%B4%9B%E8%B0%B7p2858\" class=\"header-anchor\">¶\u003c/a>\u003c/h3>\n\u003cp>\u003ca href=\"https://www.luogu.com.cn/problem/P2858\">P2858 [USACO06FEB] Treats for the Cows G/S\u003c/a>\u003c/p>\n\u003cblockquote>\n\u003cp>约翰经常给产奶量高的奶牛发特殊津贴，于是很快奶牛们拥有了大笔不知该怎么花的钱。为此，约翰购置了 \u003cspan tabindex=\"0\" role=\"text\" aria-label=\"N\">\u003cspan class=\"katex\">\u003cspan class=\"katex-mathml\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\">\u003csemantics>\u003cmrow>\u003cmi>N\u003c/mi>\u003c/mrow>\u003cannotation encoding=\"application/x-tex\">N\u003c/annotation>\u003c/semantics>\u003c/math>\u003c/span>\u003cspan class=\"katex-html\" aria-hidden=\"true\">\u003cspan class=\"base\">\u003cspan class=\"strut\" style=\"height:0.6833em;\">\u003c/span>\u003cspan class=\"mord mathnormal\" style=\"margin-right:0.10903em;\">N\u003c/span>\u003c/span>\u003c/span>\u003c/span>\u003c/span>（\u003cspan tabindex=\"0\" role=\"text\" aria-label=\"1, is less than or equal to, N, is less than or equal to, 2000\">\u003cspan class=\"katex\">\u003cspan class=\"katex-mathml\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\">\u003csemantics>\u003cmrow>\u003cmn>1\u003c/mn>\u003cmo>≤\u003c/mo>\u003cmi>N\u003c/mi>\u003cmo>≤\u003c/mo>\u003cmn>2000\u003c/mn>\u003c/mrow>\u003cannotation encoding=\"application/x-tex\">1 \\leq N \\leq 2000\u003c/annotation>\u003c/semantics>\u003c/math>\u003c/span>\u003cspan class=\"katex-html\" aria-hidden=\"true\">\u003cspan class=\"base\">\u003cspan class=\"strut\" style=\"height:0.7804em;vertical-align:-0.136em;\">\u003c/span>\u003cspan class=\"mord\">1\u003c/span>\u003cspan class=\"mspace\" style=\"margin-right:0.2778em;\">\u003c/span>\u003cspan class=\"mrel\">≤\u003c/span>\u003cspan class=\"mspace\" style=\"margin-right:0.2778em;\">\u003c/span>\u003c/span>\u003cspan class=\"base\">\u003cspan class=\"strut\" style=\"height:0.8193em;vertical-align:-0.136em;\">\u003c/span>\u003cspan class=\"mord mathnormal\" style=\"margin-right:0.10903em;\">N\u003c/span>\u003cspan class=\"mspace\" style=\"margin-right:0.2778em;\">\u003c/span>\u003cspan class=\"mrel\">≤\u003c/span>\u003cspan class=\"mspace\" style=\"margin-right:0.2778em;\">\u003c/span>\u003c/span>\u003cspan class=\"base\">\u003cspan class=\"strut\" style=\"height:0.6444em;\">\u003c/span>\u003cspan class=\"mord\">2000\u003c/span>\u003c/span>\u003c/span>\u003c/span>\u003c/span>） 份美味的零食来卖给奶牛们。每天约翰售出一份零食。当然约翰希望这些零食全部售出后能得到最大的收益，这些零食有以下这些有趣的特性：\u003c/p>\n\u003cul>\n\u003cli>零食按照 \u003cspan tabindex=\"0\" role=\"text\" aria-label=\"1, comma, dots, comma, N\">\u003cspan class=\"katex\">\u003cspan class=\"katex-mathml\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\">\u003csemantics>\u003cmrow>\u003cmn>1\u003c/mn>\u003cmo separator=\"true\">,\u003c/mo>\u003cmo>…\u003c/mo>\u003cmo separator=\"true\">,\u003c/mo>\u003cmi>N\u003c/mi>\u003c/mrow>\u003cannotation encoding=\"application/x-tex\">1, \\ldots, N\u003c/annotation>\u003c/semantics>\u003c/math>\u003c/span>\u003cspan class=\"katex-html\" aria-hidden=\"true\">\u003cspan class=\"base\">\u003cspan class=\"strut\" style=\"height:0.8778em;vertical-align:-0.1944em;\">\u003c/span>\u003cspan class=\"mord\">1\u003c/span>\u003cspan class=\"mpunct\">,\u003c/span>\u003cspan class=\"mspace\" style=\"margin-right:0.1667em;\">\u003c/span>\u003cspan class=\"minner\">…\u003c/span>\u003cspan class=\"mspace\" style=\"margin-right:0.1667em;\">\u003c/span>\u003cspan class=\"mpunct\">,\u003c/span>\u003cspan class=\"mspace\" style=\"margin-right:0.1667em;\">\u003c/span>\u003cspan class=\"mord mathnormal\" style=\"margin-right:0.10903em;\">N\u003c/span>\u003c/span>\u003c/span>\u003c/span>\u003c/span> 编号，它们被排成一列放在一个很长的盒子里。盒子的两端都有开口，约翰每天可以从盒子的任一端取出最外面的一个。\u003c/li>\n\u003cli>与美酒与好吃的奶酪相似，这些零食储存得越久就越好吃。当然，这样约翰就可以把它们卖出更高的价钱。\u003c/li>\n\u003cli>每份零食的初始价值不一定相同。约翰进货时，第 i 份零食的初始价值为 \u003cspan tabindex=\"0\" role=\"text\" aria-label=\"V, start subscript, i, end subscript\">\u003cspan class=\"katex\">\u003cspan class=\"katex-mathml\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\">\u003csemantics>\u003cmrow>\u003cmsub>\u003cmi>V\u003c/mi>\u003cmi>i\u003c/mi>\u003c/msub>\u003c/mrow>\u003cannotation encoding=\"application/x-tex\">V_i\u003c/annotation>\u003c/semantics>\u003c/math>\u003c/span>\u003cspan class=\"katex-html\" aria-hidden=\"true\">\u003cspan class=\"base\">\u003cspan class=\"strut\" style=\"height:0.8333em;vertical-align:-0.15em;\">\u003c/span>\u003cspan class=\"mord\">\u003cspan class=\"mord mathnormal\" style=\"margin-right:0.22222em;\">V\u003c/span>\u003cspan class=\"msupsub\">\u003cspan class=\"vlist-t vlist-t2\">\u003cspan class=\"vlist-r\">\u003cspan class=\"vlist\" style=\"height:0.3117em;\">\u003cspan style=\"top:-2.55em;margin-left:-0.2222em;margin-right:0.05em;\">\u003cspan class=\"pstrut\" style=\"height:2.7em;\">\u003c/span>\u003cspan class=\"sizing reset-size6 size3 mtight\">\u003cspan class=\"mord mathnormal mtight\">i\u003c/span>\u003c/span>\u003c/span>\u003c/span>\u003cspan class=\"vlist-s\">​\u003c/span>\u003c/span>\u003cspan class=\"vlist-r\">\u003cspan class=\"vlist\" style=\"height:0.15em;\">\u003cspan>\u003c/span>\u003c/span>\u003c/span>\u003c/span>\u003c/span>\u003c/span>\u003c/span>\u003c/span>\u003c/span>\u003c/span>（\u003cspan tabindex=\"0\" role=\"text\" aria-label=\"1, is less than or equal to, V, is less than or equal to, 1000\">\u003cspan class=\"katex\">\u003cspan class=\"katex-mathml\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\">\u003csemantics>\u003cmrow>\u003cmn>1\u003c/mn>\u003cmo>≤\u003c/mo>\u003cmi>V\u003c/mi>\u003cmo>≤\u003c/mo>\u003cmn>1000\u003c/mn>\u003c/mrow>\u003cannotation encoding=\"application/x-tex\">1 \\leq V \\leq 1000\u003c/annotation>\u003c/semantics>\u003c/math>\u003c/span>\u003cspan class=\"katex-html\" aria-hidden=\"true\">\u003cspan class=\"base\">\u003cspan class=\"strut\" style=\"height:0.7804em;vertical-align:-0.136em;\">\u003c/span>\u003cspan class=\
