	<script type="application/json" id="post-data">{"id":"区间dp（三）","metadata":{"id":"区间dp（三）","title":"区间 dp（三）","date":"2025-01-01","tags":["动态规划","区间dp"],"summary":"P1880 NOI1995 石子合并 洛谷 https://www.luogu.com.cn/problem/P1880 \n石子在圆形操场的四周摆放，直接当没有环形区间 dp 显然会少答案。那么我们一定要这么做怎么办？少了的话可以加回来，斩环为链，数组多一倍，再区间 dp..."},"markdown":"# 区间dp（三）\r\n\r\n## 洛谷P1880\r\n\r\n[P1880 [NOI1995] 石子合并 - 洛谷](https://www.luogu.com.cn/problem/P1880)\r\n\r\n石子在圆形操场的四周摆放，直接当没有环形区间dp显然会少答案。那么我们一定要这么做怎么办？少了的话可以加回来，斩环为链，数组多一倍，再区间dp。\r\n\r\n$dp_{0/1,i,j}$ 表示区间合并 $[i,j]$ 的最小/最大值。\r\n\r\n答案为 $\\displaystyle\\min_{1\\le i\\lt n}^idp_{0,i,i+n-1}$ 和 $\\displaystyle\\max_{1\\le i\\lt n}^idp_{1,i,i+n-1}$。\r\n\r\n$\\displaystyle dp_{0,i,j}=\\min_{i\\le k\\lt j}^k\\left(dp_{0,i,k}+dp_{0,k+1,j}+\\sum_{i\\le l\\le j}^la_l\\right)$，$\\displaystyle dp_{1,i,j}=\\max_{i\\le k\\lt j}^k\\left(dp_{1,i,k}+dp_{1,k+1,j}+\\sum_{i\\le l\\le j}^la_l\\right)$。\r\n\r\n\u003c!-- more -->\r\n\r\n```cpp\r\n#include\u003cbits/stdc++.h>\r\ntypedef int int32;\r\n#define int long long\r\nusing namespace std;\r\nconst int N = 200 + 5;\r\nint n, a[N], dp[2][N][N], sum[N], maxi, mini = LLONG_MAX;\r\nsigned main()\r\n{\r\n\tios::sync_with_stdio(0);\r\n\tcin.tie(0), cout.tie(0);\r\n\tcin >> n;\r\n\tmemset(dp[0], 0x3f, sizeof dp[0]);\r\n\tmemset(dp[1], 0xcf, sizeof dp[1]);\r\n\tfor (int i = 1; i \u003c= n; i++)\r\n\t{\r\n\t\tcin >> a[i];\r\n\t\ta[i + n] = a[i];\r\n\t}\r\n\tfor (int i = 1; i \u003c= 2 * n; i++)\r\n\t\tsum[i] = sum[i - 1] + a[i], dp[0][i][i] = dp[1][i][i] = 0;\r\n\tfor (int len = 2; len \u003c= n; len++)\r\n\t\tfor (int i = 1; i + len - 1 \u003c= 2 * n; i++)\r\n\t\t{\r\n\t\t\tint j = i + len - 1, tmp = sum[j] - sum[i - 1];\r\n\t\t\tfor (int k = i; k \u003c j; k++)\r\n\t\t\t{\r\n\t\t\t\tdp[0][i][j] = min(dp[0][i][j], dp[0][i][k] + dp[0][k + 1][j] + tmp);\r\n\t\t\t\tdp[1][i][j] = max(dp[1][i][j], dp[1][i][k] + dp[1][k + 1][j] + tmp);\r\n\t\t\t}\r\n\t\t}\r\n\tfor (int i = 1; i \u003c n; i++)\r\n\t{\r\n\t\tmini = min(mini, dp[0][i][i + n - 1]);\r\n\t\tmaxi = max(maxi, dp[1][i][i + n - 1]);\r\n\t}\r\n\tcout \u003c\u003c mini \u003c\u003c '\\n' \u003c\u003c maxi;\r\n\treturn 0;\r\n}\r\n```\r\n\r\n## 洛谷P1063\r\n\r\n[P1063 能量项链](https://www.luogu.com.cn/problem/P1063)\r\n\r\n这一题也是斩环为链，但需要注意计算答案时要弄清楚位置。\r\n\r\n$dp_{i,j}$ 表示区间 $[i,j]$ 的最大能量值。\r\n\r\n$\\displaystyle dp_{i,j}=\\max_{i\\lt k\\lt j}^k\\left(dp_{i,k}+dp_{k,j}+a_i\\cdot a_j\\cdot a_k\\right)$。\r\n\r\n```cpp\r\n#include\u003cbits/stdc++.h>\r\ntypedef int int32;\r\n#define int long long\r\nusing namespace std;\r\nconst int N = 200 + 5;\r\nint n, a[N], dp[N][N], maxi;\r\nsigned main()\r\n{\r\n\tios::sync_with_stdio(0);\r\n\tcin.tie(0), cout.tie(0);\r\n\tcin >> n;\r\n\tfor (int i = 1; i \u003c= n; i++)\r\n\t{\r\n\t\tcin >> a[i];\r\n\t\ta[i + n] = a[i];\r\n\t}\r\n\tfor (int len = 2; len \u003c= n + 1; len++)\r\n\t\tfor (int i = 1; i + len - 1 \u003c= 2 * n; i++)\r\n\t\t{\r\n\t\t\tint j = i + len - 1;\r\n\t\t\tfor (int k = i + 1; k \u003c j; k++)\r\n\t\t\t\tdp[i][j] = max(dp[i][j], dp[i][k] + dp[k][j] +\r\n\t\t\t\t\ta[i] * a[j] * a[k]);\r\n\t\t}\r\n\tfor (int i = 1; i \u003c= n; i++)\r\n\t\tmaxi = max(maxi, dp[i][i + n]); //这道题不要减1,因为头尾标记共用\r\n\tcout \u003c\u003c maxi;\r\n\treturn 0;\r\n}\r\n```\r\n\r\n## 洛谷P4342\r\n\r\n[P4342 [IOI 1998] Polygon](https://www.luogu.com.cn/problem/P4342)\r\n\r\n这道题不仅需要计算最大值，因为有乘法操作，所以需要维护最小值。\r\n\r\n$dp_{i,j,0/1}$ 表示计算区间 $[i,j]$ 的最小值/最大值。\r\n\r\n\r\n\r\n```cpp\r\n#include\u003cbits/stdc++.h>\r\ntypedef int int32;\r\n#define int long long\r\nusing namespace std;\r\nconst int N = 100 + 5;\r\nint n, a[N], dp[N][N][2], ans = INT_MIN;\r\nchar c[N];\r\nint work(int x, int y, char c)\r\n{\r\n\tif (c == 't')\r\n\t\treturn x + y;\r\n\treturn x * y;\r\n}\r\nint help(int x, int y, bool f)\r\n{\r\n\tif (!f)\r\n\t\treturn min(x, y);\r\n\treturn max(x, y);\r\n}\r\nsigned main()\r\n{\r\n\tios::sync_with_stdio(0);\r\n\tcin.tie(0), cout.tie(0);\r\n\tcin >> n;\r\n\tfor (int i = 1; i \u003c= n; i++)\r\n\t{\r\n\t\tcin >> c[i] >> a[i];\r\n\t\tc[n + i] = c[i];\r\n\t\ta[n + i] = a[i];\r\n\t\tdp[i][i][0] = dp[i][i][1] = dp[n + i][n + i][0] = dp[n + i][n + i][1] = a[i];\r\n\t}\r\n\tc[2 * n + 1] = c[1];\r\n\tfor (int len = 2; len \u003c= n; len++)\r\n\t\tfor (int i = 1; i + len - 1 \u003c= 2 * n; i++)\r\n\t\t{\r\n\t\t\tint j = i + len - 1;\r\n\t\t\tdp[i][j][0] = INT_MAX; //最小值和最大值初始状态不要赋错\r\n\t\t\tdp[i][j][1] = INT_MIN;\r\n\t\t\tfor (int k = i; k \u003c j; k++)\r\n\t\t\t\tfor (int l = 0; l \u003c 8; l++)\r\n\t\t\t\t\tdp[i][j][l & 1] = help(dp[i][j][l & 1],\r\n\t\t\t\t\t\twork(dp[i][k][(l & 2) >> 1], dp[k + 1][j][(l & 4) >> 2],\r\n\t\t\t\t\t\t\tc[k + 1]), l & 1);\r\n\t\t}\r\n\tfor (int i = 1; i \u003c= n; i++)\r\n\t\tans = max(ans, dp[i][n + i - 1][1]);\r\n\tcout \u003c\u003c ans \u003c\u003c '\\n';\r\n\tfor (int i = 1; i \u003c= n; i++)\r\n\t\tif (dp[i][n + i - 1][1] == ans)\r\n\t\t\tcout \u003c\u003c i \u003c\u003c ' ';\r\n\treturn 0;\r\n}\r\n```\r\n\r\n## 洛谷P6064\r\n\r\n[P6064 [USACO05JAN] Naptime G](https://www.luogu.com.cn/problem/P6064)\r\n\r\n我们发现第 $1$ 时间端依赖前一天的最后的时间段，所以这道题需要分情况讨论前一天的最后的时间段是否睡觉，且不是区间dp。\r\n\r\n$dp_{i,j,0/1}$ 表示枚举到第 $i$ 端时间，睡了 $j$ 小时，第 $i$ 小时是否睡觉的最大效用值。\r\n\r\n```cpp\r\n#include\u003cbits/stdc++.h>\r\ntypedef int int32;\r\n// #define int long long\r\nusing namespace std;\r\nconst int N = 3830 + 5;\r\nint n, m, a[N], dp[N][N][2];\r\nint work(bool f)\r\n{\r\n\tmemset(dp, 0xcf, sizeof dp);\r\n\tdp[1][0][0] = 0;\r\n\tdp[1][1][1] = f * a[1];\r\n\tfor (int i = 2; i \u003c= n; i++)\r\n\t\tfor (int j = 0; j \u003c= m; j++)\r\n\t\t{\r\n\t\t\tdp[i][j][0] = max({ dp[i][j][0],dp[i - 1][j][0],dp[i - 1][j][1] });\r\n\t\t\tif (j)\r\n\t\t\t\tdp[i][j][1] = max({ dp[i][j][1],dp[i - 1][j - 1][0],\r\n\t\t\t\t\tdp[i - 1][j - 1][1] + a[i] });\r\n\t\t}\r\n\treturn dp[n][m][f];\r\n}\r\nsigned main()\r\n{\r\n\tios::sync_with_stdio(0);\r\n\tcin.tie(0), cout.tie(0);\r\n\tcin >> n >> m;\r\n\tfor (int i = 1; i \u003c= n; i++)\r\n\t\tcin >> a[i];\r\n\tcout \u003c\u003c max(work(false), work(true));\r\n\treturn 0;\r\n}\r\n```","html":"\u003ch1 id=\"%E5%8C%BA%E9%97%B4dp%EF%BC%88%E4%B8%89%EF%BC%89\" tabindex=\"-1\">区间 dp（三） \u003ca href=\"#%E5%8C%BA%E9%97%B4dp%EF%BC%88%E4%B8%89%EF%BC%89\" class=\"header-anchor\">¶\u003c/a>\u003c/h1>\n\u003ch2 id=\"%E6%B4%9B%E8%B0%B7p1880\" tabindex=\"-1\">洛谷 P1880 \u003ca href=\"#%E6%B4%9B%E8%B0%B7p1880\" class=\"header-anchor\">¶\u003c/a>\u003c/h2>\n\u003cp>\u003ca href=\"https://www.luogu.com.cn/problem/P1880\">P1880 [NOI1995] 石子合并 - 洛谷\u003c/a>\u003c/p>\n\u003cp>石子在圆形操场的四周摆放，直接当没有环形区间 dp 显然会少答案。那么我们一定要这么做怎么办？少了的话可以加回来，斩环为链，数组多一倍，再区间 dp。\u003c/p>\n\u003cp>\u003cspan tabindex=\"0\" role=\"text\" aria-label=\"d, p, start subscript, 0, slash, 1, comma, i, comma, j, end subscript\">\u003cspan class=\"katex\">\u003cspan class=\"katex-mathml\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\">\u003csemantics>\u003cmrow>\u003cmi>d\u003c/mi>\u003cmsub>\u003cmi>p\u003c/mi>\u003cmrow>\u003cmn>0\u003c/mn>\u003cmi mathvariant=\"normal\">/\u003c/mi>\u003cmn>1\u003c/mn>\u003cmo separator=\"true\">,\u003c/mo>\u003cmi>i\u003c/mi>\u003cmo separator=\"true\">,\u003c/mo>\u003cmi>j\u003c/mi>\u003c/mrow>\u003c/msub>\u003c/mrow>\u003cannotation encoding=\"application/x-tex\">dp_{0/1,i,j}\u003c/annotation>\u003c/semantics>\u003c/math>\u003c/span>\u003cspan class=\"katex-html\" aria-hidden=\"true\">\u003cspan class=\"base\">\u003cspan class=\"strut\" style=\"height:1.0496em;vertical-align:-0.3552em;\">\u003c/span>\u003cspan class=\"mord mathnormal\">d\u003c/span>\u003cspan class=\"mord\">\u003cspan class=\"mord mathnormal\">p\u003c/span>\u003cspan class=\"msupsub\">\u003cspan class=\"vlist-t vlist-t2\">\u003cspan class=\"vlist-r\">\u003cspan class=\"vlist\" style=\"height:0.3448em;\">\u003cspan style=\"top:-2.5198em;margin-left:0em;margin-right:0.05em;\">\u003cspan class=\"pstrut\" style=\"height:2.7em;\">\u003c/span>\u003cspan class=\"sizing reset-size6 size3 mtight\">\u003cspan class=\"mord mtight\">\u003cspan class=\"mord mtight\">0/1\u003c/span>\u
