	<script type="application/json" id="post-data">{"id":"赛前训练2-连通性系列问题——总结","metadata":{"id":"赛前训练2-连通性系列问题——总结","title":"赛前训练 2 - 连通性系列问题 —— 总结","date":"2025-09-19","tags":["总结","连通性问题"],"summary":"洛谷 P2656 https://www.luogu.com.cn/problem/P2656 ..."},"markdown":"# 赛前训练2-连通性系列问题——总结\r\n\r\n## A\r\n\r\n[洛谷P2656](https://www.luogu.com.cn/problem/P2656)\r\n\r\n### 错误原因\r\n\r\n`double` 的精度不够，应开 `long double`。\r\n\r\n### 正解\r\n\r\n1. 条边只有在环上时，才可能多次经过，且一定会经过足够次直到边权为 $0$；\r\n2. 输入时维护 `x[i]`,`y[i]`,`w[i]`,`kw[i]` 其中 `kw[i]` 表示第i涤边迭代经过的总边权和；\r\n3. 缩点建新DAG图，跑最长路。\r\n\r\n\u003c!--more-->\r\n\r\n```cpp\r\n#include\u003cbits/stdc++.h>\r\ntypedef int int32;\r\n#define int long long\r\n#define double long double\r\nusing namespace std;\r\nconst int N = 8e4 + 5;\r\nint n, m, s, dfn[N], low[N], scc[N], sum[N], num, cnt, ans;\r\nvector\u003cint>st;\r\nbool vis[N];\r\nstruct node {\r\n\tint nxt, w, w1;\r\n};\r\nvector\u003cnode>nbr[N], new_nbr[N];\r\nint work(int x, double y)\r\n{\r\n\tint sum = 0;\r\n\twhile (x)\r\n\t\tsum += x, x *= y;\r\n\treturn sum;\r\n}\r\nvoid tarjan(int x)\r\n{\r\n\tdfn[x] = low[x] = ++num, vis[x] = true;\r\n\tst.push_back(x);\r\n\tfor (auto& y : nbr[x])\r\n\t{\r\n\t\tauto& nxt = y.nxt, & w = y.w, & w1 = y.w1;\r\n\t\tif (!dfn[nxt])\r\n\t\t{\r\n\t\t\ttarjan(nxt);\r\n\t\t\tlow[x] = min(low[x], low[nxt]);\r\n\t\t}\r\n\t\telse if (vis[nxt])\r\n\t\t\tlow[x] = min(low[x], dfn[nxt]);\r\n\t}\r\n\tif (dfn[x] == low[x])\r\n\t{\r\n\t\tcnt++;\r\n\t\twhile (st.back() != x)\r\n\t\t{\r\n\t\t\tint tmp = st.back();\r\n\t\t\tst.pop_back();\r\n\t\t\tvis[tmp] = false;\r\n\t\t\tscc[tmp] = cnt;\r\n\t\t}\r\n\t\tst.pop_back();\r\n\t\tvis[x] = false;\r\n\t\tscc[x] = cnt;\r\n\t}\r\n\treturn;\r\n}\r\nvoid dfs(int x, int sum)\r\n{\r\n\tans = max(ans, sum += ::sum[x]);\r\n\tfor (auto& y : new_nbr[x])\r\n\t{\r\n\t\tauto& nxt = y.nxt, & w = y.w, & w1 = y.w1;\r\n\t\tdfs(nxt, sum + w);\r\n\t}\r\n\treturn;\r\n}\r\nsigned main()\r\n{\r\n\tios::sync_with_stdio(0);\r\n\tcin.tie(0), cout.tie(0);\r\n\tcin >> n >> m;\r\n\tfor (int i = 1; i \u003c= m; i++)\r\n\t{\r\n\t\tint x, y, z;\r\n\t\tdouble u;\r\n\t\tcin >> x >> y >> z >> u;\r\n\t\tnbr[x].push_back({ y,z,work(z, u) });\r\n\t}\r\n\tcin >> s;\r\n\tfor (int i = 1; i \u003c= n; i++)\r\n\t\tif (!dfn[i])\r\n\t\t\ttarjan(i);\r\n\tfor (int i = 1; i \u003c= n; i++)\r\n\t\tfor (auto& y : nbr[i])\r\n\t\t{\r\n\t\t\tauto& nxt = y.nxt, & w = y.w, & w1 = y.w1;\r\n\t\t\tif (scc[i] != scc[nxt])\r\n\t\t\t\tnew_nbr[scc[i]].push_back({ scc[nxt],w,w1 });\r\n\t\t\telse\r\n\t\t\t\tsum[scc[i]] += w1;\r\n\t\t}\r\n\tdfs(scc[s], 0);\r\n\tcout \u003c\u003c ans;\r\n\treturn 0;\r\n}\r\n```\r\n\r\n## B\r\n\r\n[CF1000E](https://codeforces.com/problemset/problem/1000/E)\r\n\r\n### 思路\r\n\r\n- 跑求割边的 tarjan，再把每一个边双连通分量缩成一个点，最后求树的直径。\r\n\r\n```cpp\r\n#include\u003cbits/stdc++.h>\r\ntypedef int int32;\r\n#define int long long\r\nusing namespace std;\r\nconst int N = 3e5 + 5;\r\nint n, m, root, num, dfn[N], low[N], dcc[N], cnt, dis;\r\nvector\u003cpair\u003cint,int>>nbr[N], new_nbr[N];\r\nbool cut[N];\r\nvoid tarjan(int x, int edge)\r\n{\r\n\tdfn[x] = low[x] = ++num;\r\n\tfor (auto& y : nbr[x])\r\n\t{\r\n\t\tauto& nxt = y.first, & w = y.second;\r\n\t\tif (!dfn[nxt])\r\n\t\t{\r\n\t\t\ttarjan(nxt, w);\r\n\t\t\tlow[x] = min(low[x], low[nxt]);\r\n\t\t\tcut[w] |= low[nxt] > dfn[x];\r\n\t\t}\r\n\t\telse if (w != edge)\r\n\t\t\tlow[x] = min(low[x], dfn[nxt]);\r\n\t}\r\n\treturn;\r\n}\r\nvoid dfs(int x)\r\n{\r\n\tdcc[x] = cnt;\r\n\tfor (auto& y : nbr[x])\r\n\t{\r\n\t\tauto& nxt = y.first, w = y.second;\r\n\t\tif (!cut[w] && !dcc[nxt])\r\n\t\t\tdfs(nxt);\r\n\t} \r\n\treturn;\r\n}\r\nvoid dfs1(int x, int fa, int& to, int sum = 0)\r\n{\r\n\tif (sum >= dis)\r\n\t{\r\n\t\tto = x;\r\n\t\tdis = sum;\r\n\t}\r\n\tfor (auto& y : new_nbr[x])\r\n\t{\r\n\t\tauto& nxt = y.first, w = y.second;\r\n\t\tif (nxt != fa)\r\n\t\t\tdfs1(nxt, x, to, sum + 1);\r\n\t} \r\n\treturn;\r\n}\r\nsigned main()\r\n{\r\n\tios::sync_with_stdio(0);\r\n\tcin.tie(0), cout.tie(0);\r\n\tcin >> n >> m;\r\n\tfor (int i = 1; i \u003c= m; i++)\r\n\t{\r\n\t\tint x, y;\r\n\t\tcin >> x >> y;\r\n\t\tnbr[x].push_back({ y,i });\r\n\t\tnbr[y].push_back({ x,i });\r\n\t}\r\n\tfor (int i = 1; i \u003c= n; i++)\r\n\t\tif (!dfn[i])\r\n\t\t\troot = i, tarjan(i, 0);\r\n\tfor (int i = 1; i \u003c= n; i++)\r\n\t\tif (!dcc[i])\r\n\t\t\tcnt++, dfs(i);\r\n\tfor (int i = 1; i \u003c= n; i++)\r\n\t\tfor (auto& y : nbr[i])\r\n\t\t{\r\n\t\t\tauto& nxt = y.first, w = y.second;\r\n\t\t\tif (dcc[i] != dcc[nxt])\r\n\t\t\t\tnew_nbr[dcc[i]].push_back({ dcc[nxt],w });\r\n\t\t}\r\n\tint x = 0, y = 0;\r\n\tdfs1(1, 0, x);\r\n\tdis = 0;\r\n\tdfs1(x, 0, y);\r\n\tcout \u003c\u003c dis;\r\n\treturn 0;\r\n}\r\n```\r\n\r\n## C\r\n\r\n[CF1763E](https://codeforces.com/problemset/problem/1763/E)\r\n\r\n### 错误原因\r\n\r\ndp的状态转移方程写错了。\r\n\r\n### 正解\r\n\r\n1. 有向图的点对只有三种关系：单向对、双向对、不连通；\r\n2. p可达图就是要构造恰好 $p$ 组点对是强连通的有向图；\r\n3. 给定 $i$ 个点，强连通的点对数介于 $\\left[0,\\frac{i(i-1)}{2}\\right]$；\r\n4. 要追求恰好 $p$ 组强连通点对，那么构造的图应该是若干 scc 的图；\r\n5. 把 scc 看作物品，把 $\\frac{ {size} ({size}-1) } {2}$ 看作重量，把点数 ${size}$ 看作价值，问题转化为放满容量为 $p$ 的背包的最小价值。\r\n\r\n```cpp\r\n#include\u003cbits/stdc++.h>\r\ntypedef int int32;\r\n#define int long long\r\nusing namespace std;\r\nconst int N = 2e5 + 5;\r\nint n, dp[N];\r\nsigned main()\r\n{\r\n\tios::sync_with_stdio(0);\r\n\tcin.tie(0), cout.tie(0);\r\n\tdp[1] = 2;\r\n\tcin >> n;\r\n\tfor (int i = 2; i \u003c= n; i++)\t\r\n\t{\r\n\t\tdp[i] = INT_MAX;\r\n\t\tfor (int j = 2; ; j++)\r\n\t\t\tif (j * (j - 1) / 2 \u003c= i)\r\n\t\t\t\tdp[i] = min(dp[i], j + dp[i - j * (j - 1) / 2]);\r\n\t\t\telse\r\n\t\t\t\tbreak;\r\n\t}\r\n\tcout \u003c\u003c dp[n] \u003c\u003c ' ' \u003c\u003c dp[n] * (dp[n] - 1) / 2 - n;\r\n\treturn 0;\r\n}\r\n```\r\n\r\n## D\r\n[CF1761E](https://codeforces.com/problemset/problem/1761/E)\r\n\r\n### 错误原因\r\n\r\n写了假解。\r\n\r\n### 正解\r\n\r\n1. 选择点 $x$ 操作时，尽可能不要让 $×$ 从原本的连通块分离；\r\n2. 当 $x$ 和所在连通块的每个都连了边时，$x$才会分离；\r\n3. 只要是存在非完全图，那么就一定可以选出点 $x$，使得至多操作 $1$ 次完成任务；\r\n4. 而后分类讨论：\r\n    - 本来连通：$0$ 次；\r\n    - 不连通\r\n        - 只有完全图\r\n            - $2$ 个完全图，每个操作等价于每次移动 $1$ 个点到另一个完全图：$\\min({size}_1,{size}_2)$；\r\n            - $>2$ 个完全图：$2$ 次\r\n        - 存在非完全图：$1$ 次。\r\n\r\n\r\n```cpp\r\n#include\u003cbits/stdc++.h>\r\ntypedef int int32;\r\n#define int long long\r\nusing namespace std;\r\nconst int N = 4e3 + 5;\r\nint t, n, in[N], fa[N], size[N], sum[N], cnt, tot;\r\nchar c[N][N];\r\nvector\u003cint>ans;\r\nint find(int x)\r\n{\r\n\treturn x == fa[x] ? x : fa[x] = find(fa[x]);\r\n}\r\nvoid unionn(int x, int y)\r\n{\r\n\tx = find(x);\r\n\ty = find(y);\r\n\tif (x != y)\r\n\t{\r\n\t\tfa[x] = y;\r\n\t\t::size[y] += ::size[x];\r\n\t}\r\n\treturn;\r\n}\r\nsigned main()\r\n{\r\n\tios::sync_with_stdio(0);\r\n\tcin.tie(0), cout.tie(0);\r\n\tcin >> t;\r\n\twhile (t--)\r\n\t{\r\n\t\tcin >> n;\r\n\t\tans.clear();\r\n\t\tcnt = tot = 0;\r\n\t\tfor (int i = 1; i \u003c= n; i++)\r\n\t\t\tfa[i] = i, ::size[i] = 1, sum[i] = 0;\r\n\t\tfor (int i = 1; i \u003c= n; i++)\r\n\t\t{\r\n\t\t\tin[i] = 0;\r\n\t\t\tfor (int j = 1; j \u003c= n; j++)\r\n\t\t\t{\r\n\t\t\t\tcin >> c[i][j];\r\n\t\t\t\tif (c[i][j] - '0')\r\n\t\t\t\t{\r\n\t\t\t\t\tin[i]++;\r\n\t\t\t\t\tunionn(i, j);\r\n\t\t\t\t}\r\n\t\t\t}\r\n\t\t}\r\n\t\tfor (int i = 1; i \u003c= n; i++)\r\n\t\t\tif (in[i] == ::size[find(i)] - 1)\r\n\t\t\t\tsum[find(i)]++;\r\n\t\tfor (int i = 1; i \u003c= n; i++)\r\n\t\t\tif (fa[i] == i)\r\n\t\t\t\tif (sum[i] == ::size[i] && ::size[i] > 1)\r\n\t\t\t\t\tcnt++;\r\n\t\t\t\telse\r\n\t\t\t\t\ttot++;\r\n\t\tif (cnt + tot == 1)\r\n\t\t{\r\n\t\t\tcout \u003c\u003c \"0\\n\";\r\n\t\t\tcontinue;\r\n\t\t}\r\n\t\tif (tot)\r\n\t\t{\r\n\t\t\tint pos = 0;\r\n\t\t\tfor (int i = 1; i \u003c= n; i++)\r\n\t\t\t\tif (in[i] \u003c ::size[find(i)] - 1 || !in[i])\r\n\t\t\t\t\tif (n - in[i] > n - in[pos] || !pos)\r\n\t\t\t\t\t\tpos = i;\r\n\t\t\tans.push_back(pos);\r\n\t\t}\r\n\t\telse if (cnt == 2)\r\n\t\t{\r\n\t\t\tint pos = 1;\r\n\t\t\tfor (int i = 2; i \u003c= n; i++)\r\n\t\t\t\tif (sum[find(i)] \u003c sum[find(pos)])\r\n\t\t\t\t\tpos = find(i);\r\n\t\t\tfor (int i = 1; i \u003c= n; i++)\r\n\t\t\t\tif (find(pos) == find(i))\r\n\t\t\t\t\tans.push_back(i);\r\n\t\t}\r\n\t\telse\r\n\t\t{\r\n\t\t\tint pos = 1;\r\n\t\t\tans.push_back(1);\r\n\t\t\tfor (int i = 1; i \u003c= n; i++)\r\n\t\t\t\tif (find(i) != find(pos))\r\n\t\t\t\t{\r\n\t\t\t\t\tans.push_back(i);\r\n\t\t\t\t\tbreak;\r\n\t\t\t\t}\r\n\t\t}\r\n\t\tcout \u003c\u003c ans.size() \u003c\u003c '\\n';\r\n\t\tfor (auto& x : ans)\r\n\t\t\tcout \u003c\u003c x \u003c\u003c ' ';\r\n\t\tcout \u003c\u003c '\\n';\r\n\t}\r\n\treturn 0;\r\n}\r\n```","html":"\u003ch1 id=\"%E8%B5%9B%E5%89%8D%E8%AE%AD%E7%BB%832-%E8%BF%9E%E9%80%9A%E6%80%A7%E7%B3%BB%E5%88%97%E9%97%AE%E9%A2%98%E2%80%94%E2%80%94%E6%80%BB%E7%BB%93\" tabindex=\"-1\">赛前训练 2 - 连通性系列问题 —— 总结 \u003ca href=\"#%E8%B5%9B%E5%89%8D%E8%AE%AD%E7%BB%832-%E8%BF%9E%E9%80%9A%E6%80%A7%E7%B3%BB%E5%88%97%E9%97%AE%E9%A2%98%E2%80%94%E2%80%94%E6%80%BB%E7%BB%93\" class=\"header-anchor\">¶\u003c/a>\u003c/h1>\n\u003ch2 id=\"a\" tabindex=\"-1\">A \u003ca href=\"#a\" class=\"header-anchor\">¶\u003c/a>\u003c/h2>\n\u003cp>\u003ca href=\"https://www.luogu.com.cn/problem/P2656\">洛谷 P2656\u003c/a>\u003c/p>\n\u003ch3 id=\"%E9%94%99%E8%AF%AF%E5%8E%9F%E5%9B%A0\" tabindex=\"-1\">错误原因 \u003ca href=\"#%E9%94%99%E8%AF%AF%E5%8E%9F%E5%9B%A0\" class=\"header-anchor\">¶\u003c/a>\u003c/h3>\n\u003cp>\u003ccode>double\u003c/code> 的精度不够，应开 \u003ccode>long double\u003c/code>。\u003c/p>\n\u003ch3 id=\"%E6%AD%A3%E8%A7%A3\" tabindex=\"-1\">正解 \u003ca href=\"#%E6%AD%A3%E8%A7%A3\" class=\"header-anchor\">¶\u003c/a>\u003c/h3>\n\u003col>\n\u003cli>条边只有在环上时，才可能多次经过，且一定会经过足够次直到边权为 \u003cspan tabindex=\"0\" role=\"text\" aria-label=\"0\">\u003cspan class=\"katex\">\u003cspan class=\"katex-mathml\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\">\u003csemantics>\u003cmrow>\u003cmn>0\u003c/mn>\u003c/mrow>\u003cannotation encoding=\"application/x-tex\">0\u003c/annotation>\u003c/semantics>\u003c/math>\u003c/span>\u003cspan class=\"katex-html\" aria-hidden=\"true\">\u003cspan class=\"base\">\u003cspan class=\"strut\" style=\"height:0.6444em;\">\u003c/span>\u003cspan class=\"mord\">0\u003c/span>\u003c/span>\u003c/span>\u003c/span>\u003c/span>；\u003c/li>\n\u003cli>输入时维护 \u003ccode>x[i]\u003c/code>,\u003ccode>y[i]\u003c/code>,\u003ccode>w[i]\u003c/code>,\u003ccode>kw[i]\u003c/code> 其中 \u003ccode>kw[i]\u003c/code> 表示第 i 涤边迭代经过的总边权和；\u003c/li>\n\u003cli>缩点建新 DAG 图，跑最长路。\u003c/li>\n\u003c/ol>\n\u003c!--more-->\n\u003cpre class=\"shiki shiki-themes light-plus dark-plus\" style=\"background-color:#FFFFFF;--shiki-dark-bg:#1E1E1E;color:#000000;--shiki-dark:#D4D4D4\" tabindex=\"0\">\u003ccode class=\"language-cpp\" code-language=\"cpp\">\u003cspan class=\"line\">\u003cspan style=\"color:#AF00DB;--shiki-dark:#C586C0\">#include\u003c/span>\u003cspan style=\"color:#A31515;--shiki-dark:#CE9178\">&lt;bits/stdc++.h&gt;\u003c/span>\u003c/span>\u003cspan class=\"line\">\u003cspan style=\"color:#0000FF;--shiki-dark:#569CD6\">typedef\u003c/span>\u003cspan style=\"color:#0000FF;--shiki-dark:#569CD6\"> int\u003c/span>\u003cspan style=\"color:#000000;--shiki-dark:#D4D4D4\"> int32;\u003c/span>\u003c/span>\u003cspan class=\"line\">\u003cspan style=\"color:#AF00DB;--shiki-dark:#C586C0\">#define\u003c/span>\u003cspan style=\"color:#0000FF;--shiki-dark:#569CD6\"> int long long\u003c/span>\u003c/span>\u003cspan class=\"line\">\u003cspan style=\"color:#AF00DB;--shiki-dark:#C586C0\">#define\u003c/span>\u003cspan style=\"color:#0000FF;--shiki-dark:#569CD6\"> double long double\u003c/span>\u003c/span>\u003cspan class=\"line\">\u003cspan style=\"color:#AF00DB;--shiki-dark:#C586C0\">using\u003c/span>\u003cspan style=\"color:#0000FF;--shiki-dark:#569CD6\"> namespace\u003c/span>\u003cspan style=\"color:#267F99;--shiki-dark:#4EC9B0\"> std\u003c/span>\u003cspan style=\"color:#000000;--shiki-dark:#D4D4D4\">;\u003c/span>\u003c/span>\u003cspan class=\"line\">\u003cspan style=\"color:#0000FF;--shiki-dark:#569CD6\">const\u
