	<script type="application/json" id="post-data">{"id":"网络流之最小割问题","metadata":{"id":"网络流之最小割问题","title":"网络流之最小割问题","date":"2025-09-17","tags":["网络流","最小割问题"],"summary":"对于给定的网络流模型，其最小割是指删除边权和最小的边集，使得 $s$ 到 $t$ 不连通。 \n最小割等于最大流，因为增广路的流量限制是由这些权值的边，方案不一定唯一..."},"markdown":"# 最小割问题\r\n对于给定的网络流模型，其最小割是指删除边权和最小的边集，使得 $s$ 到 $t$ 不连通。\r\n\r\n最小割等于最大流，因为增广路的流量限制是由这些权值的边，方案不一定唯一。\r\n\r\n\u003c!--more-->\r\n\r\n## 例题\r\n### 洛谷P2774\r\n[P2774 方格取数问题](https://www.luogu.com.cn/problem/P2774)\r\n```cpp\r\n#include\u003cbits/stdc++.h>\r\ntypedef int int32;\r\n#define int long long\r\nusing namespace std;\r\nconst int N = 1e5 + 5;\r\nint n, m, s, t, edge[N], level[N], tmp[N], cnt, sum, ans, dx[] = { 0,0,1,-1 },\r\ndy[] = { 1,-1,0,0 };\r\nvector\u003cpair\u003cint, int>>nbr[N];\r\nbool bfs()\r\n{\r\n\tmemset(level, 0, sizeof level);\r\n\tqueue\u003cint>q;\r\n\tq.push(s);\r\n\tlevel[s] = 1;\r\n\twhile (!q.empty())\r\n\t{\r\n\t\tint x = q.front();\r\n\t\tq.pop();\r\n\t\ttmp[x] = 0;\r\n\t\tfor (auto& nxt : nbr[x])\r\n\t\t\tif (edge[nxt.second] && !level[nxt.first])\r\n\t\t\t{\r\n\t\t\t\tlevel[nxt.first] = level[x] + 1;\r\n\t\t\t\tq.push(nxt.first);\r\n\t\t\t\tif (nxt.first == t)\r\n\t\t\t\t\treturn true;\r\n\t\t\t}\r\n\t}\r\n\treturn false;\r\n}\r\nint dinic(int x, int flow)\r\n{\r\n\tif (x == t)\r\n\t\treturn flow;\r\n\tint rest = flow;\r\n\tfor (int i = tmp[x]; i \u003c nbr[x].size(); i++)\r\n\t{\r\n\t\ttmp[x]++;\r\n\t\tauto& nxt = nbr[x][i];\r\n\t\tif (edge[nxt.second] && level[nxt.first] == level[x] + 1)\r\n\t\t{\r\n\t\t\tint inc = dinic(nxt.first, min(rest, edge[nxt.second]));\r\n\t\t\tedge[nxt.second] -= inc;\r\n\t\t\tedge[nxt.second ^ 1] += inc;\r\n\t\t\trest -= inc;\r\n\t\t}\r\n\t\tif (!rest)\r\n\t\t\tbreak;\r\n\t}\r\n\tif (!(flow - rest))\r\n\t\tlevel[x] = 0;\r\n\treturn flow - rest;\r\n}\r\nsigned main()\r\n{\r\n\tios::sync_with_stdio(0);\r\n\tcin.tie(0), cout.tie(0);\r\n\tcin >> n >> m;\r\n\ts = cnt = 1, t = 2;\r\n\tfor (int i = 1; i \u003c= n; i++)\r\n\t\tfor (int j = 1; j \u003c= m; j++)\r\n\t\t{\r\n\t\t\tint z;\r\n\t\t\tcin >> z;\r\n\t\t\tsum += z;\r\n\t\t\tif ((i + j) & 1)\r\n\t\t\t{\r\n\t\t\t\tint x = s, y = (i - 1) * m + j + 2;\r\n\t\t\t\tedge[++cnt] = z;\r\n\t\t\t\tnbr[x].push_back({ y,cnt });\r\n\t\t\t\tnbr[y].push_back({ x,++cnt });\r\n\t\t\t}\r\n\t\t\telse\r\n\t\t\t{\r\n\t\t\t\tint x = (i - 1) * m + j + 2, y = t;\r\n\t\t\t\tedge[++cnt] = z;\r\n\t\t\t\tnbr[x].push_back({ y,cnt });\r\n\t\t\t\tnbr[y].push_back({ x,++cnt });\r\n\t\t\t}\r\n\t\t}\r\n\tfor (int i = 1; i \u003c= n; i++)\r\n\t\tfor (int j = 1; j \u003c= m; j++)\r\n\t\t\tif ((i + j) & 1)\r\n\t\t\t\tfor (int k = 0; k \u003c 4; k++)\r\n\t\t\t\t{\r\n\t\t\t\t\tint nx = i + dx[k], ny = j + dy[k];\r\n\t\t\t\t\tif (nx > 0 && ny > 0 && nx \u003c= n && ny \u003c= m)\r\n\t\t\t\t\t{\r\n\t\t\t\t\t\tint x = (i - 1) * m + j + 2, y = (nx - 1) * m + ny + 2, z = INT_MAX;\r\n\t\t\t\t\t\tedge[++cnt] = z;\r\n\t\t\t\t\t\tnbr[x].push_back({ y,cnt });\r\n\t\t\t\t\t\tnbr[y].push_back({ x,++cnt });\r\n\t\t\t\t\t}\r\n\t\t\t\t}\r\n\twhile (bfs())\r\n\t\tans += dinic(s, INT_MAX);\r\n\tcout \u003c\u003c sum - ans;\r\n\treturn 0;\r\n}\r\n```","html":"\u003ch1 id=\"%E6%9C%80%E5%B0%8F%E5%89%B2%E9%97%AE%E9%A2%98\" tabindex=\"-1\">最小割问题 \u003ca href=\"#%E6%9C%80%E5%B0%8F%E5%89%B2%E9%97%AE%E9%A2%98\" class=\"header-anchor\">¶\u003c/a>\u003c/h1>\n\u003cp>对于给定的网络流模型，其最小割是指删除边权和最小的边集，使得 \u003cspan tabindex=\"0\" role=\"text\" aria-label=\"s\">\u003cspan class=\"katex\">\u003cspan class=\"katex-mathml\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\">\u003csemantics>\u003cmrow>\u003cmi>s\u003c/mi>\u003c/mrow>\u003cannotation encoding=\"application/x-tex\">s\u003c/annotation>\u003c/semantics>\u003c/math>\u003c/span>\u003cspan class=\"katex-html\" aria-hidden=\"true\">\u003cspan class=\"base\">\u003cspan class=\"strut\" style=\"height:0.4306em;\">\u003c/span>\u003cspan class=\"mord mathnormal\">s\u003c/span>\u003c/span>\u003c/span>\u003c/span>\u003c/span> 到 \u003cspan tabindex=\"0\" role=\"text\" aria-label=\"t\">\u003cspan class=\"katex\">\u003cspan class=\"katex-mathml\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\">\u003csemantics>\u003cmrow>\u003cmi>t\u003c/mi>\u003c/mrow>\u003cannotation encoding=\"application/x-tex\">t\u003c/annotation>\u003c/semantics>\u003c/math>\u003c/span>\u003cspan class=\"katex-html\" aria-hidden=\"true\">\u003cspan class=\"base\">\u003cspan class=\"strut\" style=\"height:0.6151em;\">\u003c/span>\u003cspan class=\"mord mathnormal\">t\u003c/span>\u003c/span>\u003c/span>\u003c/span>\u003c/span> 不连通。\u003c/p>\n\u003cp>最小割等于最大流，因为增广路的流量限制是由这些权值的边，方案不一定唯一。\u003c/p>\n\u003c!--more-->\n\u003ch2 id=\"%E4%BE%8B%E9%A2%98\" tabindex=\"-1\">例题 \u003ca href=\"#%E4%BE%8B%E9%A2%98\" class=\"header-anchor\">¶\u003c/a>\u003c/h2>\n\u003ch3 id=\"%E6%B4%9B%E8%B0%B7p2774\" tabindex=\"-1\">洛谷 P2774 \u003ca href=\"#%E6%B4%9B%E8%B0%B7p2774\" class=\"header-anchor\">¶\u003c/a>\u003c/h3>\n\u003cp>\u003ca href=\"https://www.luogu.com.cn/problem/P2774\">P2774 方格取数问题\u003c/a>\u003c/p>\n\u003cpre class=\"shiki shiki-themes light-plus dark-plus\" style=\"background-color:#FFFFFF;--shiki-dark-bg:#1E1E1E;color:#000000;--shiki-dark:#D4D4D4\" tabindex=\"0\">\u003ccode class=\"language-cpp\" code-language=\"cpp\">\u003cspan class=\"line\">\u003cspan style=\"color:#AF00DB;--shiki-dark:#C586C0\">#include\u003c/span>\u003cspan style=\"color:#A31515;--shiki-dark:#CE9178\">&lt;bits/stdc++.h&gt;\u003c/span>\u003c/span>\u003cspan class=\"line\">\u003cspan style=\"color:#0000FF;--shiki-dark:#569CD6\">typedef\u003c/span>\u003cspan style=\"color:#0000FF;--shiki-dark:#569CD6\"> int\u003c/span>\u003cspan style=\"color:#000000;--shiki-dark:#D4D4D4\"> int32;\u003c/span>\u003c/span>\u003cspan class=\"line\">\u003cspan style=\"color:#AF00DB;--shiki-dark:#C586C0\">#define\u003c/span>\u003cspan style=\"color:#0000FF;--shiki-dark:#569CD6\"> int long long\u003c/span>\u003c/span>\u003cspan class=\"line\">\u003cspan style=\"color:#AF00DB;--shiki-dark:#C586C0\">using\u003c/span>\u003c
