	<script type="application/json" id="post-data">{"id":"树链剖分","metadata":{"id":"树链剖分","title":"树链剖分","date":"2026-03-01","tags":["编程","算法竞赛","树链剖分","长链剖分"],"summary":"树链剖分是一种将一棵树划分为若干条链的思想，划分后每个树上结点恰好在一条链中。"},"markdown":"# 树链剖分\r\n是一种将一棵树划分为若干条链的思想，划分后每个树上结点恰好在一条链中。\r\n\r\n而一条链又可以转化为一段连续的区间，从而将树上问题转换为序列问题。\r\n\r\n## 树链剖分的常见方式\r\n- 重链剖分\r\n- 长链剖分\r\n- 实链剖分\r\n\r\n以重链剖分最常用。\r\n\r\n## 重链剖分的步骤\r\n1. dfs 预处理树上每个点的 $\\mathit{size}_x$；以及重儿子 $\\mathit{son}_x$；\r\n2. 将根结点 $\\mathit{root}$ 视为轻儿子，那么每个轻儿子往下走重儿子形成的链唯一；\r\n3. 再次从 $\\mathit{root}$ 开始 dfs，并给每个结点打时间戳 $\\mathit{dfn}$；以及反向映射 $\\mathit{id}$，先递归到重儿子；\r\n4. dfs 过程中维护 $\\mathit{top}_i$ 表示点 $i$ 所在的链的链头结点编号，显然对于任意轻儿子 $x$，$\\mathit{top}_x=x$；重儿子 $\\mathit{top}_x=\\mathit{top}_{\\mathit{fa}_x}$。\r\n\r\n## 重链剖分的性质\r\n1. 确定重儿子后，剖分形式唯一；\r\n2. 任意子树的 $\\mathit{dfn}$ 连续；\r\n3. 任意链的 $\\mathit{dfn}$ 连续；\r\n4. 任意一条路径，最多由 $\\log_2\\mathit{N}$ 条子链拼接而成；\r\n5. 由 $4$ 可以推出，任意点 $x$ 往上切换 $\\log_2\\mathit{N}$ 次链到根结点出发的重链。\r\n\r\n## 例题\r\n\r\n### 洛谷P3379\r\n[P3379 【模板】最近公共祖先（LCA）](https://www.luogu.com.cn/problem/P3379)\r\n\r\n用树链剖分求最近公共祖先的过程：\r\n- 当 $\\mathit{dep}_{\\mathit{top}_x}>\\mathit{dep}_{\\mathit{top}_y}$，$x\\coloneqq \\mathit{fa}_{\\mathit{top}_x}$；\r\n- 当 $\\mathit{dep}_{\\mathit{top}_x}\\le \\mathit{dep}_{\\mathit{top}_y}$，$y\\coloneqq \\mathit{fa}_{\\mathit{top}_y}$；\r\n- 重复上面的步骤直到 $\\mathit{top}_x=\\mathit{top}_y$。\r\n\r\n$$\\text{最近公共祖先} = \r\n\\begin{cases}\r\nx, & \\mathit{dep}_x \u003c \\mathit{dep}_y \\\\\r\ny, & \\text{否则}\r\n\\end{cases}$$\r\n\r\n```cpp\r\n#include\u003cbits/stdc++.h>\r\ntypedef int int32;\r\n#define int long long\r\nusing namespace std;\r\nconst int N = 5e5 + 5;\r\nint n, m, root, size[N], dep[N], fa[N], top[N], son[N], dfn[N], rdfn[N], id[N], cnt;\r\nvector\u003cpair\u003cint,int>>nbr[N];\r\nvoid dfs(int x, int fa)\r\n{\r\n\tint maxi = 0;\r\n\t::size[x] = 1;\r\n\tdep[x] = dep[fa] + 1;\r\n\t::fa[x] = fa;\r\n\tfor (auto& y : nbr[x])\r\n\t{\r\n\t\tauto& nxt = y.first, & w = y.second;\r\n\t\tif (nxt != fa)\r\n\t\t{\r\n\t\t\tdfs(nxt, x);\r\n\t\t\t::size[x] += ::size[nxt];\r\n\t\t\tif (::size[nxt] > maxi)\r\n\t\t\t\tson[x] = nxt, maxi = ::size[nxt];\r\n\t\t}\r\n\t}\r\n\treturn;\r\n}\r\nvoid dfs1(int x, int fa)\r\n{\r\n\tdfn[x] = ++cnt;\r\n\tid[cnt] = x;\r\n\tif (son[x])\r\n\t{\r\n\t\ttop[son[x]] = top[x];\r\n\t\tdfs1(son[x], x);\r\n\t}\r\n\tfor (auto& y : nbr[x])\r\n\t{\r\n\t\tauto& nxt = y.first, & w = y.second;\r\n\t\tif(nxt != fa && !top[nxt])\r\n\t\t{\r\n\t\t\ttop[nxt] = nxt;\r\n\t\t\tdfs1(nxt, x);\r\n\t\t}\r\n\t}\r\n\trdfn[x] = cnt;\r\n\treturn;\r\n}\r\nint lca(int x, int y)\r\n{\r\n\twhile (top[x] != top[y])\r\n\t{\r\n\t\tif (dep[top[x]] > dep[top[y]])\r\n\t\t\tx = fa[top[x]];\r\n\t\telse\r\n\t\t\ty = fa[top[y]];\r\n\t}\r\n\treturn dep[x] \u003c dep[y] ? x : y;\r\n}\r\nsigned main()\r\n{\r\n\tios::sync_with_stdio(0);\r\n\tcin.tie(0), cout.tie(0);\r\n\tcin >> n >> m >> root;\r\n\tfor (int i = 1; i \u003c n; i++)\r\n\t{\r\n\t\tint x, y, z = 1;\r\n\t\tcin >> x >> y;\r\n\t\tnbr[x].push_back({ y,z });\r\n\t\tnbr[y].push_back({ x,z });\r\n\t}\r\n\tdfs(root, 0);\r\n\ttop[root] = root;\r\n\tdfs1(root, 0);\r\n\tfor (int i = 1; i \u003c= m; i++)\r\n\t{\r\n\t\tint x, y;\r\n\t\tcin >> x >> y;\r\n\t\tcout \u003c\u003c lca(x, y) \u003c\u003c '\\n';\r\n\t}\r\n\treturn 0;\r\n}\r\n```\r\n\r\n### 洛谷P3384\r\n[P3384 【模板】重链剖分/树链剖分](https://www.luogu.com.cn/problem/P3384)\r\n\r\n用线段树维护重链剖分后的链的权值。\r\n\r\n```cpp\r\n#include\u003cbits/stdc++.h>\r\ntypedef int int32;\r\n#define int long long\r\nusing namespace std;\r\nconst int N = 5e5 + 5;\r\nint n, m, root, mod, a[N], size[N], dep[N], fa[N], top[N], son[N], dfn[N],\r\nrdfn[N], id[N], tree[N \u003c\u003c 2], tag[N \u003c\u003c 2], cnt;\r\nvector\u003cpair\u003cint,int>>nbr[N];\r\nvoid pushup(int x)\r\n{\r\n\ttree[x] = tree[x \u003c\u003c 1] + tree[x \u003c\u003c 1 | 1];\r\n\treturn;\r\n}\r\nvoid addtag(int x, int l, int r, int val)\r\n{\r\n\ttag[x] += val;\r\n\ttree[x] += (r - l + 1) * val;\r\n\treturn;\r\n}\r\nvoid pushdown(int x, int l, int r)\r\n{\r\n\tif (!tag[x])\r\n\t\treturn;\r\n\tint mid = (l + r) >> 1;\r\n\taddtag(x \u003c\u003c 1, l, mid, tag[x]);\r\n\taddtag(x \u003c\u003c 1 | 1, mid + 1, r, tag[x]);\r\n\ttag[x] = 0;\r\n\treturn;\r\n}\r\nvoid build(int x, int l, int r)\r\n{\r\n\tif (l == r)\r\n\t{\r\n\t\ttree[x] = a[id[l]]; // 不要写成 `tree[x] = a[l]`！\r\n\t\treturn;\r\n\t}\r\n\tint mid = (l + r) >> 1;\r\n\tbuild(x \u003c\u003c 1, l, mid);\r\n\tbuild(x \u003c\u003c 1 | 1, mid + 1, r);\r\n\tpushup(x);\r\n\treturn;\r\n}\r\nvoid update(int x, int l, int r, int qx, int qy, int val)\r\n{\r\n\tif (qy \u003c l || qx > r)\r\n\t\treturn;\r\n\tif (qx \u003c= l && qy >= r)\r\n\t{\r\n\t\taddtag(x, l, r, val);\r\n\t\treturn;\r\n\t}\r\n\tint mid = (l + r) >> 1;\r\n\tpushdown(x, l, r);\r\n\tupdate(x \u003c\u003c 1, l, mid, qx, qy, val);\r\n\tupdate(x \u003c\u003c 1 | 1, mid + 1, r, qx, qy, val);\r\n\tpushup(x);\r\n\treturn;\r\n}\r\nint query(int x, int l, int r, int qx, int qy)\r\n{\r\n\tif (qy \u003c l || qx > r)\r\n\t\treturn 0;\r\n\tif (qx \u003c= l && qy >= r)\r\n\t\treturn tree[x];\r\n\tint mid = (l + r) >> 1;\r\n\tpushdown(x, l, r);\r\n\treturn query(x \u003c\u003c 1, l, mid, qx, qy) + query(x \u003c\u003c 1 | 1, mid + 1, r, qx, qy);\r\n}\r\nvoid dfs(int x, int fa)\r\n{\r\n\tint maxi = 0;\r\n\t::size[x] = 1;\r\n\tdep[x] = dep[fa] + 1;\r\n\t::fa[x] = fa;\r\n\tfor (auto& y : nbr[x])\r\n\t{\r\n\t\tauto& nxt = y.first, & w = y.second;\r\n\t\tif (nxt != fa)\r\n\t\t{\r\n\t\t\tdfs(nxt, x);\r\n\t\t\t::size[x] += ::size[nxt];\r\n\t\t\tif (::size[nxt] > maxi)\r\n\t\t\t\tson[x] = nxt, maxi = ::size[nxt];\r\n\t\t}\r\n\t}\r\n\treturn;\r\n}\r\nvoid dfs1(int x, int fa)\r\n{\r\n\tdfn[x] = ++cnt;\r\n\tid[cnt] = x;\r\n\tif (son[x])\r\n\t{\r\n\t\ttop[son[x]] = top[x];\r\n\t\tdfs1(son[x], x);\r\n\t}\r\n\tfor (auto& y : nbr[x])\r\n\t{\r\n\t\tauto& nxt = y.first, & w = y.second;\r\n\t\tif(nxt != fa && !top[nxt])\r\n\t\t{\r\n\t\t\ttop[nxt] = nxt;\r\n\t\t\tdfs1(nxt, x);\r\n\t\t}\r\n\t}\r\n\trdfn[x] = cnt;\r\n\treturn;\r\n}\r\nint lca(int x, int y)\r\n{\r\n\twhile (top[x] != top[y])\r\n\t{\r\n\t\tif (dep[top[x]] > dep[top[y]])\r\n\t\t\tx = fa[top[x]];\r\n\t\telse\r\n\t\t\ty = fa[top[y]];\r\n\t}\r\n\treturn dep[x] \u003c dep[y] ? x : y;\r\n}\r\nvoid update_path(int x, int y, int val)\r\n{\r\n\twhile (top[x] != top[y])\r\n\t{\r\n\t\tif (dep[top[x]] > dep[top[y]])\r\n\t\t{\r\n\t\t\tupdate(1, 1, n, dfn[top[x]], dfn[x], val);\r\n\t\t\tx = fa[top[x]];\r\n\t\t}\r\n\t\telse\r\n\t\t{\r\n\t\t\tupdate(1, 1, n, dfn[top[y]], dfn[y], val);\r\n\t\t\ty = fa[top[y]];\r\n\t\t}\r\n\t}\r\n\tif (dep[x] > dep[y])\r\n\t\tswap(x,y);\r\n\tupdate(1, 1, n, dfn[x], dfn[y], val);\r\n\treturn;\r\n}\r\nint query_path(int x, int y)\r\n{\r\n\tint sum = 0;\r\n\twhile (top[x] != top[y])\r\n\t{\r\n\t\tif (dep[top[x]] > dep[top[y]])\r\n\t\t{\r\n\t\t\tsum += query(1, 1, n, dfn[top[x]], dfn[x]);\r\n\t\t\tx = fa[top[x]];\r\n\t\t}\r\n\t\telse\r\n\t\t{\r\n\t\t\tsum += query(1, 1, n, dfn[top[y]], dfn[y]);\r\n\t\t\ty = fa[top[y]];\r\n\t\t}\r\n\t}\r\n\tif (dep[x] > dep[y])\r\n\t\tswap(x,y);\r\n\treturn sum + query(1, 1, n, dfn[x], dfn[y]);\r\n}\r\nsigned main()\r\n{\r\n\tios::sync_with_stdio(0);\r\n\tcin.tie(0), cout.tie(0);\r\n\tcin >> n >> m >> root >> mod;\r\n\tfor (int i = 1; i \u003c= n; i++)\r\n\t\tcin >> a[i], a[i] %= mod;\r\n\tfor (int i = 1; i \u003c n; i++)\r\n\t{\r\n\t\tint x, y, z = 1;\r\n\t\tcin >> x >> y;\r\n\t\tnbr[x].push_back({ y,z });\r\n\t\tnbr[y].push_back({ x,z });\r\n\t}\r\n\tdfs(root, 0);\r\n\ttop[root] = root;\r\n\tdfs1(root, 0);\r\n\tbuild(1, 1, n);\r\n\tfor (int i = 1; i \u003c= m; i++)\r\n\t{\r\n\t\tint opt, x, y, z;\r\n\t\tcin >> opt >> x;\r\n\t\tif (opt == 1)\r\n\t\t{\r\n\t\t\tcin >> y >> z;\r\n\t\t\tupdate_path(x, y, z % mod);\r\n\t\t}\r\n\t\telse if (opt == 2)\r\n\t\t{\r\n\t\t\tcin >> y;\r\n\t\t\tcout \u003c\u003c query_path(x, y) % mod \u003c\u003c '\\n';\r\n\t\t}\r\n\t\telse if (opt == 3)\r\n\t\t{\r\n\t\t\tcin >> z;\r\n\t\t\tupdate(1, 1, n, dfn[x], rdfn[x], z % mod);\r\n\t\t}\r\n\t\telse\r\n\t\t\tcout \u003c\u003c query(1, 1, n, dfn[x], rdfn[x]) % mod \u003c\u003c '\\n';\r\n\t}\r\n\treturn 0;\r\n}\r\n```\r\n\r\n### 洛谷P1505\r\n\r\n[P1505 [国家集训队] 旅游](https://www.luogu.com.cn/problem/P1505)\r\n\r\n把边权放到子结点，从而将边的问题转换成点的问题。\r\n\r\n线段树同时维护边权和、边权最大值、边权最小值，`N` 操作可以直接交换边权最大值、边权最小值并取反。\r\n\r\n```cpp\r\n#include\u003cbits/stdc++.h>\r\ntypedef int int32;\r\n#define int long long\r\nusing namespace std;\r\nconst int N = 2e5 + 5;\r\nint n, m, root = 1, a[N], b[N], c[N], size[N], dep[N], fa[N],\r\ntop[N], son[N], dfn[N], rdfn[N], id[N], cnt;\r\nvector\u003cpair\u003cint, int>>nbr[N];\r\nstruct node1 {\r\n\tbool f1, f2;\r\n\tint x;\r\n\tnode1 operator+=(const node1& u) // 不要把懒标记合并直接写成覆盖！\r\n\t{\r\n\t\tif (u.f1)\r\n\t\t\t*this = u;\r\n\t\telse if (u.f2)\r\n\t\t\tif (f1)\r\n\t\t\t\tx = -x;\r\n\t\t\telse\r\n\t\t\t\tf2 = !f2;\r\n\t\treturn *this;\r\n\t}\r\n\tbool operator!() const\r\n\t{\r\n\t\treturn !f1 && !f2;\r\n\t}\r\n}tag[N \u003c\u003c 2];\r\nstruct node {\r\n\tint sum, maxi, mini, len;\r\n\tnode operator+(const node& u) const\r\n\t{\r\n\t\treturn { (sum + u.sum),max(maxi, u.maxi),\r\n\t\t\tmin(mini, u.mini),len + u.len };\r\n\t}\r\n\tnode operator+=(const node& u)\r\n\t{\r\n\t\treturn *this = *this + u;\r\n\t}\r\n\tnode operator+=(const node1& u)\r\n\t{\r\n\t\tif (u.f1)\r\n\t\t\tsum = u.x * len, maxi = u.x, mini = u.x;\r\n\t\telse if (u.f2)\r\n\t\t\tsum = -sum, swap(maxi, mini), maxi = -maxi, mini = -mini;\r\n\t\treturn *this;\r\n\t}\r\n}tree[N \u003c\u003c 2];\r\nvoid pushup(int x)\r\n{\r\n\ttree[x] = tree[x \u003c\u003c 1] + tree[x \u003c\u003c 1 | 1];\r\n\treturn;\r\n}\r\nvoid addtag(int x, int l, int r, node1 val)\r\n{\r\n\ttag[x] += val;\r\n\ttree[x] += val;\r\n\treturn;\r\n}\r\nvoid pushdown(int x, int l, int r)\r\n{\r\n\tif (!tag[x])\r\n\t\treturn;\r\n\tint mid = (l + r) >> 1;\r\n\taddtag(x \u003c\u003c 1, l, mid, tag[x]);\r\n\taddtag(x \u003c\u003c 1 | 1, mid + 1, r, tag[x]);\r\n\ttag[x] = { 0,0,0 };\r\n\treturn;\r\n}\r\nvoid build(int x, int l, int r)\r\n{\r\n\tif (l == r)\r\n\t{\r\n\t\ttree[x] = { a[id[l]],a[id[l]],a[id[l]],1 };\r\n\t\treturn;\r\n\t}\r\n\tint mid = (l + r) >> 1;\r\n\tbuild(x \u003c\u003c 1, l, mid);\r\n\tbuild(x \u003c\u003c 1 | 1, mid + 1, r);\r\n\tpushup(x);\r\n\treturn;\r\n}\r\nvoid update(int x, int l, int r, int qx, int qy, node1 val)\r\n{\r\n\tif (qy \u003c l || qx > r)\r\n\t\treturn;\r\n\tif (qx \u003c= l && qy >= r)\r\n\t{\r\n\t\taddtag(x, l, r, val);\r\n\t\treturn;\r\n\t}\r\n\tint mid = (l + r) >> 1;\r\n\tpushdown(x, l, r);\r\n\tupdate(x \u003c\u003c 1, l, mid, qx, qy, val);\r\n\tupdate(x \u003c\u003c 1 | 1, mid + 1, r, qx, qy, val);\r\n\tpushup(x);\r\n\treturn;\r\n}\r\nnode query(int x, int l, int r, int qx, int qy)\r\n{\r\n\tif (qy \u003c l || qx > r)\r\n\t\treturn { 0,(int)-1e9,(int)1e9,0 };\r\n\tif (qx \u003c= l && qy >= r)\r\n\t\treturn tree[x];\r\n\tint mid = (l + r) >> 1;\r\n\tpushdown(x, l, r);\r\n\treturn query(x \u003c\u003c 1, l, mid, qx, qy) +\r\n\t\tquery(x \u003c\u003c 1 | 1, mid + 1, r, qx, qy);\r\n}\r\nvoid dfs(int x, int fa)\r\n{\r\n\tint maxi = 0;\r\n\t::size[x] = 1;\r\n\tdep[x] = dep[fa] + 1;\r\n\t::fa[x] = fa;\r\n\tfor (auto& y : nbr[x])\r\n\t{\r\n\t\tauto& nxt = y.first, & w = y.second;\r\n\t\tif (nxt != fa)\r\n\t\t{\r\n\t\t\ta[nxt] = b[w];\r\n\t\t\tc[w] = nxt;\r\n\t\t\tdfs(nxt, x);\r\n\t\t\t::size[x] += ::size[nxt];\r\n\t\t\tif (::size[nxt] > maxi)\r\n\t\t\t\tson[x] = nxt, maxi = ::size[nxt];\r\n\t\t}\r\n\t}\r\n\treturn;\r\n}\r\nvoid dfs1(int x, int fa)\r\n{\r\n\tdfn[x] = ++cnt;\r\n\tid[cnt] = x;\r\n\tif (son[x])\r\n\t{\r\n\t\ttop[son[x]] = top[x];\r\n\t\tdfs1(son[x], x);\r\n\t}\r\n\tfor (auto& y : nbr[x])\r\n\t{\r\n\t\tauto& nxt = y.first, & w = y.second;\r\n\t\tif (nxt != fa && !top[nxt])\r\n\t\t{\r\n\t\t\ttop[nxt] = nxt;\r\n\t\t\tdfs1(nxt, x);\r\n\t\t}\r\n\t}\r\n\trdfn[x] = cnt;\r\n\treturn;\r\n}\r\nint lca(int x, int y)\r\n{\r\n\twhile (top[x] != top[y])\r\n\t{\r\n\t\tif (dep[top[x]] > dep[top[y]])\r\n\t\t\tx = fa[top[x]];\r\n\t\telse\r\n\t\t\ty = fa[top[y]];\r\n\t}\r\n\treturn dep[x] \u003c dep[y] ? x : y;\r\n}\r\nvoid update_path(int x, int y, node1 val)\r\n{\r\n\twhile (top[x] != top[y])\r\n\t{\r\n\t\tif (dep[top[x]] > dep[top[y]])\r\n\t\t{\r\n\t\t\tupdate(1, 1, n, dfn[top[x]], dfn[x], val);\r\n\t\t\tx = fa[top[x]];\r\n\t\t}\r\n\t\telse\r\n\t\t{\r\n\t\t\tupdate(1, 1, n, dfn[top[y]], dfn[y], val);\r\n\t\t\ty = fa[top[y]];\r\n\t\t}\r\n\t}\r\n\tif (dep[x] > dep[y])\r\n\t\tswap(x, y);\r\n\tupdate(1, 1, n, dfn[x] + 1, dfn[y], val);\r\n\treturn;\r\n}\r\nnode query_path(int x, int y)\r\n{\r\n\tnode sum = { 0,(int)-1e9,(int)1e9,0 };\r\n\twhile (top[x] != top[y])\r\n\t{\r\n\t\tif (dep[top[x]] > dep[top[y]])\r\n\t\t{\r\n\t\t\tsum += query(1, 1, n, dfn[top[x]], dfn[x]);\r\n\t\t\tx = fa[top[x]];\r\n\t\t}\r\n\t\telse\r\n\t\t{\r\n\t\t\tsum += query(1, 1, n, dfn[top[y]], dfn[y]);\r\n\t\t\ty = fa[top[y]];\r\n\t\t}\r\n\t}\r\n\tif (dep[x] > dep[y])\r\n\t\tswap(x, y);\r\n\treturn sum + query(1, 1, n, dfn[x] + 1, dfn[y]);\r\n}\r\nsigned main()\r\n{\r\n\tios::sync_with_stdio(0);\r\n\tcin.tie(0), cout.tie(0);\r\n\tcin >> n;\r\n\tfor (int i = 1; i \u003c n; i++)\r\n\t{\r\n\t\tint x, y, z = i;\r\n\t\tcin >> x >> y >> b[i];\r\n\t\tx++;\r\n\t\ty++;\r\n\t\tnbr[x].push_back({ y,z });\r\n\t\tnbr[y].push_back({ x,z });\r\n\t}\r\n\tdfs(root, 0);\r\n\ttop[root] = root;\r\n\tdfs1(root, 0);\r\n\tbuild(1, 1, n);\r\n\tcin >> m;\r\n\tfor (int i = 1; i \u003c= m; i++)\r\n\t{\r\n\t\tstring opt;\r\n\t\tint x, y;\r\n\t\tcin >> opt >> x >> y;\r\n\t\tif (opt == \"C\")\r\n\t\t\tupdate(1, 1, n, dfn[c[x]], dfn[c[x]], { true,false,y });\r\n\t\telse if (opt == \"N\")\r\n\t\t\tupdate_path(++x, ++y, { false,true,0 });\r\n\t\telse if (opt == \"SUM\")\r\n\t\t\tcout \u003c\u003c query_path(++x, ++y).sum \u003c\u003c '\\n';\r\n\t\telse if (opt == \"MAX\")\r\n\t\t\tcout \u003c\u003c query_path(++x, ++y).maxi \u003c\u003c '\\n';\r\n\t\telse if (opt == \"MIN\")\r\n\t\t\tcout \u003c\u003c query_path(++x, ++y).mini \u003c\u003c '\\n';\r\n\t}\r\n\treturn 0;\r\n}\r\n```\r\n\r\n### 洛谷P2590\r\n[P2590 [ZJOI2008] 树的统计](https://www.luogu.com.cn/problem/P2590)\r\n\r\n```cpp\r\n#include\u003cbits/stdc++.h>\r\ntypedef int int32;\r\n#define int long long\r\nusing namespace std;\r\nconst int N = 2e5 + 5;\r\nint n, m, root = 1, a[N], size[N], dep[N], fa[N],\r\ntop[N], son[N], dfn[N], rdfn[N], id[N], cnt;\r\nvector\u003cpair\u003cint, int>>nbr[N];\r\nstruct node1 {\r\n\tbool f1;\r\n\tint x;\r\n\tnode1 operator+=(const node1& u)\r\n\t{\r\n\t\treturn *this = u;\r\n\t}\r\n\tbool operator!() const\r\n\t{\r\n\t\treturn !f1;\r\n\t}\r\n}tag[N \u003c\u003c 2];\r\nstruct node {\r\n\tint sum, maxi, len;\r\n\tnode operator+(const node& u) const\r\n\t{\r\n\t\treturn { (sum + u.sum),max(maxi, u.maxi),len + u.len };\r\n\t}\r\n\tnode operator+=(const node& u)\r\n\t{\r\n\t\treturn *this = *this + u;\r\n\t}\r\n\tnode operator+=(const node1& u)\r\n\t{\r\n\t\tif (u.f1)\r\n\t\t\tsum = u.x * len, maxi = u.x;\r\n\t\treturn *this;\r\n\t}\r\n}tree[N \u003c\u003c 2];\r\nvoid pushup(int x)\r\n{\r\n\ttree[x] = tree[x \u003c\u003c 1] + tree[x \u003c\u003c 1 | 1];\r\n\treturn;\r\n}\r\nvoid addtag(int x, int l, int r, node1 val)\r\n{\r\n\ttag[x] += val;\r\n\ttree[x] += val;\r\n\treturn;\r\n}\r\nvoid pushdown(int x, int l, int r)\r\n{\r\n\tif (!tag[x])\r\n\t\treturn;\r\n\tint mid = (l + r) >> 1;\r\n\taddtag(x \u003c\u003c 1, l, mid, tag[x]);\r\n\taddtag(x \u003c\u003c 1 | 1, mid + 1, r, tag[x]);\r\n\ttag[x] = { 0,0 };\r\n\treturn;\r\n}\r\nvoid build(int x, int l, int r)\r\n{\r\n\tif (l == r)\r\n\t{\r\n\t\ttree[x] = { a[id[l]],a[id[l]],1 };\r\n\t\treturn;\r\n\t}\r\n\tint mid = (l + r) >> 1;\r\n\tbuild(x \u003c\u003c 1, l, mid);\r\n\tbuild(x \u003c\u003c 1 | 1, mid + 1, r);\r\n\tpushup(x);\r\n\treturn;\r\n}\r\nvoid update(int x, int l, int r, int qx, int qy, node1 val)\r\n{\r\n\tif (qy \u003c l || qx > r)\r\n\t\treturn;\r\n\tif (qx \u003c= l && qy >= r)\r\n\t{\r\n\t\taddtag(x, l, r, val);\r\n\t\treturn;\r\n\t}\r\n\tint mid = (l + r) >> 1;\r\n\tpushdown(x, l, r);\r\n\tupdate(x \u003c\u003c 1, l, mid, qx, qy, val);\r\n\tupdate(x \u003c\u003c 1 | 1, mid + 1, r, qx, qy, val);\r\n\tpushup(x);\r\n\treturn;\r\n}\r\nnode query(int x, int l, int r, int qx, int qy)\r\n{\r\n\tif (qy \u003c l || qx > r)\r\n\t\treturn { 0,(int)-1e9,0 };\r\n\tif (qx \u003c= l && qy >= r)\r\n\t\treturn tree[x];\r\n\tint mid = (l + r) >> 1;\r\n\tpushdown(x, l, r);\r\n\treturn query(x \u003c\u003c 1, l, mid, qx, qy) +\r\n\t\tquery(x \u003c\u003c 1 | 1, mid + 1, r, qx, qy);\r\n}\r\nvoid dfs(int x, int fa)\r\n{\r\n\tint maxi = 0;\r\n\t::size[x] = 1;\r\n\tdep[x] = dep[fa] + 1;\r\n\t::fa[x] = fa;\r\n\tfor (auto& y : nbr[x])\r\n\t{\r\n\t\tauto& nxt = y.first, & w = y.second;\r\n\t\tif (nxt != fa)\r\n\t\t{\r\n\t\t\tdfs(nxt, x);\r\n\t\t\t::size[x] += ::size[nxt];\r\n\t\t\tif (::size[nxt] > maxi)\r\n\t\t\t\tson[x] = nxt, maxi = ::size[nxt];\r\n\t\t}\r\n\t}\r\n\treturn;\r\n}\r\nvoid dfs1(int x, int fa)\r\n{\r\n\tdfn[x] = ++cnt;\r\n\tid[cnt] = x;\r\n\tif (son[x])\r\n\t{\r\n\t\ttop[son[x]] = top[x];\r\n\t\tdfs1(son[x], x);\r\n\t}\r\n\tfor (auto& y : nbr[x])\r\n\t{\r\n\t\tauto& nxt = y.first, & w = y.second;\r\n\t\tif (nxt != fa && !top[nxt])\r\n\t\t{\r\n\t\t\ttop[nxt] = nxt;\r\n\t\t\tdfs1(nxt, x);\r\n\t\t}\r\n\t}\r\n\trdfn[x] = cnt;\r\n\treturn;\r\n}\r\nint lca(int x, int y)\r\n{\r\n\twhile (top[x] != top[y])\r\n\t{\r\n\t\tif (dep[top[x]] > dep[top[y]])\r\n\t\t\tx = fa[top[x]];\r\n\t\telse\r\n\t\t\ty = fa[top[y]];\r\n\t}\r\n\treturn dep[x] \u003c dep[y] ? x : y;\r\n}\r\nvoid update_path(int x, int y, node1 val)\r\n{\r\n\twhile (top[x] != top[y])\r\n\t{\r\n\t\tif (dep[top[x]] > dep[top[y]])\r\n\t\t{\r\n\t\t\tupdate(1, 1, n, dfn[top[x]], dfn[x], val);\r\n\t\t\tx = fa[top[x]];\r\n\t\t}\r\n\t\telse\r\n\t\t{\r\n\t\t\tupdate(1, 1, n, dfn[top[y]], dfn[y], val);\r\n\t\t\ty = fa[top[y]];\r\n\t\t}\r\n\t}\r\n\tif (dep[x] > dep[y])\r\n\t\tswap(x, y);\r\n\tupdate(1, 1, n, dfn[x], dfn[y], val);\r\n\treturn;\r\n}\r\nnode query_path(int x, int y)\r\n{\r\n\tnode sum = { 0,(int)-1e9,0 };\r\n\twhile (top[x] != top[y])\r\n\t{\r\n\t\tif (dep[top[x]] > dep[top[y]])\r\n\t\t{\r\n\t\t\tsum += query(1, 1, n, dfn[top[x]], dfn[x]);\r\n\t\t\tx = fa[top[x]];\r\n\t\t}\r\n\t\telse\r\n\t\t{\r\n\t\t\tsum += query(1, 1, n, dfn[top[y]], dfn[y]);\r\n\t\t\ty = fa[top[y]];\r\n\t\t}\r\n\t}\r\n\tif (dep[x] > dep[y])\r\n\t\tswap(x, y);\r\n\treturn sum + query(1, 1, n, dfn[x], dfn[y]);\r\n}\r\nsigned main()\r\n{\r\n\tios::sync_with_stdio(0);\r\n\tcin.tie(0), cout.tie(0);\r\n\tcin >> n;\r\n\tfor (int i = 1; i \u003c n; i++)\r\n\t{\r\n\t\tint x, y, z = i;\r\n\t\tcin >> x >> y;\r\n\t\tnbr[x].push_back({ y,z });\r\n\t\tnbr[y].push_back({ x,z });\r\n\t}\r\n\tfor (int i = 1; i \u003c= n; i++)\r\n\t\tcin >> a[i];\r\n\tdfs(root, 0);\r\n\ttop[root] = root;\r\n\tdfs1(root, 0);\r\n\tbuild(1, 1, n);\r\n\tcin >> m;\r\n\tfor (int i = 1; i \u003c= m; i++)\r\n\t{\r\n\t\tstring opt;\r\n\t\tint x, y;\r\n\t\tcin >> opt >> x >> y;\r\n\t\tif (opt == \"CHANGE\")\r\n\t\t\tupdate(1, 1, n, dfn[x], dfn[x], { true,y });\r\n\t\telse if (opt == \"QMAX\")\r\n\t\t\tcout \u003c\u003c query_path(x, y).maxi \u003c\u003c '\\n';\r\n\t\telse if (opt == \"QSUM\")\r\n\t\t\tcout \u003c\u003c query_path(x, y).sum \u003c\u003c '\\n';\r\n\t}\r\n\treturn 0;\r\n}\r\n```","html":"\u003ch1 id=\"%E6%A0%91%E9%93%BE%E5%89%96%E5%88%86\" tabindex=\"-1\">树链剖分 \u003ca href=\"#%E6%A0%91%E9%93%BE%E5%89%96%E5%88%86\" class=\"header-anchor\">¶\u003c/a>\u003c/h1>\n\u003cp>是一种将一棵树划分为若干条链的思想，划分后每个树上结点恰好在一条链中。\u003c/p>\n\u003cp>而一条链又可以转化为一段连续的区间，从而将树上问题转换为序列问题。\u003c/p>\n\u003ch2 id=\"%E6%A0%91%E9%93%BE%E5%89%96%E5%88%86%E7%9A%84%E5%B8%B8%E8%A7%81%E6%96%B9%E5%BC%8F\" tabindex=\"-1\">树链剖分的常见方式 \u003ca href=\"#%E6%A0%91%E9%93%BE%E5%89%96%E5%88%86%E7%9A%84%E5%B8%B8%E8%A7%81%E6%96%B9%E5%BC%8F\" class=\"header-anchor\">¶\u003c/a>\u003c/h2>\n\u003cul>\n\u003cli>重链剖分\u003c/li>\n\u003cli>长链剖分\u003c/li>\n\u003cli>实链剖分\u003c/li>\n\u003c/ul>\n\u003cp>以重链剖分最常用。\u003c/p>\n\u003ch2 id=\"%E9%87%8D%E9%93%BE%E5%89%96%E5%88%86%E7%9A%84%E6%AD%A5%E9%AA%A4\" tabindex=\"-1\">重链剖分的步骤 \u003ca href=\"#%E9%87%8D%E9%93%BE%E5%89%96%E5%88%86%E7%9A%84%E6%AD%A5%E9%AA%A4\" class=\"header-anchor\">¶\u003c/a>\u003c/h2>\n\u003col>\n\u003cli>dfs 预处理树上每个点的 \u003cspan tabindex=\"0\" role=\"text\" aria-label=\"s, i, z, e, start subscript, x, end subscript\">\u003cspan class=\"katex\">\u003cspan class=\"katex-mathml\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\">\u003csemantics>\u003cmrow>\u003cmsub>\u003cmrow>\u003cmi>s\u003c/mi>\u003cmi>i\u003c/mi>\u003cmi>z\u003c/mi>\u003cmi>e\u003c/mi>\u003c/mrow>\u003cmi>x\u003c/mi>\u003c/msub>\u003c/mrow>\u003cannotation encoding=\"application/x-tex\">\\mathit{size}_x\u003c/annotation>\u003c/semantics>\u003c/math>\u003c/span>\u003cspan class=\"katex-html\" aria-hidden=\"true\">\u003cspan class=\"base\">\u003cspan class=\"strut\" style=\"height:0.8054em;vertical-align:-0.15em;\">\u003c/span>\u003cspan class=\"mord\">\u003cspan class=\"mord\">\u003cspan class=\"mord mathit\">size\u003c/span>\u003c/span>\u003cspan class=\"msupsub\">\u003cspan class=\"vlist-t vlist-t2\">\u003cspan class=\"vlist-r\">\u003cspan class=\"vlist\" style=\"height:0.1514em;\">\u003cspan style=\"top:-2.55em;margin-right:0.05em;\">\u003cspan class=\"pstrut\" style=\"height:2.7em;\">\u003c/span>\u003cspan class=\"sizing reset-size6 size3 mtight\">\u003cspan class=\"mord mathnormal mtight\">x\u003c/span>\u003c/span>\u003c/span>\u003c/span>\u003cspan class=\"vlist-s\">​\u003c/span>\u003c/span>\u003cspan class=\"vlist-r\">\u003cspan class=\"vlist\" style=\"height:0.15em;\">\u003cspan>\u003c/span>\u003c/span>\u003c/span>\u003c/span>\u003c/span>\u003c/span>\u003c/span>\u003c/span>\u003c/span>\u003c/span>；以及重儿子 \u003cspan tabindex=\"0\" role=\"text\" aria-label=\"s, o, n, start subscript, x, end subscript\">\u003cspan class=\"katex\">\u003cspan class=\"katex-mathml\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\">\u003csemantics>\u003cmrow>\u003cmsub>\u003cmrow>\u003cmi>s\u003c/mi>\u003cmi>o\u003c/mi>\u003cmi>n\u003c/mi>\u003c/mrow>\u003cmi>x\u003c/mi>\u003c/msub>\u003c/mrow>\u003cannotation encoding=\"application/x-tex\">\\mathit{son}_x\u003c/annotation>\u003c/semantics>\u003c/math>\u003c/span>\u003cspan class=\"katex-html\" aria-hidden=\"true\">\u003cspan class=\"base\">\u003cspan class=\"strut\" style=\"height:0.5806em;vertical-align:-0.15em;\">\u003c/span>\u003cspan class=\"mord\">\u003cspan class=\"mord\">\u003cspan class=\"mord mathit\">son\u003c/span>\u003c/span>\u003cspan class=\"msupsub\">\u003cspan class=\"vlist-t vlist-t2\">\u003cspan class=\"vlist-r\">\u003cspan class=\"vlist\" style=\"height:0.1514em;\">\u003cspan style=\"top:-2.55em;margin-right:0.05em;\">\u003cspan class=\"pstrut\" style=\"height:2.7em;\">\u003c/span>\u003cspan class=\"sizing reset-size6 size3 mtight\">\u003cspan class=\"mord mathnormal mtight\">x\u003c/span>\u003c/span>\u003c/span>\u003c/span>\u003cspan class=\"vlist-s\">​\u003c/span>\u003c/span>\u003cspan class=\"vlist-r\">\u003cspan class=\"vlist\" style=\"height:0.15em;\">\u003cspan>\u003c/span>\u003c/span>\u003c/span>\u003c/span>\u003c/span>\u003c/span>\u003c/span>\u003c/span>\u003c/span>\u003c/span>；\u003c/li>\n\u003cli>将根结点 \u003cspan tabindex=\"0\" role=\"text\" aria-label=\"r, o, o, t\">\u003cspan class=\"katex\">\u003cspan class=\"katex-mathml\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\">\u003csemantics>\u003cmrow>\u003cmi>r\u003c/mi>\u003cmi>o\u003c/mi>\u003cmi>o\u003c/mi>\u003cmi>t\u003c/mi>\u003c/mrow>\u003cannotation encoding=\"application/x-tex\">\\mathit{root}\u003c/annotation>\u003c/semantics>\u003c/math>\u003c/span>\u003cspan class=\"katex-html\" aria-hidden=\"true\">\u003cspan class=\"base\">\u003cspan class=\"strut\" style=\"height:0.6151em;\">\u003c/span>\u003cspan class=\"mord\">\u003cspan class=\"mord mathit\">root\u003c/span>\u003c/span>\u003c/span>\u003c/span>\u003c/span>\u003c/span> 视为轻儿子，那么每个轻儿子往下走重儿子形成的链唯一；\u003c/li>\n\u003cli>再次从 \u003cspan tabindex=\"0\" role=\"text\" aria-label=\"r, o, o, t\">\u003cspan class=\"katex\">\u003csp
