	<script type="application/json" id="post-data">{"id":"连通性问题","metadata":{"id":"连通性问题","title":"连通性问题","date":"2025-01-01","tags":["连通性问题"],"summary":"tarjan：连通性问题永远的神。 ..."},"markdown":"# 连通性问题\r\n\r\n> tarjan：连通性问题永远的神。\r\n\r\n## 双连通与割点、割边\r\n\r\n- 点双连通：在无向图中，删除一个点（不是 $x$ 或者 $y$）后，点 $x$ 和点 $y$ 仍然能够彼此到达，那么称 $x$ 和 $y$ 是点双连通的；\r\n\r\n- 边双连通：在无向图中，删除一条边后，点 $x$ 和点 $y$ 仍然能够彼此到达，那么称 $x$ 和 $y$ 是边双连通的；\r\n\r\n- 性质 $1$： 点双连通不具有传递性，但边双连通具有传递性；\r\n\r\n\u003c!-- more -->\r\n\r\n- 割点\r\n\t\r\n    - 在无向图 $G$ 中，若删除 $x$ 后，连通块的数量增加，则 $x$ 称为无向图 $G$ 的一个割点（割顶）。\r\n\r\n    - 结论：至少有 $3$ 个点的无向图，才**可能**存在割点；\r\n\r\n    - 割点的判定\r\n        - 若搜索树中，有从 $x$ 到 $y$ 的连边，当 $low_y \\ge dfn_x$ 时，说明 $y$ 能到达的最小时间戳在 $x$ 的时间戳之上，$y$ 被 $x$ 与 $x$ 之前的结点“隔开”，$x$ 可能是割点。只要 $x$ 不是搜索树的根结点，或者 $x$ 是根结点，但是 $x$ 的子结点大于 $1$ 个，那么 $x$ 就是割点。\r\n        - \r\n            ```cpp\r\n            void tarjan(int x)\r\n            {\r\n                dfn[x] = low[x] = ++num; //打时间戳\r\n                int cnt = 0; //统计子 结点个数\r\n                for (auto& [nxt, w] : nbr[x])\r\n                    if (!dfn[nxt]) //没去过 $nxt$\r\n                    {\r\n                        tarjan(nxt); //递归查找\r\n                        low[x] = min(low[x], low[nxt]); //维护 $x$ 能达到的最小时间戳 $low_X$\r\n                        cnt++;\r\n                        if (low[nxt] >= dfn[x]) //$x$ 可能是割点\r\n                            if (x != root || cnt >= 2) //排除根 结点只有 $1$个子 结点\r\n                                cut[x] = true;\r\n                    }\r\n                    else //$nxt$ 去过，所以 $nxt$ 还没有回溯，不能用 $low_nxt$\r\n                        low[x] = min(low[x], dfn[nxt]);\r\n                return;\r\n            }\r\n            ```\r\n\t\r\n- 割边\r\n\r\n\t- 在无向图中，若删除 $1$ 条边 $e$ 后，连通块的数量增加，那么称 $e$ 为一条割边。\r\n\t\r\n\t- 性质：割边一定不在环上，在环上的边一定不是割边。\r\n\t\r\n\t- 割边涉及的通常是“必经边”的问题。\r\n\t\r\n\t- 不用证明：割边删除后，恰好增加 $1$ 个连通块。\r\n\t\r\n\t- 割边的判定\r\n\t\r\n\t\t- 维护 $dfn_x$ 和 $low_x$ 之后，对于 $x$ 到 $y$ 的连边，若 $low_y > dfn_x$，则 `bridge[i] = bridge[i^1] = true`（对于链式前向星的方法）。\r\n\t\r\n\t\t- \r\n\t\t\t```cpp\r\n\t\t\t#include\u003cbits/stdc++.h>\r\n\t\t\ttypedef int int32;\r\n\t\t\t#define int long long\r\n\t\t\tusing namespace std;\r\n\t\t\tconst int N = 1e6 + 5;\r\n\t\t\tint n, m, dfn[N], low[N], num, ans;\r\n\t\t\tbool cut[N];\r\n\t\t\tvector\u003cpair\u003cint, int>>nbr[N];\r\n\t\t\tvoid tarjan(int x, int edge)\r\n\t\t\t{\r\n\t\t\t\tdfn[x] = low[x] = ++num;\r\n\t\t\t\tfor (auto& [nxt, w] : nbr[x])//这里的 $w$ 不是权值，是边的编号\r\n\t\t\t\t\tif (!dfn[nxt])\r\n\t\t\t\t\t{\r\n\t\t\t\t\t\ttarjan(nxt, w);\r\n\t\t\t\t\t\tlow[x] = min(low[x], low[nxt]);\r\n\t\t\t\t\t\tif (low[nxt] > dfn[x])\r\n\t\t\t\t\t\t\tcut[w] = true;\r\n\t\t\t\t\t}\r\n\t\t\t\t\telse if (w != edge)\r\n\t\t\t\t\t\tlow[x] = min(low[x], dfn[nxt]);\r\n\t\t\t\treturn;\r\n\t\t\t}\r\n\t\t\tsigned main()\r\n\t\t\t{\r\n\t\t\t\tios::sync_with_stdio(0);\r\n\t\t\t\tcin.tie(0), cout.tie(0);\r\n\t\t\t\tcin >> n >> m;\r\n\t\t\t\tfor (int i = 1; i \u003c= m; i++)\r\n\t\t\t\t{\r\n\t\t\t\t\tint x, y, z = i;\r\n\t\t\t\t\tcin >> x >> y;\r\n\t\t\t\t\tnbr[x].push_back({ y,z });\r\n\t\t\t\t\tnbr[y].push_back({ x,z });\r\n\t\t\t\t}\r\n\t\t\t\tfor (int i = 1; i \u003c= n; i++)\r\n\t\t\t\t\tif (!dfn[i])\r\n\t\t\t\t\t\ttarjan(i, 0);\r\n\t\t\t\tfor (int i = 1; i \u003c= m; i++)\r\n\t\t\t\t\tans += cut[i];\r\n\t\t\t\tcout \u003c\u003c ans;\r\n\t\t\t\treturn 0;\r\n\t\t\t}\r\n\t\t\t```\r\n\r\n\r\n### 例题\r\n\r\n#### 洛谷P3388\r\n\r\n[P3388 【模板】割点（割顶）](https://www.luogu.com.cn/problem/P3388)\r\n\r\n题意：给出一个 $n$ 个点，$m$ 条边的无向图，求图的割点。\r\n\r\n#### CF22C\r\n\r\n题意：构造 $n$ 个点 $m$ 条边的无向连通图，且无重边，点 $v$ 必须是割点。需特判无解。\r\n\r\n1. 有解时，$m$ 一定有上界和下界，下届为 $m \\ge n-1$；\r\n2. $v$ 已经连接了 $n-1$ 个点，不能有重边，因此 $v$ 不能再连边，视为 $v$ 不存在；\r\n3. 为了保证容纳的边尽可能多，要尽量连完全图，且不能破坏 $v$ 的割点特征；\r\n4. 留 $1$ 个单点只跟 $v$ 保持连边，剩下的 $n-2$ 个点构造完全图即可；\r\n5. 上界 $m \\le n-1+ (n-2)\\times(n-3)/2$。\r\n\r\n代码：\r\n\r\n```cpp\r\n#include\u003cbits/stdc++.h>\r\ntypedef int int32;\r\n#define int long long\r\nusing namespace std;\r\nconst int N = 1e5 + 5;\r\nint n, m, v;\r\n#define print(x, y) cout \u003c\u003c x \u003c\u003c ' ' \u003c\u003c y \u003c\u003c '\\n'\r\nsigned main()\r\n{\r\n\tios::sync_with_stdio(0);\r\n\tcin.tie(0), cout.tie(0);\r\n\tcin >> n >> m >> v;\r\n\tif (m \u003c n - 1 || m > n - 1 + (n - 2) * (n - 3) / 2)\r\n\t\tcout \u003c\u003c -1;\r\n\telse\r\n\t{\r\n\t\tm -= n - 1;\r\n\t\tif (v == 1)\r\n\t\t{\r\n\t\t\tprint(1, 2);\r\n\t\t\tprint(1, 3);\r\n\t\t\tfor (int i = 3; i \u003c n; i++)\r\n\t\t\t\tprint(i, i + 1);\r\n\t\t\tfor (int i = 3; i \u003c= n; i++)\r\n\t\t\t\tfor (int j = i + 2; j \u003c= n; j++)\r\n\t\t\t\t\tif (m--)\r\n\t\t\t\t\t\tprint(i, j);\r\n\t\t\t\t\telse\r\n\t\t\t\t\t\tgoto end;//不建议使用 `goto`，我是为了方便。\r\n\t\t\tfor (int i = 4; i \u003c= n; i++)\r\n\t\t\t\tif (m--)\r\n\t\t\t\t\tprint(i, 1);\r\n\t\t\t\telse\r\n\t\t\t\t\tgoto end;\r\n\t\t}\r\n\t\telse\r\n\t\t{\r\n\t\t\tfor (int i = 2; i \u003c n; i++)\r\n\t\t\t\tprint(i, i + 1);\r\n\t\t\tprint(1, v);\r\n\t\t\tfor (int i = 2; i \u003c= n; i++)\r\n\t\t\t\tfor (int j = i + 2; j \u003c= n; j++)\r\n\t\t\t\t\tif (m--)\r\n\t\t\t\t\t\tprint(i, j);\r\n\t\t\t\t\telse\r\n\t\t\t\t\t\tgoto end;\r\n\t\t}\r\n\tend:;\r\n\t}\r\n\treturn 0;\r\n}\r\n```\r\n\r\n#### 洛谷P3469\r\n\r\n[P3469 BLO-Blockade](https://www.luogu.com.cn/problem/P3469)\r\n\r\n题意：对于每个结点 $i$ 求出，把与结点 $i$ 关联的所有边去掉以后（不去掉结点 $i$ 本身），无向图有多少个有序点 $(x,y)$，满足 $x$ 和 $y$ 不连通。\r\n\r\n- 一个点 $x$，如果是不是割点，那么贡献一定是 $(n-2) \\div 2$；否则贡献是 $(n-1)+(z+1)(n-z-1)+\\sum_{y = A_i}{y(n-y)}$。其中 $A_i$ 为 结点 $i$ 满足：$i$ 是 $x$ 的子 结点，$i$ 之前没有访问过且 $low_i \\ge dfn_x$；$z$ 为 $\\sum a_i$。\r\n\r\n```cpp\r\n#include\u003cbits/stdc++.h>\r\ntypedef int int32;\r\n#define int long long\r\nusing namespace std;\r\nconst int N = 1e5 + 5;\r\nint n, m, dfn[N], low[N], num, root, ans[N], sum[N];\r\nbool cut[N];\r\nvector\u003cpair\u003cint, int>>nbr[N];\r\nvoid tarjan(int x)\r\n{\r\n\tdfn[x] = low[x] = ++num;\r\n\tsum[x] = 1;\r\n\tint cnt = 0, tot = 0;\r\n\tfor (auto& [nxt, w] : nbr[x])\r\n\t\tif (!dfn[nxt])\r\n\t\t{\r\n\t\t\ttarjan(nxt);\r\n\t\t\tsum[x] += sum[nxt];\r\n\t\t\tlow[x] = min(low[x], low[nxt]);\r\n\t\t\tcnt++;\r\n\t\t\tif (low[nxt] >= dfn[x])\r\n\t\t\t{\r\n\t\t\t\tans[x] += sum[nxt] * (n - sum[nxt]);\r\n\t\t\t\ttot += sum[nxt];\r\n\t\t\t\tif (x != root || cnt >= 2)\r\n\t\t\t\t\tcut[x] = true;\r\n\t\t\t}\r\n\t\t}\r\n\t\telse\r\n\t\t\tlow[x] = min(low[x], dfn[nxt]);\r\n\tif (!cut[x])\r\n\t\tans[x] = 2 * (n - 1);\r\n\telse\r\n\t\tans[x] += (n - tot - 1) * (tot + 1) + (n - 1);\r\n\treturn;\r\n}\r\nsigned main()\r\n{\r\n\tios::sync_with_stdio(0);\r\n\tcin.tie(0), cout.tie(0);\r\n\tcin >> n >> m;\r\n\tfor (int i = 1; i \u003c= m; i++)\r\n\t{\r\n\t\tint x, y, z = 1;\r\n\t\tcin >> x >> y;\r\n\t\tnbr[x].push_back({ y,z });\r\n\t\tnbr[y].push_back({ x,z });\r\n\t}\r\n\tfor (int i = 1; i \u003c= n; i++)\r\n\t\tif (!dfn[i])\r\n\t\t\troot = i, tarjan(i);\r\n\tfor (int i = 1; i \u003c= n; i++)\r\n\t\tcout \u003c\u003c ans[i] \u003c\u003c '\\n';\r\n\treturn 0;\r\n}\r\n```\r\n\r\n#### 洛谷P1656\r\n\r\n[P1656 炸铁路](https://www.luogu.com.cn/problem/P1656)\r\n\r\n题意：求割边，模板题。\r\n\r\n```cpp\r\n#include\u003cbits/stdc++.h>\r\ntypedef int int32;\r\n#define int long long\r\nusing namespace std;\r\nconst int N = 1e5 + 5;\r\nint n, m, dfn[N], low[N], num, ans, cnt;\r\nbool cut[N];\r\nvector\u003cpair\u003cint, int>>nbr[N];\r\npair\u003cint, int>a[N], b[N];\r\nvoid tarjan(int x, int edge)\r\n{\r\n\tdfn[x] = low[x] = ++num;\r\n\tfor (auto& [nxt, w] : nbr[x])\r\n\t\tif (!dfn[nxt])\r\n\t\t{\r\n\t\t\ttarjan(nxt, w);\r\n\t\t\tlow[x] = min(low[x], low[nxt]);\r\n\t\t\tif (low[nxt] > dfn[x])\r\n\t\t\t\tcut[w] = true;\r\n\t\t}\r\n\t\telse if (w != edge)\r\n\t\t\tlow[x] = min(low[x], dfn[nxt]);\r\n\treturn;\r\n}\r\nsigned main()\r\n{\r\n\tios::sync_with_stdio(0);\r\n\tcin.tie(0), cout.tie(0);\r\n\tcin >> n >> m;\r\n\tfor (int i = 1; i \u003c= m; i++)\r\n\t{\r\n\t\tint x, y, z = i;\r\n\t\tcin >> x >> y;\r\n\t\tnbr[x].push_back({ y,z });\r\n\t\tnbr[y].push_back({ x,z });\r\n\t\ta[i] = { min(x,y),max(x,y) };\r\n\t}\r\n\tfor (int i = 1; i \u003c= n; i++)\r\n\t\tif (!dfn[i])\r\n\t\t\ttarjan(i, 0);\r\n\tfor (int i = 1; i \u003c= m; i++)\r\n\t\tif (cut[i])\r\n\t\t\tb[++cnt] = a[i];\r\n\tsort(b + 1, b + 1 + cnt);\r\n\tfor (int i = 1; i \u003c= cnt; i++)\r\n\t\tcout \u003c\u003c b[i].first \u003c\u003c ' ' \u003c\u003c b[i].second \u003c\u003c '\\n';\r\n\treturn 0;\r\n}\r\n```\r\n\r\n#### 洛谷P7687\r\n\r\n[P1656](https://www.luogu.com.cn/problem/P7687)\r\n\r\n1. 初始时，所有点都能访问 A 和 B 类服务；\r\n2. 如果一条边，非割边，意味着在环上，删除后不改变连通性，不可能是关键边；\r\n3. 关键边应该是割边的一个子集；\r\n4. 对于 $x$ 到 $y$ 的连边，两侧不能出现没有 A 或者没有 B 类服务的点；\r\n\r\n```cpp\r\n#include\u003cbits/stdc++.h>\r\ntypedef int int32;\r\n//#define int long long\r\nusing namespace std;\r\nconst int N = 1e6 + 5;\r\nint n, m, dfn[N], low[N], num, ans, a[N], b[N], k, l;\r\nbool cut[N], vis[N];\r\nvector\u003cpair\u003cint, int>>nbr[N];\r\npair\u003cint, int>c[N];\r\nvoid tarjan(int x, int edge)\r\n{\r\n\tdfn[x] = low[x] = ++num;\r\n\tfor (auto& [nxt, w] : nbr[x])\r\n\t\tif (!dfn[nxt])\r\n\t\t{\r\n\t\t\ttarjan(nxt, w);\r\n\t\t\ta[x] += a[nxt];\r\n\t\t\tb[x] += b[nxt];\r\n\t\t\tlow[x] = min(low[x], low[nxt]);\r\n\t\t\tif (low[nxt] > dfn[x])\r\n\t\t\t{\r\n\t\t\t\tcut[w] = true;\r\n\t\t\t\tif (max(a[nxt], k - a[nxt]) == k || max(b[nxt], l - b[nxt]) == l)\r\n\t\t\t\t\tvis[w] = true;\r\n\t\t\t}\r\n\t\t}\r\n\t\telse if (w != edge)\r\n\t\t\tlow[x] = min(low[x], dfn[nxt]);\r\n\treturn;\r\n}\r\nsigned main()\r\n{\r\n\tios::sync_with_stdio(0);\r\n\tcin.tie(0), cout.tie(0);\r\n\tcin >> n >> m >> k >> l;\r\n\tfor (int i = 1; i \u003c= k; i++)\r\n\t{\r\n\t\tint x;\r\n\t\tcin >> x;\r\n\t\ta[x] = 1;\r\n\t}\r\n\tfor (int i = 1; i \u003c= l; i++)\r\n\t{\r\n\t\tint x;\r\n\t\tcin >> x;\r\n\t\tb[x] = 1;\r\n\t}\r\n\tfor (int i = 1; i \u003c= m; i++)\r\n\t{\r\n\t\tint x, y, z = i;\r\n\t\tcin >> x >> y;\r\n\t\tnbr[x].push_back({ y,z });\r\n\t\tnbr[y].push_back({ x,z });\r\n\t\tc[i] = { x,y };\r\n\t}\r\n\tfor (int i = 1; i \u003c= n; i++)\r\n\t\tif (!dfn[i])\r\n\t\t\ttarjan(i, 0);\r\n\tfor (int i = 1; i \u003c= m; i++)\r\n\t\tans += vis[i];\r\n\tcout \u003c\u003c ans \u003c\u003c '\\n';\r\n\tfor (int i = 1; i \u003c= m; i++)\r\n\t\tif (vis[i])\r\n\t\t\tcout \u003c\u003c c[i].first \u003c\u003c ' ' \u003c\u003c c[i].second \u003c\u003c '\\n';\r\n\treturn 0;\r\n}\r\n```\r\n\r\n## 边双连通分量\r\n\r\n- 边双连通：若无向图中点 $x$ 和 $y$ 在删除任意连边后，仍然连通，称 $x$ 和 $y$ 是边双连通的；\r\n- 边双连通分量：若无向图 $G$ 中，存在一个极大子图 $G'$，$G'$ 中没有割边，那么 $G'$ 是 $G$ 的一个边双连通分量记为 E-DCC；\r\n\r\n### 例题\r\n\r\n#### 洛谷T103489\r\n\r\n[T103489 【模板】边双连通分量](https://www.luogu.com.cn/problem/T103489)\r\n\r\n题意：给定一个 $n$ 个点 $m$ 条边的无向图，求边双连通分量（e-dcc）数量。\r\n\r\n```cpp\r\n#include\u003cbits/stdc++.h>\r\ntypedef int int32;\r\n#define int long long\r\nusing namespace std;\r\nconst int N = 3e5 + 5;\r\nint n, m, dfn[N], low[N], num, ans, cnt, dcc[N], id;\r\nbool cut[N];\r\nvector\u003cpair\u003cint, int>>nbr[N];\r\npair\u003cint, int>a[N];\r\nvoid tarjan(int x, int edge)\r\n{\r\n\tdfn[x] = low[x] = ++num;\r\n\tfor (auto& [nxt, w] : nbr[x])\r\n\t\tif (!dfn[nxt])\r\n\t\t{\r\n\t\t\ttarjan(nxt, w);\r\n\t\t\tlow[x] = min(low[x], low[nxt]);\r\n\t\t\tif (low[nxt] > dfn[x])\r\n\t\t\t\tcut[w] = true;\r\n\t\t}\r\n\t\telse if (w != edge)\r\n\t\t\tlow[x] = min(low[x], dfn[nxt]);\r\n\treturn;\r\n}\r\nvoid dfs(int x)\r\n{\r\n\tdcc[x] = id;\r\n\tfor (auto& [nxt, w] : nbr[x])\r\n\t\tif (!dcc[nxt] && !cut[w])\r\n\t\t\tdfs(nxt);\r\n\treturn;\r\n}\r\nsigned main()\r\n{\r\n\tios::sync_with_stdio(0);\r\n\tcin.tie(0), cout.tie(0);\r\n\tcin >> n >> m;\r\n\tfor (int i = 1; i \u003c= m; i++)\r\n\t{\r\n\t\tint x, y, z = i;\r\n\t\tcin >> x >> y;\r\n\t\tnbr[x].push_back({ y,z });\r\n\t\tnbr[y].push_back({ x,z });\r\n\t\ta[i] = { min(x,y),max(x,y) };\r\n\t}\r\n\tfor (int i = 1; i \u003c= n; i++)\r\n\t\tif (!dfn[i])\r\n\t\t\ttarjan(i, 0);\r\n\tfor (int i = 1; i \u003c= n; i++)\r\n\t\tif (!dcc[i])\r\n\t\t\tid++, dfs(i);\r\n\tcout \u003c\u003c id;\r\n\treturn 0;\r\n}\r\n```\r\n\r\n#### CF51F\r\n\r\n1. 图可能不连通，视为多个毛毛虫的拼接，每两个操作 $1$ 次；\r\n2. 对于一张连通图， 缩边双连通分量变为一棵树；\r\n3. 对于一棵树，操作叶子结点不会比操作叶子的父结点更优，所以叶子结点保留；\r\n4. 保留的主链越长越好，取树的直径最优，设长度为 $len$，且子结点为 $cnt$ 个，$n-len-cnt+2$；\r\n5. 设一个边双的结点数为 $size$，一个边双需要操作 $size-1$ 次；\r\n\r\n## 点双连通分量\r\n\r\n- 点双连通：无向图中，若点 $x$ 和 $y$，在删除任一点 $z$（$z\\not=x, z\\not=y$）后，$x$ 和 $y$ 仍然连通，那么称点 $x$ 和 $y$ 是点双连通的。\r\n\r\n- 点双连通分量：无向图 $G$ 中，若存在极大子图 $G'$，$G'$ 中没有割点，那么 $G'$ 称之为 $G$ 的一个点双连通分量，记为 V-DCC。\r\n\r\n推论：\r\n\r\n- 边双连通分量由割边连接，所以一个点只能在 $1$ 个 E-DCC 里；\r\n\r\n- 点双连通分量由割点链接，而 $1$ 个点可以链接多条边，因此 $1$ 个点可以在多个 V-DCC 里；\r\n- 若 $1$ 个点在超过 $1$ 个 V-DCC 中，则该点一定是割点；\r\n- 当研究一个 V-DCC 时，其内部没有“割点”，当研究整个图时，多个 V-DCC 的交点就是割点；\r\n- 一条边只能在一个 V-DCC 中。\r\n\r\n### 例题\r\n\r\n#### 洛谷P8435\r\n\r\n[P8435 【模板】点双连通分量](https://www.luogu.com.cn/problem/P8435)\r\n\r\n题意：对于一个 $n$ 个节点 $m$ 条无向边的图，请输出其点双连通分量的个数，并且输出每个点双连通分量。\r\n\r\n```cpp\r\n#include\u003cbits/stdc++.h>\r\ntypedef int int32;\r\n#define int long long\r\nusing namespace std;\r\nconst int N = 2e6 + 5;\r\nint n, m, dfn[N], low[N], num, root, cnt;\r\nbool cut[N];\r\nvector\u003cpair\u003cint, int>>nbr[N];\r\nvector\u003cint>dcc[N];\r\nstack\u003cint>q;\r\nvoid tarjan(int x)\r\n{\r\n\tdfn[x] = low[x] = ++num;\r\n\tq.push(x);\r\n\tif (x == root && !nbr[x].size())//x是单点\r\n\t{\r\n\t\tdcc[++cnt].push_back(x);\r\n\t\treturn;\r\n\t}\r\n\tint tot = 0;\r\n\tfor (auto& [nxt, w] : nbr[x])\r\n\t\tif (!dfn[nxt])\r\n\t\t{\r\n\t\t\ttarjan(nxt);\r\n\t\t\tlow[x] = min(low[x], low[nxt]);\r\n\t\t\tif (low[nxt] >= dfn[x])\r\n\t\t\t{\r\n\t\t\t\ttot++;\r\n\t\t\t\tif (x != root || tot >= 2)\r\n\t\t\t\t\tcut[x] = true;\r\n\t\t\t\tint tmp = 0;\r\n\t\t\t\tcnt++;\r\n\t\t\t\twhile (!q.empty() && tmp != nxt)\r\n\t\t\t\t{\r\n\t\t\t\t\ttmp = q.top();\r\n\t\t\t\t\tq.pop();\r\n\t\t\t\t\tdcc[cnt].push_back(tmp);\r\n\t\t\t\t}\r\n\t\t\t\tdcc[cnt].push_back(x);\r\n\t\t\t}\r\n\t\t}\r\n\t\telse\r\n\t\t\tlow[x] = min(low[x], dfn[nxt]);\r\n\treturn;\r\n}\r\nsigned main()\r\n{\r\n\tios::sync_with_stdio(0);\r\n\tcin.tie(0), cout.tie(0);\r\n\tcin >> n >> m;\r\n\tfor (int i = 1; i \u003c= m; i++)\r\n\t{\r\n\t\tint x, y, z = 1;\r\n\t\tcin >> x >> y;\r\n\t\tif (x == y)\r\n\t\t\tcontinue;\r\n\t\tnbr[x].push_back({ y,z });\r\n\t\tnbr[y].push_back({ x,z });\r\n\t}\r\n\tfor (int i = 1; i \u003c= n; i++)\r\n\t\tif (!dfn[i])\r\n\t\t\troot = i, tarjan(i);\r\n\tcout \u003c\u003c cnt \u003c\u003c '\\n';\r\n\tfor (int i = 1; i \u003c= cnt; i++)\r\n\t{\r\n\t\tcout \u003c\u003c dcc[i].size() \u003c\u003c ' ';\r\n\t\tfor (auto& x : dcc[i])\r\n\t\t\tcout \u003c\u003c x \u003c\u003c ' ';\r\n\t\tcout \u003c\u003c '\\n';\r\n\t}\r\n\treturn 0;\r\n}\r\n```","html":"\u003ch1 id=\"%E8%BF%9E%E9%80%9A%E6%80%A7%E9%97%AE%E9%A2%98\" tabindex=\"-1\">连通性问题 \u003ca href=\"#%E8%BF%9E%E9%80%9A%E6%80%A7%E9%97%AE%E9%A2%98\" class=\"header-anchor\">¶\u003c/a>\u003c/h1>\n\u003cblockquote>\n\u003cp>tarjan：连通性问题永远的神。\u003c/p>\n\u003c/blockquote>\n\u003ch2 id=\"%E5%8F%8C%E8%BF%9E%E9%80%9A%E4%B8%8E%E5%89%B2%E7%82%B9%E3%80%81%E5%89%B2%E8%BE%B9\" tabindex=\"-1\">双连通与割点、割边 \u003ca href=\"#%E5%8F%8C%E8%BF%9E%E9%80%9A%E4%B8%8E%E5%89%B2%E7%82%B9%E3%80%81%E5%89%B2%E8%BE%B9\" class=\"header-anchor\">¶\u003c/a>\u003c/h2>\n\u003cul>\n\u003cli>\n\u003cp>点双连通：在无向图中，删除一个点（不是 \u003cspan tabindex=\"0\" role=\"text\" aria-label=\"x\">\u003cspan class=\"katex\">\u003cspan class=\"katex-mathml\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\">\u003csemantics>\u003cmrow>\u003cmi>x\u003c/mi>\u003c/mrow>\u003cannotation encoding=\"application/x-tex\">x\u003c/annotation>\u003c/semantics>\u003c/math>\u003c/span>\u003cspan class=\"katex-html\" aria-hidden=\"true\">\u003cspan class=\"base\">\u003cspan class=\"strut\" style=\"height:0.4306em;\">\u003c/span>\u003cspan class=\"mord mathnormal\">x\u003c/span>\u003c/span>\u003c/span>\u003c/span>\u003c/span> 或者 \u003cspan tabindex=\"0\" role=\"text\" aria-label=\"y\">\u003cspan class=\"katex\">\u003cspan class=\"katex-mathml\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\">\u003csemantics>\u003cmrow>\u003cmi>y\u003c/mi>\u003c/mrow>\u003cannotation encoding=\"application/x-tex\">y\u003c/annotation>\u003c/semantics>\u003c/math>\u003c rgin-right:0.03588em;\">y\u003c/span>\u003c/span>\u003c/span>\u003c/span>\u003c/span> 仍然能够彼此到达，那么称 \u003cspan tabindex=\"0\" role=\"text\" aria-label=\"x\">\u003cspan class=\"katex\">\u003cspan class=\"katex-mathml\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\">\u003csemantics>\u003cmrow>\u003cmi>x\u003c/mi>\u003c/mrow>\u003cannotation encoding=\"application/x-tex\">x\u003c/annotation>\u003c/semantics>\u003c/math>\u003c/span>\u003cspan class=\"katex-html\" aria-hidden=\"true\">\u003cspan class=\"base\">\u003cspan class=\"strut\" style=\"height:0.4306em;\">\u003c/span>\u003cspan class=\"mord mathnormal\">x\u003c/span>\u003c/span>\u003c/span>\u003c/span>\u003c/span> 和 \u003cspan tabindex=\"0\" role=\"text\" aria-label=\"y\">\u003cspan class=\"katex\">\u003cspan class=\"katex-mathml\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\">\u003csemantics>\u003cmrow>\u003cmi>y\u003c/mi>\u003c/mrow>\u003cannotation encoding=\"application/x-tex\">y\u003c/annotation>\u003c/semantics>\u003c/math>\u003c/span>\u003cspan class=\"katex-html\" aria-hidden=\"true\">\u003cspan class=\"base\">\u003cspan class=\"strut\" style=\"height:0.625em;vertical-align:-0.1944em;\">\u003c/span>\u003cspan class=\"mord mathnormal\" style=\"margin-right:0.03588em;\">y\u003c/span>\u003c/span>\u003c/span>\u003c/span>\u003c/span> 是边双连通的；\u003c/p>\n\u003c/li>\n\u003cli>\n\u003cp>性质 \u003cspan tabindex=\"0\" role=\"text\" aria-label=\"1\">\u003cspan class=\"katex\">\u003cspan class=\"katex-mathml\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\">\u003csemantics>\u003cmrow>\u003cmn>1\u003c/mn>\u003c/mrow>\u003cannotation encoding=\"application/x-tex\">1\u003c/annotation>\u003c/semantics>\u003c/math>\u003c/span>\u003cspan class=\"katex-html\" aria-hidden=\"true\">\u003cspan class=\"base\">\u003cspan class=\"strut\" style=\"height:0.6444em;\">\u003c/span>\u003cspan class=\"mord\">1\u003c/span>\u003c/span>\u003c/span>\u003c/span>\u003c/span>： 点双连通不具有传递性，但边双连通具有传递性；\u003c/p>\n\u003c/li>\
