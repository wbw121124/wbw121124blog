	<script type="application/json" id="post-data">{"id":"区间dp（二）","metadata":{"id":"区间dp（二）","title":"区间 dp（二）","date":"2025-01-01","tags":["动态规划","区间dp"],"summary":"P1220 关路灯 https://www.luogu.com.cn/problem/P1220 \n请你为老张编一程序来安排关灯的顺序，使从老张开始关灯时刻算起所有灯消耗电最少（灯关掉后便不再消耗电了）..."},"markdown":"# 区间dp（二）\r\n\r\n## 洛谷P1220\r\n\r\n[P1220 关路灯](https://www.luogu.com.cn/problem/P1220)\r\n\r\n> 请你为老张编一程序来安排关灯的顺序，使从老张开始关灯时刻算起所有灯消耗电最少（灯关掉后便不再消耗电了）。\r\n\r\n老张关路灯像区间dp，可以发现他关路灯时不会关关过的中间加的，不然不优。\r\n\r\n### 状态\r\n\r\n$dp_{i,j,0/1}$ 表示区间关 $[i,j]$ 最后达到 $i/j$ 的最少功耗。\r\n\r\n### 答案\r\n\r\n$$\\min(dp_{1,n,0},dp_{1,n,1})$$\r\n\r\n\u003c!-- more -->\r\n\r\n```cpp\r\n#include\u003cbits/stdc++.h>\r\ntypedef int int32;\r\n#define int long long\r\nusing namespace std;\r\nconst int N = 50 + 5;\r\nint n, m, dp[N][N][2], a[N], b[N], sum[N];\r\nsigned main()\r\n{\r\n\tios::sync_with_stdio(0);\r\n\tcin.tie(0), cout.tie(0);\r\n\tcin >> n >> m;\r\n\tmemset(dp, 0x3f, sizeof dp);\r\n\tfor (int i = 1; i \u003c= n; i++)\r\n\t\tcin >> a[i] >> b[i], sum[i] = sum[i - 1] + b[i];\r\n\tdp[m][m][0] = dp[m][m][1] = 0;\r\n\tfor (int len = 2; len \u003c= n; len++)\r\n\t\tfor (int i = 1; i + len - 1 \u003c= n; i++)\r\n\t\t{\r\n\t\t\tint j = i + len - 1, tmp = sum[n] - sum[j] + sum[i],\r\n\t\t\t\ttmp1 = sum[n] - sum[j - 1] + sum[i - 1];\r\n\t\t\tdp[i][j][0] = min(dp[i + 1][j][0] + (a[i + 1] - a[i]) * tmp,\r\n\t\t\t\tdp[i + 1][j][1] + (a[j] - a[i]) * tmp);\r\n\t\t\tdp[i][j][1] = min(dp[i][j - 1][0] + (a[j] - a[i]) * tmp1,\r\n\t\t\t\tdp[i][j - 1][1] + (a[j] - a[j - 1]) * tmp1);\r\n\t\t}\r\n\tcout \u003c\u003c min(dp[1][n][0], dp[1][n][1]);\r\n\treturn 0;\r\n}\r\n```\r\n\r\n## 洛谷P8675\r\n\r\n[P8675 [蓝桥杯 2018 国 B] 搭积木](https://www.luogu.com.cn/problem/P8675)\r\n\r\n### 状态\r\n\r\n$dp_{l,i,j}$ 表示搭 $l$ 层的区间 $[i,j]$ 的方案数。\r\n\r\n### 答案\r\n\r\n$$\\displaystyle\\left(\\sum^l_{1\\le l\\le n}\\sum^i_{1\\le i\\le m}\\sum^j_{i\\le j\\le m}dp_{l,i,j}\\right)\\bmod{10^9+7}$$\r\n\r\n```cpp\r\n#include\u003cbits/stdc++.h>\r\ntypedef int int32;\r\n#define int long long\r\nusing namespace std;\r\nconst int N = 100 + 5;\r\nint n, m, dp[N][N][N], sum[N][N], vis[N][N], ans, mod = 1e9 + 7;\r\nsigned main()\r\n{\r\n\tios::sync_with_stdio(0);\r\n\tcin.tie(0), cout.tie(0);\r\n\tcin >> n >> m;\r\n\tfor (int i = n; i >= 1; i--)\r\n\t\tfor (int j = 1; j \u003c= m; j++)\r\n\t\t{\r\n\t\t\tchar c;\r\n\t\t\tcin >> c;\r\n\t\t\tvis[i][j] = vis[i][j - 1] + (c == 'X');\r\n\t\t}\r\n\tdp[0][1][m] = 1;\r\n\tfor (int l = 1; l \u003c= n; l++)\r\n\t{\r\n\t\tmemset(sum, 0, sizeof sum);\r\n\t\tfor (int i = 1; i \u003c= m; i++)\r\n\t\t\tfor (int j = i; j \u003c= m; j++)\r\n\t\t\t\tsum[i][j] = (sum[i - 1][j] + sum[i][j - 1] - sum[i - 1][j - 1] +\r\n\t\t\t\t\tdp[l - 1][i][j] + mod) % mod;\r\n\t\tfor (int len = 1; len \u003c= m; len++)\r\n\t\t\tfor (int i = 1; i + len - 1 \u003c= m; i++)\r\n\t\t\t{\r\n\t\t\t\tint j = i + len - 1;\r\n\t\t\t\tif (!(vis[l][j] - vis[l][i - 1]))\r\n\t\t\t\t\tans = (ans + (dp[l][i][j] = (sum[i][m] - sum[i][j - 1] +\r\n\t\t\t\t\t\tmod) % mod)) % mod;\r\n\t\t\t}\r\n\t}\r\n\tcout \u003c\u003c (ans + 1) % mod;\r\n\treturn 0;\r\n}\r\n```\r\n\r\n## 洛谷P4302\r\n\r\n[P4302 [SCOI2003] 字符串折叠](https://www.luogu.com.cn/problem/P4302)\r\n\r\n> 给一个字符串，求它的最短折叠。\r\n>\r\n> 例如 `AAAAAAAAAABABABCCD` 的最短折叠为：`9(A)3(AB)CCD`。\r\n>\r\n> `NEERCYESYESYESNEERCYESYESYES` 的是 `2(NEERC3(YES))`\r\n\r\n### 状态\r\n\r\n$dp_{i,j}$ 表示折叠区间 $[i,j]$ 的最短长度。\r\n\r\n### 答案\r\n\r\n$$dp_{1,n}$$\r\n\r\n```cpp\r\n#include\u003cbits/stdc++.h>\r\ntypedef int int32;\r\n#define int long long\r\nusing namespace std;\r\nconst int N = 100 + 5;\r\nint n, dp[N][N];\r\nstring s;\r\nbool check(int x, int y, int z)\r\n{\r\n\tfor (int i = x; i \u003c= y; i++)\r\n\t\tif (s[i] != s[x + ((i - x) % z)])\r\n\t\t\treturn false;\r\n\treturn true;\r\n}\r\nsigned main()\r\n{\r\n\tios::sync_with_stdio(0);\r\n\tcin.tie(0), cout.tie(0);\r\n\tcin >> s;\r\n\tn = s.size();\r\n\ts = '#' + s;\r\n\tmemset(dp, 0x3f, sizeof dp);\r\n\tfor (int i = 1; i \u003c= n; i++)\r\n\t\tdp[i][i] = 1;\r\n\tfor (int len = 2; len \u003c= n; len++)\r\n\t\tfor (int i = 1; i + len - 1 \u003c= n; i++)\r\n\t\t{\r\n\t\t\tint j = i + len - 1;\r\n\t\t\tdp[i][j] = len;\r\n\t\t\tfor (int k = i; k \u003c j; k++)\r\n\t\t\t{\r\n\t\t\t\tdp[i][j] = min(dp[i][j], dp[i][k] + dp[k + 1][j]);\r\n\t\t\t\tif (!(len % (k - i + 1)) && check(i, j, k - i + 1))\r\n\t\t\t\t\tdp[i][j] = min(dp[i][j], dp[i][k] + 2 +\r\n\t\t\t\t\t\t(int)to_string(len / (k - i + 1)).size());\r\n\t\t\t}\r\n\t\t}\r\n\tcout \u003c\u003c dp[1][n];\r\n\treturn 0;\r\n}\r\n```\r\n\r\n## 洛谷P2135\r\n\r\n[P2135 方块消除](https://www.luogu.com.cn/problem/P2135)\r\n\r\n双倍经验：[UVA10559 方块消除 Blocks](https://www.luogu.com.cn/problem/UVA10559)\r\n\r\n> Jimmy 最近迷上了一款叫做方块消除的游戏。游戏规则如下：$n$ 个带颜色方格排成一列，相同颜色的方块连成一个区域（如果两个相邻方块颜色相同，则这两个方块属于同一区域）。为简化题目，将连起来的同一颜色方块的数目用一个数表示。\r\n> \r\n> 例如，`9 122233331` 表示为\r\n> \r\n> ```plain\r\n4\r\n1 2 3 1\r\n1 3 4 1\r\n> ```\r\n> \r\n> 游戏时，你可以任选一个区域消去。设这个区域包含的方块数为 $x$，则将得到 $x^2$ 个分值。方块消去之后，其余的方块就会竖直落到底部或其他方块上。而且当有一列方块被完全消去时，其右边的所有方块就会向左移一格。Jimmy 希望你能找出得最高分的最佳方案，你能帮助他吗？\r\n\r\n### 状态\r\n\r\n$dp_{i,j,k}$ 表示消去区间 $[i,j]$ 且一起消去了 $i$ 前面和它相同的 $k$ 个的最高可能得分。\r\n\r\n### 答案\r\n\r\n$$dp_{1,n,0}$$\r\n\r\n```cpp\r\n/*此代码状态设计相反*/\r\n#include\u003cbits/stdc++.h>\r\ntypedef int int32;\r\n#define int long long\r\nusing namespace std;\r\nconst int N = 50 + 5;\r\nint n, m, a[N], b[N], dp[N][N][1005], sum[N];\r\nsigned main()\r\n{\r\n\tios::sync_with_stdio(0);\r\n\tcin.tie(0), cout.tie(0);\r\n\tcin >> n;\r\n\tfor (int i = 1; i \u003c= n; i++)\r\n\t\tcin >> a[i];\r\n\tfor (int i = 1; i \u003c= n; i++)\r\n\t\tcin >> b[i];\r\n\tfor (int i = 1; i \u003c= n; i++)\r\n\t\tfor (int j = i + 1; j \u003c= n; j++)\r\n\t\t\tif (a[i] == a[j])\r\n\t\t\t\tsum[i] += b[j];\r\n\tfor (int i = 1; i \u003c= n; i++)\r\n\t\tfor (int j = 0; j \u003c= sum[i]; j++)\r\n\t\t\tdp[i][i][j] = (b[i] + j) * (b[i] + j);\r\n\tfor (int len = 2; len \u003c= n; len++)\r\n\t\tfor (int i = 1; i + len - 1 \u003c= n; i++)\r\n\t\t{\r\n\t\t\tint j = i + len - 1;\r\n\t\t\tfor (int k = 0; k \u003c= sum[j]; k++)\r\n\t\t\t\tdp[i][j][k] = dp[i][j - 1][0] + (b[j] + k) * (b[j] + k);\r\n\t\t\tfor (int k = i; k \u003c= j - 2; k++)\r\n\t\t\t\tif (a[j] == a[k])\r\n\t\t\t\t\tfor (int l = 0; l \u003c= sum[j]; l++)\r\n\t\t\t\t\t\tdp[i][j][l] = max(dp[i][j][l], dp[i][k][b[j] + l] +\r\n\t\t\t\t\t\t\tdp[k + 1][j - 1][0]);\r\n\t\t}\r\n\tcout \u003c\u003c dp[1][n][0];\r\n\treturn 0;\r\n}\r\n```\r\n\r\n\r\n\r\n```cpp\r\n#include\u003cbits/stdc++.h>\r\ntypedef int int32;\r\n#define int long long\r\nusing namespace std;\r\nconst int N = 50 + 5;\r\nint n, m, a[N], b[N], dp[N][N][1005], sum[N];\r\nsigned main()\r\n{\r\n\tios::sync_with_stdio(0);\r\n\tcin.tie(0), cout.tie(0);\r\n\tcin >> n;\r\n\tfor (int i = 1; i \u003c= n; i++)\r\n\t\tcin >> a[i];\r\n\tfor (int i = 1; i \u003c= n; i++)\r\n\t\tcin >> b[i];\r\n\tfor (int i = 1; i \u003c= n; i++)\r\n\t\tfor (int j = 1; j \u003c i; j++)\r\n\t\t\tif (a[i] == a[j])\r\n\t\t\t\tsum[i] += b[j];\r\n\tfor (int i = 1; i \u003c= n; i++)\r\n\t\tfor (int j = 0; j \u003c= sum[i]; j++)\r\n\t\t\tdp[i][i][j] = (b[i] + j) * (b[i] + j);\r\n\tfor (int len = 2; len \u003c= n; len++)\r\n\t\tfor (int i = 1; i + len - 1 \u003c= n; i++)\r\n\t\t{\r\n\t\t\tint j = i + len - 1;\r\n\t\t\tfor (int k = 0; k \u003c= sum[i]; k++)\r\n\t\t\t\tdp[i][j][k] = dp[i + 1][j][0] + (b[i] + k) * (b[i] + k);\r\n\t\t\tfor (int k = i + 1; k \u003c j; k++)\r\n\t\t\t\tif (a[i] == a[k + 1])\r\n\t\t\t\t\tfor (int l = 0; l \u003c= sum[i]; l++)\r\n\t\t\t\t\t\tdp[i][j][l] = max(dp[i][j][l], dp[i + 1][k][0] +\r\n\t\t\t\t\t\t\tdp[k + 1][j][b[i] + l]);\r\n\t\t}\r\n\tcout \u003c\u003c dp[1][n][0];\r\n\treturn 0;\r\n}\r\n```","html":"\u003ch1 id=\"%E5%8C%BA%E9%97%B4dp%EF%BC%88%E4%BA%8C%EF%BC%89\" tabindex=\"-1\">区间 dp（二） \u003ca href=\"#%E5%8C%BA%E9%97%B4dp%EF%BC%88%E4%BA%8C%EF%BC%89\" class=\"header-anchor\">¶\u003c/a>\u003c/h1>\n\u003ch2 id=\"%E6%B4%9B%E8%B0%B7p1220\" tabindex=\"-1\">洛谷 P1220 \u003ca href=\"#%E6%B4%9B%E8%B0%B7p1220\" class=\"header-anchor\">¶\u003c/a>\u003c/h2>\n\u003cp>\u003ca href=\"https://www.luogu.com.cn/problem/P1220\">P1220 关路灯\u003c/a>\u003c/p>\n\u003cblockquote>\n\u003cp>请你为老张编一程序来安排关灯的顺序，使从老张开始关灯时刻算起所有灯消耗电最少（灯关掉后便不再消耗电了）。\u003c/p>\n\u003c/blockquote>\n\u003cp>老张关路灯像区间 dp，可以发现他关路灯时不会关关过的中间加的，不然不优。\u003c/p>\n\u003ch3 id=\"%E7%8A%B6%E6%80%81\" tabindex=\"-1\">状态 \u003ca href=\"#%E7%8A%B6%E6%80%81\" class=\"header-anchor\">¶\u003c/a>\u003c/h3>\n\u003cp>\u003cspan tabindex=\"0\" role=\"text\" aria-label=\"d, p, start subscript, i, comma, j, comma, 0, slash, 1, end subscript\">\u003cspan class=\"katex\">\u003cspan class=\"katex-mathml\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\">\u003csemantics>\u003cmrow>\u003cmi>d\u003c/mi>\u003cmsub>\u003cmi>p\u003c/mi>\u003cmrow>\u003cmi>i\u003c/mi>\u003cmo separator=\"true\">,\u003c/mo>\u003cmi>j\u003c/mi>\u003cmo separator=\"true\">,\u003c/mo>\u003cmn>0\u003c/mn>\u003cmi mathvariant=\"normal\">/\u003c/mi>\u003cmn>1\u003c/mn>\u003c/mrow>\u003c/msub>\u003c/mrow>\u003cannotation encoding=\"application/x-tex\">dp_{i,j,0/1}\u003c/annotation>\u003c/semantics>\u003c/math>\u003c/span>\u003cspan class=\"katex-html\" aria-hidden=\"true\">\u003cspan class=\"base\">\u003cspan class=\"strut\" style=\"height:1.0496em;vertical-align:-0.3552em;\">\u003c/span>\u003cspan class=\"mord mathnormal\">d\u003c/span>\u003cspan class=\"mord\">\u003cspan class=\"mord mathnormal\">p\u003c/span>\u003cspan class=\"msupsub\">\u003cspan class=\"vlist-t vlist-t2\">\u003cspan class=\"vlist-r\">\u003cspan class=\"vlist\" style=\"height:0.3448em;\">\u003cspan style=\"top:-2.5198em;margin-left:0em;margin-right:0.05em;\">\u003cspan class=\"pstrut\" style=\"height:2.7em;\">\u003c/span>\u003cspan class=\"sizing reset-size6 size3 mtight\">\u003cspan class=\"mord mtight\">\u003cspan class=\"mord mathnormal mtight\">i\u003c/span>\u003cspan class=\"mpunct mtight\">,\u003c/span>\u003cspan class=\"mord mathnormal mtight\" style=\"margin-right:0.05724em;\">j\u003c/span>\u003cspan class=\"mpunct mtig lor:#000000;--shiki-dark:#D4D4D4\">&lt;\u003c/span>\u003cspan style=\"color:#000000;--shiki-dark:#D4D4D4\"> \u003c/span>\u003cspan style=\"color:#001080;--shiki-dark:#9CDCFE\">dp\u003c/span>\u003cspan style=\"color:#319331;--shiki-dark:#DA70D6\">[\u003c/span>\u003cspan style=\"color:#098658;--shiki-dark:#B5CEA8\">1\u003c/span>\u003cspan style=\"color:#319331;--shiki-dark:#DA70D6\">]\u003c/span>\u003cspan style=\"color:#319331;--shiki-dark:#DA70D6\">[\u003c/span>\u003cspan style=\"color:#000000;--shiki-dark:#D4D4D4\">n\u003c/span>\u003cspan style=\"color:#319331;--shiki-dark:#DA70D6\">]\u003c/span>\u003cspan style=\"color:#000000;--shiki-dark:#D4D4D4\">;\u003c/span>\u003c/span>\u003cspan class=\"line\">\u003cspan style=\"color:#AF00DB;--shiki-dark:#C586C0\">\treturn\u003c/span>\u003cspan style=\"color:#098658;--shiki-dark:#B5CEA8\"> 0\u003c/span>\u003cspan style=\"color:#000000;--shiki-dark:#D4D4D4\">;\u003c/span>\u003c/span>\u003cspan class=\"line\">\u003cspan style=\"color:#0431FA;--shiki-dark:#FFD700\">}\u003c/span>\u003c/span>\u003c/code>\u003c/pre>\n\u003ch2 id=\"%E6%B4%9B%E8%B0%B7p2135\" tabindex=\"-1\">洛谷 P2135 \u003ca href=\"#%E6%B4%9B%E8%B0%B7p2135\" class=\"header-anchor\">¶\u003c/a>\u003c/h2>\n\u003cp>\u003ca href=\"https://www.luogu.com.cn/problem/P2135\">P2135 方块消除\u003c/a>\u003c/p>\n\u003cp>双倍经验：\u003ca href=\"https://www.luogu.com.cn/problem/UVA10559\">UVA10559 方块消除 Blocks\u003c/a>\u003c/p>\n\u003cblockquote>\n\u003cp>Jimmy 最近迷上了一款叫做方块消除的游戏。游戏规则如下：\u003cspan tabindex=\"0\" role=\"text\" aria-label=\"n\">\u003cspan class=\"katex\">\u003cspan class=\"katex-mathml\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\">\u003csemantics>\u003cmrow>\u003cmi>n\u003c/mi>\u003c/mrow>\u003cannotation encoding=\"application/x-tex\">n\u003c/annotation>\u003c/semantics>\u003c/math>\u003c/span>\u003cspan class=\"katex-html\" aria-hidden=\"true\">\u003cspan class=\"base\">\u003cspan class=\"strut\" style=\"height:0.4306em;\">\u003c/span>\u003cspan class=\"mord mathnormal\">n\u003c/span>\u003c/span>\u003c/span>\u003c/span>\u003c/span> 个带颜色方格排成一列，相同颜色的方块连成一个区域（如果两个相邻方块颜色相同，则这两个方块属于同一区域）。为简化题目，将连起来的同一颜色方块的数目用一个数表示。\u003c/p>\n\u003cp>例如，\u003ccode>9 122233331\u003c/code> 表示为\u003c/p>\n\u003cpre class=\"shiki shiki-themes light-plus dark-plus\" style=\"background-color:#FFFFFF;--shiki-dark-bg:#1E1E1E;color:#000000;--shiki-dark:#D4D4D4\" tabindex=\"0\">\u003ccode class=\"language-plain\" code-language=\"plain\">\u003cspan class=\"line\">\u003cspan>\u003c/span>\u003c/span>\u003c/code>\u003c/pre>\n\u003c/blockquote>\n\u003cp>4\n1 2 3 1\n1 3 4 1\u003c/p>\n\u003cblockquote>\n\u003cpre class=\"shiki shiki-themes light-plus dark-plus\" style=\"background-color:#FFFFFF;--shiki-dark-bg:#1E1E1E;color:#000000;--shiki-dark:#D4D4D4\" tabindex=\"0\">\u003ccode class=\"language-text\" code-language=\"text\">\u003cspan class=\"line\">\u003cspan>\u003c/span>\u003c/span>\u003cspan class=\"line\">\u003cspan>游戏时，你可以任选一个区域消去。设这个区域包含的方块数为 $x$，则将得到 $x^2$ 个分值。方块消去之后，其余的方块就会竖直落到底部或其他方块上。而且当有一列方块被完全消去时，其右边的所有方块就会向左移一格。Jimmy 希望你能找出得最高分的最佳方案，你能帮助他吗？\u003c/span>\u003c/span>\u003c/code>\u003c/pre>\n\u003c/blockquote>\n\u003ch3 id=\"%E7%8A%B6%E6%80%81-3\" tabindex=\"-1\">状态 \u003ca href=\"#%E7%8A%B6%E6%80%81-3\" class=\"header-anchor\">¶\u003c/a>\u003c/h3>\n\u003cp>\u003cspan tabindex=\"0\" role=\"text\" aria-label=\"d, p, start subscript, i, comma, j, comma, k, end subscript\">\u003cspan class=\"katex\">\u003cspan class=\"katex-mathml\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\">\u003csemantics>\u003cmrow>\u003cmi>d\u003c/mi>\u003cmsub>\u003cmi>p\u003c/mi>\u003cmrow>\u003cmi>i\u003c/mi>\u003cmo separator=\"true\">,\u003c/mo>\u003cmi>j\u003c/mi>\u003cmo separator=\"true\">,\u003c/mo>\u003cmi>k\u003c/mi>\u003c/mrow>\u003c/msub>\u003c/mrow>\u003cannotation encoding=\"application/x-tex\">dp_{i,j,k}\u003c/annotation>\u003c/semantics>\u003c/math>\u003c/span>\u003cspan class=\"katex-html\" aria-hidden=\"true\">\u003cspan class=\"base\">\u003cspan class=\
