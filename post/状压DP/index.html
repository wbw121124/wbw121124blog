	<script type="application/json" id="post-data">{"id":"状压DP","metadata":{"id":"状压DP","title":"状压 DP","date":"2025-05-02","tags":["动态规划","状态压缩"],"summary":"状压 DP 是动态规划的一种，通过将状态压缩为整数来达到优化转移的目的。 \n—— OI WIKI https://oi.wiki/dp/state..."},"markdown":"# 状压DP\r\n\r\n> 状压 DP 是动态规划的一种，通过将状态压缩为整数来达到优化转移的目的。\r\n>\r\n> ——[OI-WIKI](https://oi.wiki/dp/state/)\r\n\r\n\u003c!--more-->\r\n\r\n我们看 [P10447 最短 Hamilton 路径](https://www.luogu.com.cn/problem/P10447)：\r\n\r\n> 给定一张 $n$ 个点的带权无向图，点从 $0 \\sim n-1$ 标号，求起点 $0$ 到终点 $n-1$ 的最短 Hamilton 路径。 \r\n>\r\n> Hamilton 路径的定义是从 $0$ 到 $n-1$ 不重不漏地经过每个点恰好一次。\r\n\r\n我们发现状态转移需要获取点有没有转移过，所以定义 $dp _ {0/1,0/1,\\cdots,0/1,i}$ 表示最后到点 $i$，其他点有没有转移的最短 Hamilton 路径长度。\r\n\r\n写 $n+1$ 个循环的代码十分长，能不能让转移更简洁？\r\n\r\n这个状态前面特别像二进制整数，我们可以用数表示。\r\n\r\n$dp _ {i,j}$ 表示点有没有转移是二进制下 $i$，最后达到 $j$ 的最短 Hamilton 路径的长度。\r\n\r\n答案为 $dp _ {2^n-1,n-1}$。\r\n\r\n优化：枚举 $i$ 时 $i=i+2$ 而不是 $i=i+1$。\r\n\r\n时间复杂度 $O(\\frac{2^nn^2}{2})=O(2^{n-1}n^2)$。\r\n\r\n```cpp\r\n#include\u003cbits/stdc++.h>\r\ntypedef int int32;\r\n#define int long long\r\nusing namespace std;\r\nconst int N = 20 + 5;\r\nint n, dp[1 \u003c\u003c 20][N], dis[N][N];\r\nsigned main()\r\n{\r\n\tios::sync_with_stdio(0);\r\n\tcin.tie(0), cout.tie(0);\r\n\tmemset(dp, 0x3f, sizeof dp);\r\n\tcin >> n;\r\n\tfor (int i = 0; i \u003c n; i++)\r\n\t\tfor (int j = 0; j \u003c n; j++)\r\n\t\t\tcin >> dis[i][j];\r\n\tdp[1][0] = 0;\r\n\tfor (int i = 3; i \u003c (1ll \u003c\u003c n); i += 2)\r\n\t\tfor (int j = 0; j \u003c n; j++)\r\n\t\t\tif ((i >> j) & 1)\r\n\t\t\t\tfor (int k = 0; k \u003c n; k++)\r\n\t\t\t\t\tif (((i >> k) & 1) && j != k)\r\n\t\t\t\t\t\tdp[i][j] = min(dp[i][j], dp[i ^ (1ll \u003c\u003c j)][k] + dis[k][j]);\r\n\tcout \u003c\u003c dp[(1 \u003c\u003c n) - 1][n - 1];\r\n\treturn 0;\r\n}\r\n```\r\n\r\n## 例题\r\n\r\n### 洛谷P1171\r\n\r\n[P1171 售货员的难题](https://www.luogu.com.cn/problem/P1171)\r\n\r\n和上一题差不多，只是需要回到 $1$ 节点。\r\n\r\n可以枚举回去前最后一次到达的点。\r\n\r\n```cpp\r\nfor (int i = 1; i \u003c n; i++)\r\n\tans = min(ans, dp[(1 \u003c\u003c n) - 1][i] + dis[i][0]);\r\n```\r\n\r\n剩下的一样。\r\n\r\n### 洛谷P2704\r\n\r\n[P2704 [NOI2001] 炮兵阵地](https://www.luogu.com.cn/problem/P2704)\r\n\r\n定义 $dp_{i,j,k}$ 表示第 $i$ 行摆放二进制下的 $j$，第 $i-1$ 行摆放二进制下的 $k$ 时最多能摆放的炮兵部队的数量。\r\n\r\n答案为 $\\max dp_{i,j,k}$。\r\n\r\n但是 $100\\times4^{10}=104,867,600$ 次状态转移，会 TLE。\r\n\r\n优化：实际上有用的 $j,k$ 只有最多 $60$ 个，因此可以预处理有用的 $j,k$。\r\n\r\n时间复杂度 $O(nk^2+2^{10})$，其中 $k$ 表示有用的 $j$ 的个数。\r\n\r\n```cpp\r\n#include\u003cbits/stdc++.h>\r\ntypedef int int32;\r\n#define int long long\r\nusing namespace std;\r\nconst int N = 100 + 5;\r\nint n, m, a[N], b[N], c[N], cnt, dp[N][65][65], ans;\r\nsigned main()\r\n{\r\n\tios::sync_with_stdio(0);\r\n\tcin.tie(0), cout.tie(0);\r\n\tcin >> n >> m;\r\n\tfor (int i = 1; i \u003c= n; i++)\r\n\t\tfor (int j = 1; j \u003c= m; j++)\r\n\t\t{\r\n\t\t\tchar c;\r\n\t\t\tcin >> c;\r\n\t\t\ta[i] = (a[i] \u003c\u003c 1) + (c == 'P');\r\n\t\t}\r\n\tfor (int i = 0; i \u003c (1 \u003c\u003c m); i++)\r\n\t\tif (!((i \u003c\u003c 1) & i) && !((i \u003c\u003c 2) & i))\r\n\t\t{\r\n\t\t\tcnt++;\r\n\t\t\tb[cnt] = i;\r\n\t\t\tc[cnt] = __builtin_popcount(i);\r\n\t\t}\r\n\tfor (int i = 1; i \u003c= n; i++)\r\n\t\tfor (int j = 1; j \u003c= cnt; j++)\r\n\t\t\tif ((b[j] | a[i]) == a[i])\r\n\t\t\t\tfor (int k = 1; k \u003c= cnt; k++)\r\n\t\t\t\t\tif (!(b[j] & b[k]) && (b[k] | a[i - 1]) == a[i - 1])\r\n\t\t\t\t\t\tfor (int l = 1; l \u003c= cnt; l++)\r\n\t\t\t\t\t\t\tif (!(b[j] & b[l]))\r\n\t\t\t\t\t\t\t\tans = max(ans, dp[i][j][k] = max(dp[i][j][k],\r\n\t\t\t\t\t\t\t\t\tdp[i - 1][k][l] + c[j]));\r\n\tcout \u003c\u003c ans;\r\n\treturn 0;\r\n}\r\n```\r\n\r\n### 洛谷P1896\r\n\r\n[P1896 [SCOI2005] 互不侵犯](https://www.luogu.com.cn/problem/P1896)\r\n\r\n定义 $dp_{i,j,k}$ 表示第 $i$ 行摆放二进制下的 $j$，一共摆放了 $k$ 个的方案数。\r\n\r\n答案为 $\\sum dp_{i,j,K}$。\r\n\r\n时间复杂度 $O(2^NNK)$。\r\n\r\n```cpp\r\n#include\u003cbits/stdc++.h>\r\ntypedef int int32;\r\n#define int long long\r\nusing namespace std;\r\nconst int N = 100 + 5;\r\nint n, m, dp[N][1 \u003c\u003c 9][N], ans;\r\nsigned main()\r\n{\r\n\tios::sync_with_stdio(0);\r\n\tcin.tie(0), cout.tie(0);\r\n\tcin >> n >> m;\r\n\tdp[0][0][0] = 1;\r\n\tfor (int i = 1; i \u003c= n; i++)\r\n\t\tfor (int j = 0; j \u003c (1 \u003c\u003c n); j++)\r\n\t\t\tif (!((j \u003c\u003c 1) & j))\r\n\t\t\t{\r\n\t\t\t\tint tmp = __builtin_popcount(j);\r\n\t\t\t\tfor (int k = 0; k \u003c (1 \u003c\u003c n); k++)\r\n\t\t\t\t\tif (!((j \u003c\u003c 1) & k) && !(j & k) && !((k \u003c\u003c 1) & j))\r\n\t\t\t\t\t\tfor (int l = tmp + __builtin_popcount(k); l \u003c= m; l++)\r\n\t\t\t\t\t\t\tdp[i][j][l] = dp[i][j][l] + dp[i - 1][k][l - tmp];\r\n\t\t\t\tif (tmp)\r\n\t\t\t\t\tans += dp[i][j][m];\r\n\t\t\t}\r\n\tcout \u003c\u003c ans;\r\n\treturn 0;\r\n}\r\n```\r\n\r\n### 洛谷P8756\r\n\r\n[P8756 [蓝桥杯 2021 省 AB2] 国际象棋](https://www.luogu.com.cn/problem/P8756)\r\n\r\n定义 $dp_{i,j,k,l}$ 表示第 $i$ 列摆放二进制下的 $j$，第 $i-1$ 列摆放二进制下的 $k$，一共摆放了 $l$ 个的方案数。\r\n\r\n答案为 $\\sum dp_{i,j,k,K}$。\r\n\r\n时间复杂度 $O(2^NMK)$。\r\n\r\n```cpp\r\n#include\u003cbits/stdc++.h>\r\ntypedef int int32;\r\n#define int long long\r\nusing namespace std;\r\nconst int N = 100 + 5, mod = 1e9 + 7;\r\nint n, m, k, dp[N][1 \u003c\u003c 6][1 \u003c\u003c 6][25], ans;\r\nsigned main()\r\n{\r\n\tios::sync_with_stdio(0);\r\n\tcin.tie(0), cout.tie(0);\r\n\tcin >> n >> m >> k;\r\n\tdp[0][0][0][0] = 1;\r\n\tfor (int i = 1; i \u003c= m; i++)\r\n\t\tfor (int j = 0; j \u003c (1 \u003c\u003c n); j++)\r\n\t\t{\r\n\t\t\tint tmp = __builtin_popcount(j);\r\n\t\t\tfor (int k = 0; k \u003c (1 \u003c\u003c n); k++)\r\n\t\t\t\tif (!((k \u003c\u003c 2) & j) && !((j \u003c\u003c 2) & k) && (i > 1 ? true : !k))\r\n\t\t\t\t{\r\n\t\t\t\t\tint tmp1 = __builtin_popcount(k);\r\n\t\t\t\t\tfor (int l = 0; l \u003c (1 \u003c\u003c n); l++)\r\n\t\t\t\t\t\tif (!((l \u003c\u003c 1) & j) && !((j \u003c\u003c 1) & l) && (i > 2 ? true : !l))\r\n\t\t\t\t\t\t\tfor (int x = tmp + tmp1 +\r\n\t\t\t\t\t\t\t\t__builtin_popcount(l); x \u003c= ::k; x++)\r\n\t\t\t\t\t\t\t\tdp[i][j][k][x] = (dp[i][j][k][x] +\r\n\t\t\t\t\t\t\t\t\tdp[i - 1][k][l][x - tmp]) % mod;\r\n\t\t\t\t\tif (tmp)\r\n\t\t\t\t\t\tans = (ans + dp[i][j][k][::k]) % mod;\r\n\t\t\t\t}\r\n\t\t}\r\n\tcout \u003c\u003c ans;\r\n\treturn 0;\r\n}\r\n```\r\n\r\n### SP1700\r\n\r\n[SP1700 TRSTAGE - Traveling by Stagecoach](https://www.luogu.com.cn/problem/SP1700)\r\n\r\n[Traveling by Stagecoach - SPOJ TRSTAGE](https://vjudge.net/problem/SPOJ-TRSTAGE#author=DeepSeek_zh)\r\n\r\n定义 $dp_{i,j}$ 表示到达状态为二进制下的 $i$ 最后到 $j$ 的最短用时。\r\n\r\n答案为 $\\min dp_{i,b}$。\r\n\r\n时间复杂度 $O\\left(2^nn(m+k)\\right)$。\r\n\r\n```cpp\r\n#include\u003cbits/stdc++.h>\r\ntypedef int int32;\r\n#define int long long\r\nusing namespace std;\r\nconst int N = 30 + 5;\r\nint n, m, k, x, y, a[N], b[N][N];\r\ndouble dp[1 \u003c\u003c 8][N], ans;\r\nvector\u003cint>nbr[N];\r\nsigned main()\r\n{\r\n\tios::sync_with_stdio(0);\r\n\tcin.tie(0), cout.tie(0);\r\n\twhile (cin >> n >> m >> k >> x >> y)\r\n\t{\r\n\t\tif (!n)\r\n\t\t\tbreak;\r\n\t\tfor (int i = 0; i \u003c n; i++)\r\n\t\t\tcin >> a[i];\r\n\t\tfor (int i = 1; i \u003c= m; i++)\r\n\t\t\tnbr[i].clear();\r\n\t\tfor (int i = 1; i \u003c= k; i++)\r\n\t\t{\r\n\t\t\tint x, y;\r\n\t\t\tcin >> x >> y;\r\n\t\t\tcin >> b[x][y];\r\n\t\t\tb[y][x] = b[x][y];\r\n\t\t\tnbr[x].push_back(y);\r\n\t\t\tnbr[y].push_back(x);\r\n\t\t}\r\n\t\tans = 1e9;\r\n\t\tfor (int i = 0; i \u003c (1 \u003c\u003c n); i++)\r\n\t\t\tfor (int j = 1; j \u003c= m; j++)\r\n\t\t\t\tdp[i][j] = 1e9;\r\n\t\tdp[0][x] = 0;\r\n\t\tfor (int i = 1; i \u003c (1 \u003c\u003c n); i++)\r\n\t\t\tfor (int j = 0; j \u003c n; j++)\r\n\t\t\t\tif ((i >> j) & 1)\r\n\t\t\t\t\tfor (int k = 1; k \u003c= m; k++)\r\n\t\t\t\t\t{\r\n\t\t\t\t\t\tfor (auto& nxt : nbr[k])\r\n\t\t\t\t\t\t\tdp[i][k] = min(dp[i][k], dp[i ^ (1 \u003c\u003c j)][nxt] +\r\n\t\t\t\t\t\t\t\tb[k][nxt] * 1.00 / a[j]);\r\n\t\t\t\t\t\tif (k == y)\r\n\t\t\t\t\t\t\tans = min(ans, dp[i][k]);\r\n\t\t\t\t\t}\r\n\t\tif (ans == 1e9)\r\n\t\t\tcout \u003c\u003c \"Impossible\\n\";\r\n\t\telse\r\n\t\t\tcout \u003c\u003c fixed \u003c\u003c setprecision(3) \u003c\u003c ans \u003c\u003c '\\n';\r\n\t}\r\n\treturn 0;\r\n}\r\n```","html":"\u003ch1 id=\"%E7%8A%B6%E5%8E%8Bdp\" tabindex=\"-1\">状压 DP \u003ca href=\"#%E7%8A%B6%E5%8E%8Bdp\" class=\"header-anchor\">¶\u003c/a>\u003c/h1>\n\u003cblockquote>\n\u003cp>状压 DP 是动态规划的一种，通过将状态压缩为整数来达到优化转移的目的。\u003c/p>\n\u003cp>——\u003ca href=\"https://oi.wiki/dp/state/\">OI-WIKI\u003c/a>\u003c/p>\n\u003c/blockquote>\n\u003c!--more-->\n\u003cp>我们看 \u003ca href=\"https://www.luogu.com.cn/problem/P10447\">P10447 最短 Hamilton 路径\u003c/a>：\u003c/p>\n\u003cblockquote>\n\u003cp>给定一张 \u003cspan tabindex=\"0\" role=\"text\" aria-label=\"n\">\u003cspan class=\"katex\">\u003cspan class=\"katex-mathml\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\">\u003csemantics>\u003cmrow>\u003cmi>n\u003c/mi>\u003c/mrow>\u003cannotation encoding=\"application/x-tex\">n\u003c/annotation>\u003c/semantics>\u003c/math>\u003c/span>\u003cspan class=\"katex-html\" aria-hidden=\"true\">\u003cspan class=\"base\">\u003cspan class=\"strut\" style=\"height:0.4306em;\">\u003c/span>\u003cspan class=\"mord mathnormal\">n\u003c/span>\u003c/span>\u003c/span>\u003c/span>\u003c/span> 个点的带权无向图，点从 \u003cspan tabindex=\"0\" role=\"text\" aria-label=\"0, \\sim, n, minus, 1\">\u003cspan class=\"katex\">\u003cspan class=\"katex-mathml\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\">\u003csemantics>\u003cmrow>\u003cmn>0\u003c/mn>\u003cmo>∼\u003c/mo>\u003cmi>n\u003c/mi>\u003cmo>−\u003c/mo>\u003cmn>1\u003c/mn>\u003c/mrow>\u003cannotation encoding=\"application/x-tex\">0 \\sim n-1\u003c/annotation>\u003c/semantics>\u003c/math>\u003c/span>\u003cspan class=\"katex-html\" aria-hidden=\"true\">\u003cspan class=\"base\">\u003cspan class=\"strut\" style=\"height:0.6444em;\">\u003c/span>\u003cspan class=\"mord\">0\u003c/span>\u003cspan class=\"mspace\" style=\"margin-right:0.2778em;\">\u003c/span>\u003cspan class=\"mrel\">∼\u003c/span>\u003cspan class=\"mspace\" style=\"margin-right:0.2778em;\">\u003c/span>\u003c/span>\u003cspan class=\"base\">\u003cspan class=\"strut\" style=\"height:0.6667em;vertical-align:-0.0833em;\">\u003c/span>\u003cspan class=\"mord mathnormal\">n\u003c/span>\u003cspan class=\"mspace\" style=\"margin-right:0.2222em;\">\u003c/span>\u003cspan class=\"mbin\">−\u003c/span>\u003cspan class=\"mspace\" style=\"margin-right:0.2222em;\">\u003c/span>\u003c/span>\u003cspan class=\"base\">\u003cspan class=\"strut\" style=\"height:0.6444em;\">\u003c/span>\u003cspan class=\"mord\">1\u003c/span>\u003c/span>\u003c/span>\u003c/span>\u003c/span> 标号，求起点 \u003cspan tabindex=\"0\" role=\"text\" aria-label=\"0\">\u003cspan class=\"katex\">\u003cspan class=\"katex-mathml\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\">\u003csemantics>\u003cmrow>\u003cmn>0\u003c/mn>\u003c/mrow>\u003cannotation encoding=\"application/x-tex\">0\u003c/annotation>\u003c/semantics>\u003c/math>\u003c/span>\u003cspan class=\"katex-html\" aria-hidden=\"true\">\u003cspan class=\"base\">\u003cspan class=\"strut\" style=\"height:0.6444em;\">\u003c/span>\u003cspan class=\"mord\">0\u003c/span>\u003c/span>\u003c/span>\u003c/span>\u003c/span> 到终点 \u003cspan tabindex=\"0\" role=\"text\" aria-label=\"n, minus, 1\">\u003cspan class=\"katex\">\u003cspan class=\"katex-mathml\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\">\u003csemantics>\u003cmrow>\u003cmi>n\u003c/mi>\u003cmo>−\u003c/mo>\u003cmn>1\u003c/mn>\u003c/mrow>\u003cannotation encoding=\"application/x-tex\">n-1\u003c/annotation>\u003c/semantics>\u003c/math>\u003c/span>\u003cspan class=\"katex-html\" aria-hidden=\"true\">\u003cspan class=\"base\">\u003cspan class=\"strut\" style=\"height:0.6667em;vertical-align:-0.0833em;\">\u003c/span>\u003cspan class=\"mord mathnormal\">n\u003c/span>\u003cspan class=\"mspace\" style=\"margin-right:0.2222em;\">\u003c/span>\u003cspan class=\"mbin\">−\u003c/span>\u003cspan class=\"mspace\" style=\"margin-right:0.2222em;\">\u003c/span>\u003c/span>\u003cspan class=\"base\">\u003cspan class=\"strut\" style=\"height:0.6444em;\">\u003c/span>\u003cspan class=\"mord\">1\u003c/span>\u003c/span>\u003c/span>\u003c/span>\u003c/span> 的最短 Hamilton 路径。\u003c/p>\n\u003cp>Hamilton 路径的定义是从 \u003cspan tabindex=\"0\" role=\"text\" aria-label=\"0\">\u003cspan class=\"katex\">\u003cspan class=\"katex-mathml\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\">\u003csemantics>\u003cmrow>\u003cmn>0\u003c/mn>\u003c/mrow>\u003cannotation encoding=\"application/x-tex\">0\u003c/annotation>\u003c/semantics>\u003c/math>\u003c/span>\u003cspan class=\"katex-html\" aria-hidden=\"true\">\u003cspan class=\"base\">\u003cspan class=\"strut\" style=\"height:0.6444em;\">\u003c/span>\u003cspan class=\"mord\">0\u003c/span>\u003c/span>\u003c/span>\u003c/span>\u003c/span> 到 \u003cspan tabindex=\"0\" role=\"text\" aria-label=\"n, minus, 1\">\u003cspan class=\"katex\">\u003cspan class=\"katex-mathml\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\">\u003csemantics>\u003cmrow>\u003cmi>n\u003c/mi>\u003cmo>−\u003c/mo>\u003cmn>1\u003c/mn>\u003c/mrow>\u003cannotation encoding=\"application/x-tex\">n-1\u003c/annotation>\u003c/semantics>\u003c/math>\u003c/span>\u003cspan class=\"katex-html\" aria-hidden=\"true\">\u003cspan class=\"base\">\u003cspan class=\"strut\" style=\"height:0.6667em;vertical-align:-0.0833em;\">\u003c/span>\u003cspan class=\"mord mathnormal\">n\u003c/span>\u003cspan class=\"mspace\" style=\"margin-right:0.2222em;\">\u003c/span>\u003cspan class=\"mbin\">−\u003c/span>\u003cspan class=\"mspace\" style=\"margin-right:0.2222em;\">\u003c/span>\u003c/span>\u003cspan class=\"base\">\u003cspan class=\"strut\" style=\"height:0.6444em;\">\u003c/span>\u003cspan class=\"mord\">1\u003c/span>\u003c/span>\u003c/span>\u003c/span>\u003c/span> 不重不漏地经过每个点恰好一次。\u003c/p>\n\u003c/blockquote>\n\u003cp>我们发现状态转移需要获取点有没有转移过，所以定义 \u003cspan tabindex=\"0\" role=\"text\" aria-label=\"d, p, start subscript, 0, slash, 1, comma, 0, slash, 1, comma, \\@cdots, comma, 0, slash, 1, comma, i, end subscript\">\u003cspan class=\"katex\">\u003cspan class=\"katex-mathml\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\">\u003csemantics>\u003cmrow>\u003cmi>d\u003c/mi>\u003cmsub>\u003cmi>p\u003c/mi>\u003cmrow>\u003cmn>0\u003c/mn>\u003cmi mathvariant=\"normal\">/\u003c/mi>\u003cmn>1\u003c/mn>\u003cmo separator=\"true\">,\u003c/mo>\u003cmn>0\u003c/mn>\u003cmi mathvariant=\"normal\">/\u003c/mi>\u003cmn>1\u003c/mn>\u003cmo separator=\"true\">,\u003c/mo>\u003cmo>⋯\u003c/mo>\u003cmtext> \u003c/mtext>\u003cmo separator=\"true\">,\u003c/mo>\u003cmn>0\u003c/mn>\u003cmi mathvariant=\"normal\">/\u003c/mi>\u003cmn>1\u003c/mn>\u003cmo separator=\"true\">,\u003c/mo>\u003cmi>i\u003c/mi>\u003c/mrow>\u003c/msub>\u003c/mrow>\u003cannotation encoding=\"application/x-tex\">dp _ {0/1,0/1,\\cdots,0/1,i}\u003c/annotation>\u003c/semantics>\u003c/math>\u003c/span>\u003cspan class=\"katex-html\" aria-hidden=\"true\">\u003cspan class=\"base\">\u003cspan class=\"strut\" style=\"height:1.0496em;vertical-align:-0.3552em;\">\u003c/span>\u003cspan class=\"mord mathnormal\">d\u003c/span>\u003cspan class=\"mord\">\u003cspan class=\"mord mathnormal\">p\u003c/span>\u003cspan class=\"msupsub\">\u003cspan class=\"vlist-t vlist-t2\">\u003cspan class=\"vlist-r\">\u003cspan class=\"vlist\" style=\"height:0.3448em;\">\u003cspan style=\"top:-2.5198em;margin-left:0em;margin-right:0.05em;\">\u003cspan class=\"pstrut\" style=\"height:2.7em;\">\u003c/span>\u003cspan class=\"sizing reset-size6 size3 mtight\">\u003cspan class=\"mord mtight\">\u003cspan class=\"mord mtight\">0/1\u003c/span>\u003cspan class=\"mpunct mtight\">,\u003c/span>\u003cspan class=\"mord mtight\">0/1\u003c/span>\u003cspan class=\"mpunct mtight\">,\u003c/span>\u003cspan class=\"minner mtight\">⋯\u003c/span>\u003cspan class=\"mspace mtight\" style=\"margin-right:0.1952em;\">\u003c/span>\u003cspan class=\"mpunct mtight\">,\u003c/span>\u003cspan class=\"mord mtight\">0/1\u003c/span>\u003cspan class=\"mpunct mtight\">,\u003c/span>\u003cspan class=\"mord mathnormal mtight\">i\u003c/span>\u003c/span>\u003c/span>\u003c/span>\u003c/span>\u003cspan class=\"vlist-s\">​\u003c/span>\u003c/span>\u003cspan class=\"vlist-r\">\u003cspan class=\"vlist\" style=\"height:0.3552em;\">\u003cspan>\u003c/span>\u003c/span>\u003c/span>\u003c/span>\u003c/span>\u003c/span>\u003c/span>\u003c/span>\u003c/span>\u003c/span> 表示最后到点 \u003cspan tabindex=\"0\" role=\"text\" aria-label=\"i\">\u003cspan class=\"katex\">\u003cspan class=\"katex-mathml\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\">\u003csemantics>\u003cmrow>\u003cmi>i\u003c/mi>\u003c/mrow>\u003cannotation encoding=\"application/x-tex\">i\u003c/annotation>\u003c/semantics>\u003c/math>\u003c/span>\u003cspan class=\"katex-html\" aria-hidden=\"true\">\u003cspan class=\"base\">\u003cspan class=\"strut\" style=\"height:0.6595em;\">\u003c/span>\u003cspan class=\"mord mathnormal\">i\u003c/span>\u003c/span>\u003c/span>\u003c/span>\u003c/span>，其他点有没有转移的最短 Hamilton 路径长度。\u003c/p>\n\u003cp>写 \u003cspan tabindex=\"0\" role=\"text\" aria-label=\"n, plus, 1\">\u003cspan class=\"katex\">\u003cspan class=\"katex-mathml\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\">\u003csemantics>\u003cmrow>\u003cmi>n\u003c/mi>\u003cmo>+\u003c/mo>\u003cmn>1\u003c/mn>\u003c/mrow>\u003cannotation encoding=\"application/x-tex\">n+1\u003c/annotation>\u003c/semantics>\u003c/math>\u003c/span>\u003cspan class=\"katex-html\" aria-hidden=\"true\">\u003cspan class=\"base\">\u003cspan class=\"strut\" style=\"height:0.6667em;vertical-align:-0.0833em;\">\u003c/span>\u003cspan class=\"mord mathnormal\">n\u003c/span>\u003cspan class=\"mspace\" style=\"margin-right:0.2222em;\">\u003c/span>\u003cspan class=\"mbin\">+\u003c/span>\u003cspan class=\"mspace\" style=\"margin-right:0.2222em;\">\u003c/span>\u003c/span>\u003cspan class=\"base\">\u003cspan class=\"strut\" style=\"height:0.6444em;\">\u003c/span>\u003cspan class=\"mord\">1\u003c/span>\u003c/span>\u003c/span>\u003c/span>\u003c/span> 个循环的代码十分长，能不能让转移更简洁？\u003c/p>\n\u003cp>这个状态前面特别像二进制整数，我们可以用数表示。\u003c/p>\n\u003cp>\u003cspan tabindex=\"0\" role=\"text\" aria-label=\"d, p, start subscript, i, comma, j, end subscript\">\u003cspan class=\"katex\">\u003cspan class=\"katex-mathml\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\">\u003csemantics>\u003cmrow>\u003cmi>d\u003c/mi>\u003cmsub>\u003cmi>p\u003c/mi>\u003cmrow>\u003cmi>i\u003c/mi>\u003cmo separator=\"true\">,\u003c/mo>\u003cmi>j\u003c/mi>\u003c/mrow>\u003c/msub>\u003c/mrow>\u003cannotation encoding=\"application/x-tex\">dp _ {i,j}\u003c/annotation>\u003c/semantics>\u003c/math>\u003c/span>\u003cspan class=\"katex-html\" aria-hidden=\"true\">\u003cspan class=\"base\">\u003cspan class=\"strut\" style=\"height:0.9805em;vertical-align:-0.2861em;\">\u003c/span>\u003cspan class=\"mord mathnormal\">d\u003c/span>\u003cspan class=\"mord\">\u003cspan class=\"mord mathnormal\">p\u003c/span>\u003cspan class=\"msupsub\">\u003cspan class=\"vlist-t vlist-t2\">\u003cspan class=\"vlist-r\">\u003cspan class=\"vlist\" style=\"height:0.3117em;\">\u003cspan style=\"top:-2.55em;margin-left:0em;margin-right:0.05em;\">\u003cspan class=\"pstrut\" style=\"height:2.7em;\">\u003c/span>\u003cspan class=\"sizing reset-size6 size3 mtight\">\u003cspan class=\"mord mtight\">\u003cspan class=\"mord mathnormal mtight\">i\u003c/span>\u003cspan class=\"mpunct mtight\">,\u003c/span>\u003cspan class=\"mord mathnormal mtight\" style=\"margin-right:0.05724em;\">j\u003c/span>\u003c/span>\u003c/span>\u003c/span>\u003c/span>\u003cspan class=\"vlist-s\">​\u003c/span>\u003c/span>\u003cspan class=\"vlist-r\">\u003cspan class=\"vlist\" style=\"height:0.2861em;\">\u003cspan>\u003c/span>\u003c/span>\u003c/span>\u003c/span>\u003c/span>\u003c/span>\u003c/span>\u003c/span>\u003c/span>\u003c/span> 表示点有没有转移是二进制下 \u003cspan tabindex=\"0\" role=\"text\" aria-label=\"i\">\u003cspan class=\"katex\">\u003cspan class=\"katex-mathml\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\">\u003csemantics>\u003cmrow>\u003cmi>i\u003c/mi>\u003c/mrow>\u003cannotation encoding=\"application/x-tex\">i\u003c/annotation>\u003c/semantics>\u003c/math>\u003c/span>\u003cspan class=\"katex-html\" aria-hidden=\"true\">\u003cspan class=\"base\">\u003cspan class=\"strut\" style=\"height:0.6595em;\">\u003c/span>\u003cspan class=\"mord mathnormal\">i\u003c/span>\u003c/span>\u003c/span>\u003c/span>\u003c/span>，最后达到 \u003cspan tabindex=\"0\" role=\"text\" aria-label=\"j\">\u003cspan class=\"katex\">\u003cspan class=\"katex-mathml\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\">\u003csemantics>\u003cmrow>\u003cmi>j\u003c/mi>\u003c/mrow>\u003cannotation encoding=\"application/x-tex\">j\u003c/annotation>\u003c/semantics>\u003c/math>\u003c/span>\u003cspan class=\"katex-html\" aria-hidden=\"true\">\u003cspan class=\"base\">\u003cspan class=\"strut\" style=\"height:0.854em;vertical-align:-0.1944em;\">\u003c/span>\u003cspan class=\"mord mathnormal\" style=\"margin-right:0.05724em;\">j\u003c/span>\u003c/span>\u003c/span>\u003c/span>\u003c/span> 的最短 Hamilton 路径的长度。\u003c/p>\n\u003cp>答案为 \u003cspan tabindex=\"0\" role=\"text\" aria-label=\"d, p, start subscript, 2, start superscript, n, end superscript, minus, 1, comma, n, minus, 1, end subscript\">\u003cspan class=\"katex\">\u003cspan class=\"katex-mathml\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\">\u003csemantics>\u003cmrow>\u003cmi>d\u003c/mi>\u003cmsub>\u003cmi>p\u003c/mi>\u003cmrow>\u003cmsup>\u003cmn>2\u003c/mn>\u003cmi>n\u003c/mi>\u003c/msup>\u003cmo>−\u003c/mo>\u003cmn>1\u003c/mn>\u003cmo separator=\"true\">,\u003c/mo>\u003cmi>n\u003c/mi>\u003cmo>−\u003c/mo>\u003cmn>1\u003c/mn>\u003c/mrow>\u003c/msub>\u003c/mrow>\u003cannotation encoding=\"application/x-tex\">dp _ {2^n-1,n-1}\u003c/annotation>\u003c/semantics>\u003c/math>\u003c/span>\u003cspan class=\"katex-html\" aria-hidden=\"true\">\u003cspan class=\"base\">\u003cspan class=\"strut\" style=\"height:0.9805em;vertical-align:-0.2861em;\">\u003c/span>\
