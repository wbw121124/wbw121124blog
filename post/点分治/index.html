	<script type="application/json" id="post-data">{"id":"点分治","metadata":{"id":"点分治","title":"点分治","date":"2026-01-01","tags":["编程","算法竞赛","点分治","树的重心","分治"],"summary":"点分治，也叫重心剖分，是一种用于树形数据结构的分治思想的算法。"},"markdown":"# 点分治\r\n点分治，也叫重心剖分，是一种用于树形数据结构的分治思想的算法，解决树上满足条件的路径统计问题。点分治的核心思想是通过选择树的重心结点，将树划分为若干子树，然后递归地在这些子树上应用相同的策略，从而有效地解决问题。\r\n## 实现步骤\r\n1. 确定当前树的重心，设为根结点，开始点分治算法；\r\n2. 枚举下一个结点，通过 dfs 更新子树贡献；\r\n3. 清空当前使用的统计答案的数据结构，比如数组或树状数组（不建议完全清零，可能复杂度退化），删除当前结点；\r\n4. 递归处理各个子树，回到步骤 $1$。\r\n\r\n因为每一次选的是重心，所以每一个划分的子树大小不超过 $\\frac{n}{2}$，所以递归的深度为 $O(\\log n)$，每一层递归中需要 $O(n)$ 的时间复杂度来处理当前树。即跑点分治实现的时间复杂度为 $O(n \\log n)$（不包含实现的数据结构的时间复杂度）。\r\n\r\n## 例题\r\n### CF161D\r\n[CF161D - Distance in Tree](https://codeforces.com/problemset/problem/161/D) | [vjudge](https://vjudge.net/problem/CodeForces-161D#author=wbw121124)\r\n\r\n> 给你一棵有 $n$ 个顶点的树，以及一个正整数 $m$。请你计算有多少对不同的结点，它们之间的距离恰好是 $m$。注意，结点对 $(v, u)$ 和 $(u, v)$ 被视为同一对。\r\n\r\n```cpp\r\n#include\u003cbits/stdc++.h>\r\ntypedef int int32;\r\n#define int long long\r\nusing namespace std;\r\nconst int N = 5e4 + 5;\r\n/*\r\nn: 树的结点数\r\nm: 目标路径长度\r\nsz[]: 结点子树大小\r\ncnt[]: 记录路径长度出现的次数\r\ntmp[]: 临时存储当前子树的路径长度\r\ntot: tmp 数组的大小\r\nctr: 当前树的重心结点\r\nans: 最终答案\r\n*/\r\nint n, m, sz[N], cnt[N], tmp[N], tot, ctr, ans;\r\nbitset\u003cN>del; // 标记结点是否被删除\r\nvector\u003cint>nbr[N]; // 邻接表存储树\r\nvoid get_ctr(int x, int fa) // 求重心\r\n{\r\n\tsz[x] = 1;\r\n\tint maxi = 0;\r\n\tfor (auto& nxt : nbr[x])\r\n\t\tif (!del[nxt] && nxt != fa)\r\n\t\t{\r\n\t\t\tget_ctr(nxt, x);\r\n\t\t\tif (ctr)\r\n\t\t\t\treturn;\r\n\t\t\tmaxi = max(maxi, sz[nxt]);\r\n\t\t\tsz[x] += sz[nxt]; // 不要写在 return 之前，否则 sz[x] 的大小错误\r\n\t\t}\r\n\tmaxi = max(maxi, n - sz[x]);\r\n\tif (maxi \u003c= n / 2)\r\n\t{\r\n\t\tctr = x;\r\n\t\tsz[fa] = n - sz[x]; // 更新父节点的大小，防止后续递归时 sz 错误\r\n\t}\r\n\treturn;\r\n}\r\nvoid dfs(int x, int fa, int len) // 更新子树贡献\r\n{\r\n\tif (len > m)\r\n\t\treturn;\r\n\tans += cnt[m - len] + (len == m); // 统计路径数目，特判长度等于 m 的路径\r\n\ttmp[++tot] = len;\r\n\tfor (auto& nxt : nbr[x])\r\n\t\tif (!del[nxt] && nxt != fa)\r\n\t\t\tdfs(nxt, x, len + 1);\r\n\treturn;\r\n}\r\nvoid work(int x) // 点分治主体\r\n{\r\n\t// 2. 枚举下一个结点，通过 dfs 更新子树贡献；\r\n\tfor (auto& nxt : nbr[x])\r\n\t\tif (!del[nxt])\r\n\t\t{\r\n\t\t\tint tmp1 = tot;\r\n\t\t\tdfs(nxt, x, 1);\r\n\t\t\tfor (int i = tmp1 + 1; i \u003c= tot; i++) // 从 tmp1 + 1 开始，避免重复统计\r\n\t\t\t\tcnt[tmp[i]]++;\r\n\t\t}\r\n\t// 3. 清空当前使用的统计答案的数据结构，比如数组或树状数组，删除当前结点；\r\n\tfor (int i = 1; i \u003c= tot; i++)\r\n\t\tcnt[tmp[i]]--;\r\n\ttot = 0;\r\n\tdel[x] = true;\r\n\t// 4. 递归处理各个子树，回到步骤 $1$。\r\n\tfor (auto& nxt : nbr[x])\r\n\t\tif (!del[nxt])\r\n\t\t{\r\n\t\t\tn = sz[nxt]; // 更新当前的树大小\r\n\t\t\tctr = 0; // 重置重心，不要忘记\r\n\t\t\t// 1. 确定当前树的重心，设为根结点，开始点分治算法；\r\n\t\t\tget_ctr(nxt, 0);\r\n\t\t\twork(ctr);\r\n\t\t}\r\n\treturn;\r\n}\r\nsigned main()\r\n{\r\n\tios::sync_with_stdio(0);\r\n\tcin.tie(0), cout.tie(0);\r\n\tcin >> n >> m;\r\n\tfor (int i = 1; i \u003c n; i++)\r\n\t{\r\n\t\tint x, y;\r\n\t\tcin >> x >> y;\r\n\t\tnbr[x].push_back(y);\r\n\t\tnbr[y].push_back(x);\r\n\t}\r\n\t// 1. 确定当前树的重心，设为根结点，开始点分治算法；\r\n\tget_ctr(1, 0);\r\n\twork(ctr);\r\n\tcout \u003c\u003c ans;\r\n\treturn 0;\r\n}\r\n```\r\n\r\n当然此题可以用动态规划，设 $\\mathit{dp}_{x,i}$ 表示以 $x$ 为根的子树中，距离 $x$ 恰好为 $i$ 的点的个数。\r\n```cpp\r\n#include\u003cbits/stdc++.h>\r\ntypedef int int32;\r\n#define int long long\r\nusing namespace std;\r\nconst int N = 5e4 + 5, M = 500 + 5;\r\nint n, m, dp[N][M], ans;\r\nvector\u003cint>nbr[N];\r\nvoid dfs(int x, int fa)\r\n{\r\n\tdp[x][0] = 1;\r\n\tfor (auto& nxt : nbr[x])\r\n\t\tif (nxt != fa)\r\n\t\t{\r\n\t\t\tdfs(nxt, x);\r\n\t\t\tfor (int i = 1; i \u003c= m; i++)\r\n\t\t\t{\r\n\t\t\t\tif (m - i - 1 >= 0)\r\n\t\t\t\t\tans += dp[x][i] * dp[nxt][m - i - 1];\r\n\t\t\t\tdp[x][i] += dp[nxt][i - 1];\r\n\t\t\t}\r\n\t\t}\r\n\tans += dp[x][m];\r\n\treturn;\r\n}\r\nsigned main()\r\n{\r\n\tios::sync_with_stdio(0);\r\n\tcin.tie(0), cout.tie(0);\r\n\tcin >> n >> m;\r\n\tfor (int i = 1; i \u003c n; i++)\r\n\t{\r\n\t\tint x, y;\r\n\t\tcin >> x >> y;\r\n\t\tnbr[x].push_back(y);\r\n\t\tnbr[y].push_back(x);\r\n\t}\r\n\tdfs(1, 0);\r\n\tcout \u003c\u003c ans;\r\n\treturn 0;\r\n}\r\n```\r\n\r\n### CF1101D\r\n[CF1101D - GCD Counting](https://codeforces.com/problemset/problem/1101/D)\r\n\r\n枚举质因数，然后跑 dfs 统计路径长度，这样可以确保 $\\gcd(g(x,cur),g(cur,y))\\gt 1$。\r\n\r\n```cpp\r\n#include\u003cbits/stdc++.h>\r\ntypedef int int32;\r\n#define int long long\r\nusing namespace std;\r\nconst int N = 2e5 + 5;\r\nint n, a[N], b[N], c, d, sz[N], cnt[N], tmp[N], tot, ctr, ans, maxi;\r\nbitset\u003cN>del, vis;\r\nvector\u003cint>nbr[N], e[N];\r\nvoid get_ctr(int x, int fa)\r\n{\r\n\tsz[x] = 1;\r\n\tint maxi = 0;\r\n\tfor (auto& nxt : nbr[x])\r\n\t\tif (!del[nxt] && nxt != fa)\r\n\t\t{\r\n\t\t\tget_ctr(nxt, x);\r\n\t\t\tif (ctr)\r\n\t\t\t\treturn;\r\n\t\t\tmaxi = max(maxi, sz[nxt]);\r\n\t\t\tsz[x] += sz[nxt];\r\n\t\t}\r\n\tmaxi = max(maxi, n - sz[x]);\r\n\tif (maxi \u003c= n / 2)\r\n\t{\r\n\t\tctr = x;\r\n\t\tsz[fa] = n - sz[x];\r\n\t}\r\n\treturn;\r\n}\r\nvoid dfs(int x, int fa, int len, int len1)\r\n{\r\n\tif (len1 == 1) // g(cur,x) 为 1，不满足条件\r\n\t\treturn;\r\n\tans = max(ans, maxi + len - 1);\r\n\ttmp[++tot] = len;\r\n\tfor (auto& nxt : nbr[x])\r\n\t\tif (!del[nxt] && nxt != fa)\r\n\t\t\tdfs(nxt, x, len + 1, __gcd(len1, a[nxt]));\r\n\treturn;\r\n}\r\nvoid work(int x)\r\n{\r\n\tfor (auto& j : e[a[x]])\r\n\t\tif (!(a[x] % b[j])) // 枚举质因数，但是这一行多此一举\r\n\t\t{\r\n\t\t\tmaxi = 1;\r\n\t\t\tfor (auto& nxt : nbr[x])\r\n\t\t\t\tif (!del[nxt] && __gcd(__gcd(a[x], a[nxt]), b[j]) == b[j]) // 只考虑该质因数相同的子树\r\n\t\t\t\t{\r\n\t\t\t\t\tint tmp1 = tot;\r\n\t\t\t\t\tdfs(nxt, x, 2, b[j]);\r\n\t\t\t\t\tfor (int i = tmp1 + 1; i \u003c= tot; i++)\r\n\t\t\t\t\t\tmaxi = max(maxi, tmp[i]);\r\n\t\t\t\t}\r\n\t\t\ttot = 0;\r\n\t\t}\r\n\tdel[x] = true;\r\n\tfor (auto& nxt : nbr[x])\r\n\t\tif (!del[nxt])\r\n\t\t{\r\n\t\t\tn = sz[nxt];\r\n\t\t\tctr = 0;\r\n\t\t\tget_ctr(nxt, 0);\r\n\t\t\twork(ctr);\r\n\t\t}\r\n\treturn;\r\n}\r\nsigned main()\r\n{\r\n\tios::sync_with_stdio(0);\r\n\tcin.tie(0), cout.tie(0);\r\n\tfor (int i = 2; i \u003c= 2e5; i++)\r\n\t{\r\n\t\tif (!vis[i])\r\n\t\t{\r\n\t\t\tb[++c] = i;\r\n\t\t\tfor (int j = i; j \u003c= 2e5; j += i)\r\n\t\t\t\te[j].push_back(c);\r\n\t\t}\r\n\t\tfor (int j = 1; j \u003c= c; j++)\r\n\t\t{\r\n\t\t\tif (i * b[j] > 2e5)\r\n\t\t\t\tbreak;\r\n\t\t\tvis[i * b[j]] = true;\r\n\t\t\tif (!(i % b[j]))\r\n\t\t\t\tbreak;\r\n\t\t}\r\n\t}\r\n\tcin >> n;\r\n\tfor (int i = 1; i \u003c= n; i++)\r\n\t\tcin >> a[i], ans = max\u003cint>(ans, a[i] > 1);\r\n\tfor (int i = 1; i \u003c n; i++)\r\n\t{\r\n\t\tint x, y;\r\n\t\tcin >> x >> y;\r\n\t\tnbr[x].push_back(y);\r\n\t\tnbr[y].push_back(x);\r\n\t}\r\n\tget_ctr(1, 0);\r\n\twork(ctr);\r\n\tcout \u003c\u003c ans;\r\n\treturn 0;\r\n}\r\n```\r\n\r\n### 洛谷 P2634\r\n\r\n[P2634 \\[国家集训队\\] 聪聪可可](https://www.luogu.com.cn/problem/P2634)\r\n\r\n模板题，注意答案需要化简。\r\n\r\n```cpp\r\n#include\u003cbits/stdc++.h>\r\ntypedef int int32;\r\n#define int long long\r\nusing namespace std;\r\nconst int N = 2e4 + 5;\r\nint n, sz[N], cnt[N], tmp[N], tot, ctr, ans;\r\nbitset\u003cN>del;\r\nvector\u003cpair\u003cint, int>>nbr[N];\r\nvoid get_ctr(int x, int fa)\r\n{\r\n\tsz[x] = 1;\r\n\tint maxi = 0;\r\n\tfor (auto& y : nbr[x])\r\n\t{\r\n\t\tauto& nxt = y.first, & w = y.second;\r\n\t\tif (!del[nxt] && nxt != fa)\r\n\t\t{\r\n\t\t\tget_ctr(nxt, x);\r\n\t\t\tif (ctr)\r\n\t\t\t\treturn;\r\n\t\t\tmaxi = max(maxi, sz[nxt]);\r\n\t\t\tsz[x] += sz[nxt];\r\n\t\t}\r\n\t}\r\n\tmaxi = max(maxi, n - sz[x]);\r\n\tif (maxi \u003c= n / 2)\r\n\t{\r\n\t\tctr = x;\r\n\t\tsz[fa] = n - sz[x];\r\n\t}\r\n\treturn;\r\n}\r\nvoid dfs(int x, int fa, int len)\r\n{\r\n\tans += cnt[(3 - len) % 3] + !len;\r\n\ttmp[++tot] = len;\r\n\tfor (auto& y : nbr[x])\r\n\t{\r\n\t\tauto& nxt = y.first, & w = y.second;\r\n\t\tif (!del[nxt] && nxt != fa)\r\n\t\t\tdfs(nxt, x, (len + w) % 3);\r\n\t}\r\n\treturn;\r\n}\r\nvoid work(int x)\r\n{\r\n\tfor (auto& y : nbr[x])\r\n\t{\r\n\t\tauto& nxt = y.first, & w = y.second;\r\n\t\tif (!del[nxt])\r\n\t\t{\r\n\t\t\tint tmp1 = tot;\r\n\t\t\tdfs(nxt, x, w % 3);\r\n\t\t\tfor (int i = tmp1 + 1; i \u003c= tot; i++)\r\n\t\t\t\tcnt[tmp[i]]++;\r\n\t\t}\r\n\t}\r\n\tfor (int i = 1; i \u003c= tot; i++)\r\n\t\tcnt[tmp[i]]--;\r\n\ttot = 0;\r\n\tdel[x] = true;\r\n\tfor (auto& y : nbr[x])\r\n\t{\r\n\t\tauto& nxt = y.first, & w = y.second;\r\n\t\tif (!del[nxt])\r\n\t\t{\r\n\t\t\tn = sz[nxt];\r\n\t\t\tctr = 0;\r\n\t\t\tget_ctr(nxt, 0);\r\n\t\t\twork(ctr);\r\n\t\t}\r\n\t}\r\n\treturn;\r\n}\r\nsigned main()\r\n{\r\n\tios::sync_with_stdio(0);\r\n\tcin.tie(0), cout.tie(0);\r\n\tcin >> n;\r\n\tint m = n;\r\n\tfor (int i = 1; i \u003c n; i++)\r\n\t{\r\n\t\tint x, y, z;\r\n\t\tcin >> x >> y >> z;\r\n\t\tnbr[x].push_back({ y,z });\r\n\t\tnbr[y].push_back({ x,z });\r\n\t}\r\n\tget_ctr(1, 0);\r\n\twork(ctr);\r\n\tint tmp = __gcd(ans * 2 + m, m * m);\r\n\tcout \u003c\u003c (ans * 2 + m) / tmp \u003c\u003c '/' \u003c\u003c m * m / tmp;\r\n\treturn 0;\r\n}\r\n```\r\n\r\n### 洛谷 P4178\r\n[P4178 Tree](https://www.luogu.com.cn/problem/P4178)\r\n\r\n统计答案时记得因为是小于等于 $m$（题目中 $k$）的，所以要查询 $m-{len}+1$ 并且加一。\r\n\r\n```cpp\r\nvoid update(int x, int k)\r\n{\r\n\twhile (x \u003c= m + 1)\r\n\t{\r\n\t\ttree[x] += k;\r\n\t\tx += lowbit(x);\r\n\t}\r\n\treturn;\r\n}\r\nint query(int x)\r\n{\r\n\tint sum = 0;\r\n\twhile (x)\r\n\t{\r\n\t\tsum += tree[x];\r\n\t\tx -= lowbit(x);\r\n\t}\r\n\treturn sum;\r\n}\r\nvoid dfs(int x, int fa, int len)\r\n{\r\n\tif (len > m)\r\n\t\treturn;\r\n\tans += query(m - len + 1) + 1;\r\n\ttmp[++tot] = len;\r\n\tfor (auto& y : nbr[x])\r\n\t{\r\n\t\tauto& nxt = y.first, & w = y.second;\r\n\t\tif (!del[nxt] && nxt != fa)\r\n\t\t\tdfs(nxt, x, len + w);\r\n\t}\r\n\treturn;\r\n}\r\nvoid work(int x)\r\n{\r\n\tfor (auto& y : nbr[x])\r\n\t{\r\n\t\tauto& nxt = y.first, & w = y.second;\r\n\t\tif (!del[nxt])\r\n\t\t{\r\n\t\t\tint tmp1 = tot;\r\n\t\t\tdfs(nxt, x, w);\r\n\t\t\tfor (int i = tmp1 + 1; i \u003c= tot; i++)\r\n\t\t\t\tupdate(tmp[i] + 1, 1);\r\n\t\t}\r\n\t}\r\n\tfor (int i = 1; i \u003c= tot; i++)\r\n\t\tupdate(tmp[i] + 1, -1);\r\n\ttot = 0;\r\n\tdel[x] = true;\r\n\tfor (auto& y : nbr[x])\r\n\t{\r\n\t\tauto& nxt = y.first, & w = y.second;\r\n\t\tif (!del[nxt])\r\n\t\t{\r\n\t\t\tn = sz[nxt];\r\n\t\t\tctr = 0;\r\n\t\t\tget_ctr(nxt, 0);\r\n\t\t\twork(ctr);\r\n\t\t}\r\n\t}\r\n\treturn;\r\n}\r\n```","html":"\u003ch1 id=\"%E7%82%B9%E5%88%86%E6%B2%BB\" tabindex=\"-1\">点分治 \u003ca href=\"#%E7%82%B9%E5%88%86%E6%B2%BB\" class=\"header-anchor\">¶\u003c/a>\u003c/h1>\n\u003cp>点分治，也叫重心剖分，是一种用于树形数据结构的分治思想的算法，解决树上满足条件的路径统计问题。点分治的核心思想是通过选择树的重心结点，将树划分为若干子树，然后递归地在这些子树上应用相同的策略，从而有效地解决问题。\u003c/p>\n\u003ch2 id=\"%E5%AE%9E%E7%8E%B0%E6%AD%A5%E9%AA%A4\" tabindex=\"-1\">实现步骤 \u003ca href=\"#%E5%AE%9E%E7%8E%B0%E6%AD%A5%E9%AA%A4\" class=\"header-anchor\">¶\u003c/a>\u003c/h2>\n\u003col>\n\u003cli>确定当前树的重心，设为根结点，开始点分治算法；\u003c/li>\n\u003cli>枚举下一个结点，通过 dfs 更新子树贡献；\u003c/li>\n\u003cli>清空当前使用的统计答案的数据结构，比如数组或树状数组（不建议完全清零，可能复杂度退化），删除当前结点；\u003c/li>\n\u003cli>递归处理各个子树，回到步骤 \u003cspan tabindex=\"0\" role=\"text\" aria-label=\"1\">\u003cspan class=\"katex\">\u003cspan class=\"katex-mathml\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\">\u003csemantics>\u003cmrow>\u003cmn>1\u003c/mn>\u003c/mrow>\u003cannotation encoding=\"application/x-tex\">1\u003c/annotation>\u003c/semantics>\u003c/math>\u003c/span>\u003cspan class=\"katex-html\" aria-hidden=\"true\">\u003cspan class=\"base\">\u003cspan class=\"strut\" style=\"height:0.6444em;\">\u003c/span>\u003cspan class=\"mord\">1\u003c/span>\u003c/span>\u003c/span>\u003c/span>\u003c/span>。\u003c/li>\n\u003c/ol>\n\u003cp>因为每一次选的是重心，所以每一个划分的子树大小不超过 \u003cspan tabindex=\"0\" role=\"text\" aria-label=\"start fraction, n, divided by, 2, end fraction\">\u003cspan class=\"katex\">\u003cspan class=\"katex-mathml\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\">\u003csemantics>\u003cmrow>\u003cmfrac>\u003cmi>n\u003c/mi>\u003cmn>2\u003c/mn>\u003c/mfrac>\u003c/mrow>\u003cannotation encoding=\"application/x-tex\">\\frac{n}{2}\u003c/annotation>\u003c/semantics>\u003c/math>\u003c/span>\u003cspan class=\"katex-html\" aria-hidden=\"true\">\u003cspan class=\"base\">\u003cspan class=\"strut\" style=\"height:1.0404em;vertical-align:-0.345em;\">\u003c/span>\u003cspan class=\"mord\">\u003cspan class=\"mopen nulldelimiter\">\u003c/span>\u003cspan class=\"mfrac\">\u003cspan class=\"vlist-t vlist-t2\">\u003cspan class=\"vlist-r\">\u003cspan class=\"vlist\" style=\"height:0.6954em;\">\u003cspan style=\"top:-2.655em;\">\u003cspan class=\"pstrut\" style=\"height:3em;\">\u003c/span>\u003cspan class=\"sizing reset-size6 size3 mtight\">\u003cspan class=\"mord mtight\">\u003cspan class=\"mord mtight\">2\u003c/span>\u003c/span>\u003c/span>\u003c/span>\u003cspan style=\"top:-3.23em;\">\u003cspan class=\"pstrut\" style=\"height:3em;\">\u003c/span>\u003cspan class=\"frac-line\" style=\"border-bottom-width:0.04em;\">\u003c/span>\u003c/span>\u003cspan style=\"top:-3.394em;\">\u003cspan class=\"pstrut\" style=\"height:3em;\">\u003c/span>\u003cspan class=\"sizing reset-size6 size3 mtight\">\u003cspan class=\"mord mtight\">\u003cspan class=\"mord mathnormal mtight\">n\u003c/span>\u003c/span>\u003c/span>\u003c/span>\u003c/span>\u003cspan class=\"vlist-s\">​\u003c/span>\u003c/span>\u003cspan class=\"vlist-r\">\u003cspan class=\"vlist\" style=\"height:0.345em;\">\u003cspan>\u003c/span>\u003c/span>\u003c/span>\u003c/span>\u003c/span>\u003cspan class=\"mclose nulldelimiter\">\u003c/span>\u003c/span>\u003c/span>\u003c/span>\u003c/span>\u003c/span>，所以递归的深度为 \u003cspan tabindex=\"0\" role=\"text\" aria-label=\"O, left parenthesis, log, n, right parenthesis\">\u003cspan class=\"katex\">\u003cspan class=\"katex-mathml\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\">\u003csemantics>\u003cmrow>\u003cmi>O\u003c/mi>\u003cmo stretchy=\"false\">(\u003c/mo>\u003cmi>log\u003c/mi>\u003cmo>⁡\u003c/mo>\u003cmi>n\u003c/mi>\u003cmo stretchy=\"false\">)\u003c/mo>\u003c/mrow>\u003cannotation encoding=\"application/x-tex\">O(\\log n)\u003c/annotation>\u003c/semantics>\u003c/math>\u003c/span>\u003cspan class=\"katex-html\" aria-hidden=\"true\">\u003cspan class=\"base\">\u003cspan class=\"strut\" style=\"height:1em;vertical-align:-0.25em;\">\u003c/span>\u003cspan class=\"mord mathnormal\" style=\"margin-right:0.02778em;\">O\u003c/span>\u003cspan class=\"mopen\">(\u003c/span>\u003cspan class=\"mop\">lo\u003cspan style=\"margin-right:0.01389em;\">g\u003c/span>\u003c/span>\u003cspan class=\"mspace\" style=\"margin-right:0.1667em;\">\u003c/span>\u003cspan class=\"mord mathnormal\">n\u003c/span>\u003cspan class=\"mclose\">)\u003c/span>\u003c/span>\u003c/span>\u003c/span>\u003c/span>，每一层递归中需要 \u003cspan tabindex=\"0\" role=\"text\" aria-label=\"O, left parenthesis, n, right parenthesis\">\u003cspan class=\"katex\">\u003cspan class=\"katex-mathml\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\">\u003csemantics>\u003cmrow>\u003cmi>O\u003c/mi>\u003cmo stretchy=\"false\">(\u003c/mo>\u003cmi>n\u003c/mi>\u003cmo stretchy=\"false\">)\u003c/mo>\u003c/mrow>\u003cannotation encoding=\"application/x-tex\">O(n)\u003c/annotation>\u003c/semantics>\u003c/math>\u003c/span>\u003cspan class=\"katex-html\" aria-hidden=\"true\">\u003cspan class=\"base\">\u003cspan class=\"strut\" style=\"height:1em;vertical-align:-0.25em;\">\u003c/span>\u003cspan class=\"mord mathnormal\" style=\"margin-right:0.02778em;\">O\u003c/span>\u003cspan class=\"mopen\">(\u003c/span>\u003cspan class=\"mord mathnormal\">n\u003c/span>\u003cspan class=\"mclose\">)\u003c/span>\u003c/span>\u003c/span>\u003c/span>\u003c/span> 的时间复杂度来处理当前树。即跑点分治实现的时间复杂度为 \u003cspan tabindex=\"0\" role=\"text\" aria-label=\"O, left parenthesis, n, log, n, right parenthesis\">\u003cspan class=\"katex\">\u003cspan class=\"katex-mathml\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\">\u003csemantics>\u003cmrow>\u003cmi>O\u003c/mi>\u003cmo stretchy=\"false\">(\u003c/mo>\u003cmi>n\u003c/mi>\u003cmi>log\u003c/mi>\u003cmo>⁡\u003c/mo>\u003cmi>n\u003c/mi>\u003cmo stretchy=\"false\">)\u003c/mo>\u003c/mrow>\u003cannotation encoding=\"application/x-tex\">O(n \\log n)\u003c/annotation>\u003c/semantics>\u003c/math>\u003c/span>\u003cspan class=\"katex-html\" aria-hidden=\"true\">\u003cspan class=\"base\">\u003cspan class=\"strut\" style=\"height:1em;vertical-align:-0.25em;\">\u003c/span>\u003cspan class=\"mord mathnormal\" style=\"margin-right:0.02778em;\">O\u003c/span>\u003cspan class=\"mopen\">(\u003c/span>\u003cspan class=\"mord mathnormal\">n\u003c/span>\u003cspan class=\"mspace\" style=\"margin-right:0.1667em;\">\u003c/span>\u003cspan class=\"mop\">lo\u003cspan style=\"margin-right:0.01389em;\">g\u003c/span>\u003c/span>\u003cspan class=\"mspace\" style=\"margin-right:0.1667em;\">\u003c/span>\u003cspan class=\"mord mathnormal\">n\u003c/span>\u003cspan class=\"mclose\">)\u003c/span>\u003c/span>\u003c/span>\u003c/span>\u003c/span>（不包含实现的数据结构的时间复杂度）。\u003c/p>\n\u003ch2 id=\"%E4%BE%8B%E9%A2%98\" tabindex=\"-1\">例题 \u003ca href=\"#%E4%BE%8B%E9%A2%98\" class=\"header-anchor\">¶\u003c/a>\u003c/h2>\n\u003ch3 id=\"cf161d\" tabindex=\"-1\">CF161D \u003ca href=\"#cf161d\" class=\"header-anchor\">¶\u003c/a>\u003c/h3>\n\u003cp>\u003ca href=\"https://codeforces.com/problemset/problem/161/D\">CF161D - Distance in Tree\u003c/a> | \u003ca href=\"https://vjudge.net/problem/CodeForces-161D#author=wbw121124\">vjudge\u003c/a>\u003c/p>\n\u003cblockquote>\n\u003cp>给你一棵有 \u003cspan tabindex=\"0\" role=\"text\" aria-label=\"n\">\u003cspan class=\"katex\">\u003cspan class=\"katex-mathml\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\">\u003csemantics>\u003cmrow>\u003cmi>n\u003c/mi>\u003c/mrow>\u003cannotation encoding=\"application/x-tex\">n\u003c/annotation>\u003c/semantics>\u003c/math>\u003c/span>\u003cspan class=\"katex-html\" aria-hidden=\"true\">\u003cspan class=\"base\">\u003cspan class=\"strut\" style=\"height:0.4306em;\">\u003c/span>\u003cspan class=\"mord mathnormal\">n\u003c/span>\u003c/span>\u003c/span>\u003c/span>\u003c/span
