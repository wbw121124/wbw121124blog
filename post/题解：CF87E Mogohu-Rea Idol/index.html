	<script type="application/json" id="post-data">{"id":"题解：CF87E Mogohu-Rea Idol","metadata":{"id":"题解：CF87E Mogohu-Rea Idol","title":"题解：CF87E Mogohu-Rea Idol","date":"2026-04-14","tags":["编程","凸包","闵科夫斯基和"],"summary":"此题目等价于求一个点是否在三个凸多边形的闵科夫斯基和的内部……"},"markdown":"三角形的三个顶点分别为 $A(x_1,y_1),B(x_2,y_2),C(x_2,y_2)$。\r\n\r\n重心的定义：\r\n> 三角形的三条中线交于一点，该交点称作三角形的重心。\r\n\r\n所以重心为 $P=\\frac{A+B+C}{3}$，因此题目等价于求一个点是否在三个凸多边形的闵科夫斯基和的内部。\r\n\r\n可能有精度误差，所以可以把询问的点坐标乘 $3$。\r\n\r\n:::info[代码]{open}\r\n```cpp [149-173]\r\n#include\u003cbits/stdc++.h>\r\ntypedef int int32;\r\n#define int long long\r\nusing namespace std;\r\nconst int N = 5e4 + 5;\r\nnamespace math\r\n{\r\n#include\u003ccmath>\r\n\tusing namespace std;\r\n\tstruct cc {\r\n\t\tint first, second;\r\n\t\tint& x()\r\n\t\t{\r\n\t\t\treturn first;\r\n\t\t}\r\n\t\tint& y()\r\n\t\t{\r\n\t\t\treturn second;\r\n\t\t}\r\n\t\tbool operator==(const cc& u) const\r\n\t\t{\r\n\t\t\treturn first == u.first && second == u.second;\r\n\t\t}\r\n\t\tbool operator\u003c(const cc& u) const\r\n\t\t{\r\n\t\t\tif (first != u.first)\r\n\t\t\t\treturn first \u003c u.first;\r\n\t\t\treturn second \u003c u.second;\r\n\t\t}\r\n\t};  // CartesianPoint: (x, y)\r\n\tcc operator+(const cc& v1, const cc& v2)\r\n\t{\r\n\t\treturn { v1.first + v2.first, v1.second + v2.second };\r\n\t}\r\n\tcc operator-(const cc& v1, const cc& v2)\r\n\t{\r\n\t\treturn { v1.first - v2.first, v1.second - v2.second };\r\n\t}\r\n\tint cross(const cc& v1, const cc& v2)\r\n\t{\r\n\t\treturn v1.first * v2.second - v1.second * v2.first;\r\n\t}\r\n\tint dis(const cc& x, const cc& y)\r\n\t{\r\n\t\tcc tmp = x - y;\r\n\t\treturn tmp.first * tmp.first + tmp.second * tmp.second;\r\n\t}\r\n\tistream& operator>>(istream& in, cc& x)\r\n\t{\r\n\t\treturn in >> x.first >> x.second;\r\n\t}\r\n\tvector\u003ccc>convexHull(vector\u003ccc>a)\r\n\t{\r\n\t\tvector\u003ccc>b;\r\n\t\tint n = a.size();\r\n\t\tfor (int i = 1; i \u003c n; i++)\r\n\t\t\tif (a[i].second > a[0].second || (a[i].second == a[0].second &&\r\n\t\t\t\ta[i].first > a[0].first))\r\n\t\t\t\tswap(a[0], a[i]);\r\n\t\tauto cmp = [&](const cc& x, const cc& y)\r\n\t\t\t{\r\n\t\t\t\tint tmp = cross(x - a[0], y - a[0]);\r\n\t\t\t\tif (abs(tmp))\r\n\t\t\t\t\treturn tmp > 0;\r\n\t\t\t\treturn dis(x, a[0]) \u003c dis(y, a[0]);\r\n\t\t\t};\r\n\t\tsort(a.begin() + 1, a.end(), cmp);\r\n\t\tb = { a[0], a[1] };\r\n\t\tfor (int i = 2; i \u003c n; i++)\r\n\t\t{\r\n\t\t\twhile (b.size() > 1 && cross(b.back() - b[b.size() - 2],\r\n\t\t\t\ta[i] - b.back()) \u003c= 0)\r\n\t\t\t\tb.pop_back();\r\n\t\t\tb.push_back(a[i]);\r\n\t\t}\r\n\t\treturn b;\r\n\t}\r\n\ttemplate\u003ctypename T, typename _T>\r\n\tinline vector\u003cT>converToVector(_T l, _T r)\r\n\t{\r\n\t\tvector\u003cT> a;\r\n\t\twhile (l \u003c r)\r\n\t\t{\r\n\t\t\ta.push_back(*l);\r\n\t\t\tl++;\r\n\t\t}\r\n\t\treturn a;\r\n\t}\r\n\tvector\u003ccc>minkowski(const vector\u003ccc>& a, const vector\u003ccc>& b)\r\n\t{\r\n\t\tvector\u003ccc>c, d, e;\r\n\t\tfor (int i = 1; i \u003c a.size(); i++)\r\n\t\t\tc.push_back(a[i] - a[i - 1]);\r\n\t\tc.push_back(a[0] - a.back());\r\n\t\tfor (int i = 1; i \u003c b.size(); i++)\r\n\t\t\td.push_back(b[i] - b[i - 1]);\r\n\t\td.push_back(b[0] - b.back());\r\n\t\treverse(c.begin(), c.end());\r\n\t\treverse(d.begin(), d.end());\r\n\t\te.push_back(a[0] + b[0]);\r\n\t\twhile (!c.empty() && !d.empty())\r\n\t\t\tif (cross(c.back(), d.back()) >= 0)\r\n\t\t\t{\r\n\t\t\t\te.push_back(e.back() + c.back());\r\n\t\t\t\tc.pop_back();\r\n\t\t\t}\r\n\t\t\telse\r\n\t\t\t{\r\n\t\t\t\te.push_back(e.back() + d.back());\r\n\t\t\t\td.pop_back();\r\n\t\t\t}\r\n\t\twhile (!c.empty())\r\n\t\t{\r\n\t\t\te.push_back(e.back() + c.back());\r\n\t\t\tc.pop_back();\r\n\t\t}\r\n\t\twhile (!d.empty())\r\n\t\t{\r\n\t\t\te.push_back(e.back() + d.back());\r\n\t\t\td.pop_back();\r\n\t\t}\r\n\t\treturn e;\r\n\t}\r\n\tbool in(cc a, const vector\u003ccc>& b)\r\n\t{\r\n\t\tif (cross(b.back() - b[0], a - b[0]) > 0 ||\r\n\t\t\tcross(a - b[0], b[1] - b[0]) > 0)\r\n\t\t\treturn false;\r\n\t\tint l = 1, r = b.size() - 1;\r\n\t\twhile (l + 1 \u003c r)\r\n\t\t{\r\n\t\t\tint mid = (l + r) >> 1;\r\n\t\t\tif (cross(b[mid] - b[0], a - b[0]) > 0)\r\n\t\t\t\tl = mid;\r\n\t\t\telse\r\n\t\t\t\tr = mid;\r\n\t\t\tcerr \u003c\u003c '@' \u003c\u003c l \u003c\u003c ' ' \u003c\u003c r \u003c\u003c '\\n';\r\n\t\t}\r\n\t\treturn cross(b[r] - b[l], a - b[l]) >= 0;\r\n\t}\r\n}\r\nusing namespace math;\r\nint n, m, k, q;\r\ncc a[N], b[N], c[N];\r\nsigned main()\r\n{\r\n\tios::sync_with_stdio(0);\r\n\tcin.tie(0), cout.tie(0);\r\n\tcin >> n;\r\n\tfor (int i = 1; i \u003c= n; i++)\r\n\t\tcin >> a[i];\r\n\tcin >> m;\r\n\tfor (int i = 1; i \u003c= m; i++)\r\n\t\tcin >> b[i];\r\n\tcin >> k;\r\n\tfor (int i = 1; i \u003c= k; i++)\r\n\t\tcin >> c[i];\r\n\tvector\u003ccc> d = convexHull(converToVector\u003ccc>(a + 1, a + 1 + n)),\r\n\t\te = convexHull(converToVector\u003ccc>(b + 1, b + 1 + m)),\r\n\t\tf = convexHull(converToVector\u003ccc>(c + 1, c + 1 + k));\r\n\td = convexHull(minkowski(minkowski(d, e), f));\r\n\tfor (auto& x : d)\r\n\t\tcerr \u003c\u003c '#' \u003c\u003c x.first \u003c\u003c ' ' \u003c\u003c x.second \u003c\u003c '\\n';\r\n\tcin >> q;\r\n\twhile (q--)\r\n\t{\r\n\t\tcc x;\r\n\t\tcin >> x;\r\n\t\tx.x() *= 3;\r\n\t\tx.y() *= 3;\r\n\t\tcerr \u003c\u003c x.first \u003c\u003c ' ' \u003c\u003c x.second \u003c\u003c '\\n';\r\n\t\tcout \u003c\u003c (in(x, d) ? \"YES\" : \"NO\") \u003c\u003c '\\n';\r\n\t}\r\n\treturn 0;\r\n}\r\n```\r\n:::","html":"\u003cp>三角形的三个顶点分别为 \u003cspan tabindex=\"0\" role=\"text\" aria-label=\"A, left parenthesis, x, start subscript, 1, end subscript, comma, y, start subscript, 1, end subscript, right parenthesis, comma, B, left parenthesis, x, start subscript, 2, end subscript, comma, y, start subscript, 2, end subscript, right parenthesis, comma, C, left parenthesis, x, start subscript, 2, end subscript, comma, y, start subscript, 2, end subscript, right parenthesis\">\u003cspan class=\"katex\">\u003cspan class=\"katex-mathml\">\u003cmath xmlns=\"http://www.w3.org/1998/Math/MathML\">\u003csemantics>\u003cmrow>\u003cmi>A\u003c/mi>\u003cmo stretchy=\"false\">(\u003c/mo>\u003cmsub>\u003cmi>x\u003c/mi>\u003cmn>1\u003c/mn>\u003c/msub>\u003cmo separator=\"true\">,\u003c/mo>\u003cmsub>\u003cmi>y\u003c/mi>\u003cmn>1\u003c/mn>\u003c/msub>\u003cmo stretchy=\"false\">)\u003c/mo>\u003cmo separator=\"true\">,\u003c/mo>\u003cmi>B\u003c/mi>\u003cmo stretchy=\"false\">(\u003c/mo>\u003cmsub>\u003cmi>x\u003c/mi>\u003cmn>2\u003c/mn>\u003c/msub>\u003cmo separator=\"true\">,\u003c/mo>\u003cmsub>\u003cmi>y\u003c/mi>\u003cmn>2\u003c/mn>\u003c/msub>\u003cmo stretchy=\"false\">)\u003c/mo>\u003cmo separator=\"true\">,\u003c/mo>\u003cmi>C\u003c/mi>\u003cmo stretchy=\"false\">(\u003c/mo>\u003cmsub>\u003cmi>x\u003c/mi>\u003cmn>2\u003c/mn>\u003c/msub>\u003cmo separator=\"true\">,\u003c/mo>\u003cmsub>\u003cmi>y\u003c/mi>\u003cmn>2\u003c/mn>\u003c/msub>\u003cmo stretchy=\"false\">)\u003c/mo>\u003c/mrow>\u003cannotation encoding=\"application/x-tex\">A(x_1,y_1),B(x_2,y_2),C(x_2,y_2)\u003c/annotation>\u003c/semantics>\u003c/math>\u003c/span>\u003cspan class=\"katex-html\" aria-hidden=\"true\">\u003cspan class=\"base\">\u003cspan class=\"strut\" style=\"height:1em;vertical-align:-0.25em;\">\u003c/span>\u003cspan class=\"mord mathnormal\">A\u003c/span>\u003cspan class=\"mopen\">(\u003c/span>\u003cspan class=\"mord\">\u003cspan class=\"mord mathnormal\">x\u003c/span>\u003cspan class=\"msupsub\">\u003cspan class=\"vlist-t vlist-t2\">\u003cspan class=\"vlist-r\">\u003cspan class=\"vlist\" style=\"height:0.3011em;\">\u003cspan style=\"top:-2.55em;margin-left:0em;margin-right:0.05em;\">\u003cspan class=\"pstrut\" style=\"height:2.7em;\">\u003c/span>\u003cspan class=\"sizing reset-size6 size3 mtight\">\u003cspan class=\"mord mtight\">1\u003c/span>\u003c/span>\u003c/span>\u003c/span>\u003cspan class=\"vlist-s\">​\u003c/span>\u003c/span>\u003cspan class=\"vlist-r\">\u003cspan class=\"vlist\" style=\"height:0.15em;\">\u003cspan>\u003c
